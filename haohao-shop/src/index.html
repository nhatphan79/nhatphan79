<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HaoHao Store – Mua sắm thông minh</title>
<meta name="description" content="HaoHao Store: sản phẩm chọn lọc, so sánh giá Shopee – TikTok Shop, mua sắm thông minh cùng HaoHao.">
<meta name="theme-color" content="#FFF4E8">
<link rel="icon" href="__HHICON__">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- © 2026 HaoHao – Phan Thanh Nhật. HaoHao Store: web mua sắm tiếp thị (Shopee / TikTok Shop) -->
<style>
:root{--bg:#FFF7EE;--card:#FFFFFF;--ink:#1F2433;--mu:#8A8F9E;--ln:#F1E7DA;--or:#FF6A13;--or2:#FF8A3D;--orS:#FFEEDD;--red:#F04E23;--star:#FFB400;--r:16px;--sh:0 4px 16px rgba(60,40,20,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Be Vietnam Pro",system-ui,-apple-system,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
img{display:block;max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
/* ---- desktop top bar ---- */
.dtop{display:none}
/* ---- page header (inner pages) ---- */
.ph-h{position:sticky;top:0;z-index:20;background:rgba(255,247,238,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px}
.ph-h h1{margin:0;font-size:22px;font-weight:800;flex:1;letter-spacing:-.3px}
.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;flex:none}
.ib svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2}
/* ---- home hero ---- */
.hero{position:relative;background:linear-gradient(180deg,#FFE9D2 0%,#FFF4E8 70%,var(--bg) 100%);padding:22px 16px 18px;overflow:hidden;border-radius:0 0 26px 26px}
.hero .wrap{position:relative;padding:0}
.brand{font-size:40px;font-weight:900;line-height:1;letter-spacing:-1px;color:var(--or);margin:8px 0 8px;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.brand span{color:#FF8A00}
.tagl{font-size:14px;font-weight:600;color:#4A4F5C;max-width:58%}
.mascot{position:absolute;right:-6px;top:-8px;width:150px;height:150px;filter:drop-shadow(0 8px 14px rgba(255,120,30,.25))}
.mascot img{width:100%;height:100%;object-fit:contain}
.spark{position:absolute;font-size:18px;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{transform:scale(1.25) rotate(12deg);opacity:.7}}
.hsr{position:relative;margin-top:34px;display:flex;align-items:center;background:#fff;border-radius:999px;padding:5px 5px 5px 18px;box-shadow:0 6px 18px rgba(255,106,19,.12)}
.hsr input{flex:1;border:0;outline:0;font:inherit;font-size:14.5px;background:none;min-width:0;color:var(--ink)}
.hsr button{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--or2),var(--or));display:grid;place-items:center;flex:none}
.hsr button svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.4}
/* ---- category icons ---- */
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;padding:18px 0 6px}
.ci{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;font-size:12.5px;font-weight:500;line-height:1.25;color:#3A3F4C}
.ci .ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:#fff;box-shadow:var(--sh)}
/* ---- sections ---- */
.sh{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px}
.sh h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.2px}
.sh a{font-size:13px;font-weight:600;color:#5A5F6C;display:flex;align-items:center;gap:2px}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:44%;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;scroll-snap-type:x mandatory}.row::-webkit-scrollbar{display:none}.row>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
/* ---- product card ---- */
.pc{position:relative;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column}
.pc .im{position:relative;aspect-ratio:1/.95;background:var(--orS);overflow:hidden}
.pc .im img{width:100%;height:100%;object-fit:cover}
.phd{width:100%;height:100%;display:grid;place-items:center;font-size:56px}
.hrt{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.hrt svg{width:16px;height:16px;fill:none;stroke:var(--red);stroke-width:2.2}
.hrt.on svg{fill:var(--red)}
.pc .bd{padding:9px 10px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
.pc .nm{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.prc{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.prc b{font-size:15.5px;font-weight:800;color:var(--red)}.prc s{font-size:11.5px;color:var(--mu)}
.offp{font-size:11px;font-weight:700;color:var(--red)}
.src{display:flex;align-items:center;gap:5px;font-size:12px;color:#4A4F5C;font-weight:500}
.lg{width:15px;height:15px;border-radius:4px;display:grid;place-items:center;font-size:9px;font-weight:900;color:#fff;flex:none}
.lg.shopee{background:#EE4D2D}.lg.tiktok{background:#111}.lg.lazada{background:linear-gradient(135deg,#F0249C,#3A1CE6)}
.rt{display:flex;align-items:center;gap:4px;font-size:12px;color:#4A4F5C}
.rt i{color:var(--star);font-style:normal}
.rt em{font-style:normal;color:var(--mu)}
/* ---- tabs ---- */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--ln);padding:0 16px;overflow-x:auto;scrollbar-width:none;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tabs button,.tabs a{position:relative;padding:12px 0;font-size:14px;font-weight:600;color:#5A5F6C;white-space:nowrap;display:flex;align-items:center;gap:4px}
.tabs .on{color:var(--or)}.tabs .on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;border-radius:2px;background:var(--or)}
.cnt{font-size:12.5px;color:var(--mu);margin:12px 0}
/* search bar (inner) */
.isr{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:0 12px;height:40px}
.isr input{flex:1;border:0;outline:0;font:inherit;background:none;min-width:0;color:var(--ink)}
/* ---- detail ---- */
.dimg{position:relative;background:var(--orS);border-radius:0 0 24px 24px;overflow:hidden}
.dimg .tr{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.dimg .tr::-webkit-scrollbar{display:none}
.dimg .tr>*{flex:none;width:100%;aspect-ratio:1/.92;scroll-snap-align:start}
.dimg .tr img{width:100%;height:100%;object-fit:cover}
.dimg .phd{font-size:120px}
.fab{position:absolute;top:calc(12px + env(safe-area-inset-top));width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.fab svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2.1}
.fab.l{left:14px}.fab.r1{right:14px}.fab.r2{right:62px}
.fab.on svg{fill:var(--red);stroke:var(--red)}
.fab.hv svg{stroke:var(--red)}
.dn{position:absolute;right:14px;bottom:14px;background:rgba(31,36,51,.72);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.dbody{padding:16px}
.dbody h1{margin:0 0 10px;font-size:18px;font-weight:700;line-height:1.35}
.dbody .prc b{font-size:24px}.dbody .prc s{font-size:14px}
.pill{font-size:12px;font-weight:700;color:#fff;background:var(--red);padding:2px 7px;border-radius:6px}
.rl{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:#4A4F5C}
.dsep{height:8px;background:#F6EEE4;margin:14px -16px}
.ship{display:grid;gap:9px;font-size:13.5px}
.ship .src{font-size:14.5px;font-weight:700;color:var(--ink)}.ship .src .lg{width:20px;height:20px;font-size:11px;border-radius:5px}
.ship div{display:flex;align-items:center;gap:10px;color:#3A3F4C}
.ship svg{width:18px;height:18px;fill:none;stroke:#5A5F6C;stroke-width:1.8;flex:none}
.dt-h{font-size:15px;font-weight:700;margin:0 0 10px}
.vars{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.vars::-webkit-scrollbar{display:none}
.vars button{flex:none;width:58px;height:58px;border-radius:10px;overflow:hidden;border:1.5px solid var(--ln);background:var(--orS)}
.vars button.on{border-color:var(--or)}
.vars .phd{font-size:26px}
.pros{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.pros li{display:flex;gap:8px;font-size:13.5px}.pros li::before{content:"✓";color:var(--or);font-weight:800}
.desc{margin:0;font-size:13.5px;color:#4A4F5C;white-space:pre-line}
.cmpl{display:flex;align-items:center;justify-content:space-between;background:var(--orS);border-radius:12px;padding:11px 14px;font-weight:600;font-size:13.5px}
.cmpl b{color:var(--or)}
.buyb{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;box-shadow:0 -4px 16px rgba(0,0,0,.05);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px}
.cartb{flex:none;width:58px;height:48px;border-radius:12px;border:1.5px solid var(--or);display:grid;place-items:center}
.cartb svg{width:24px;height:24px;fill:none;stroke:var(--or);stroke-width:2}
.buy{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--or2),var(--or));color:#fff;font-weight:700;font-size:15.5px;box-shadow:0 6px 16px rgba(255,106,19,.3)}
.buy svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2}
.affn{font-size:11.5px;color:var(--mu);text-align:center;margin:12px 0 0}
/* ---- category page ---- */
.cpage{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;padding:10px 16px 20px}
.cpage .ic{width:64px;height:64px;border-radius:18px;font-size:32px}
/* ---- deals ---- */
.dealh{position:relative;padding:8px 16px 14px;overflow:hidden}
.dealh h1{margin:4px 0 12px;font-size:26px;font-weight:800;letter-spacing:-.4px}
.cd{display:inline-flex;flex-direction:column;gap:6px;background:#FFE7D0;padding:10px 14px;border-radius:14px}
.cd small{font-size:13px;color:var(--or);font-weight:600}
.cd .t{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--ink)}
.cd .t b{background:var(--or);color:#fff;font-size:17px;min-width:38px;text-align:center;padding:6px 6px;border-radius:8px}
.dealh .mascot{width:120px;height:120px;top:6px;right:4px}
/* ---- compare ---- */
.cmph{display:flex;gap:14px;align-items:center;background:#fff;border-radius:var(--r);padding:12px;box-shadow:var(--sh);margin:6px 16px 18px}
.cmph .im{width:110px;height:110px;border-radius:12px;overflow:hidden;flex:none;background:var(--orS)}
.cmph .im img{width:100%;height:100%;object-fit:cover}.cmph .phd{font-size:48px}
.cmph b{display:block;font-size:15px;line-height:1.35;margin-bottom:6px}
.offers{display:grid;gap:10px;padding:0 16px}
.of{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}
.of .lg{width:36px;height:36px;border-radius:9px;font-size:16px}
.of .t{flex:1}.of .t b{display:block;font-size:14px}.of .t span{font-size:15.5px;font-weight:800;color:var(--red)}
.of .t span.best{color:var(--or)}
.of a{padding:9px 16px;border-radius:10px;font-weight:700;font-size:13px;color:#fff;background:var(--or)}
.of a.tiktok{background:#111}.of a.lazada{background:#4C2FE8}
.note{font-size:12px;color:var(--mu);padding:12px 16px}
.tip{display:flex;gap:12px;align-items:center;background:#FFF1E2;border-radius:14px;padding:12px 14px;margin:4px 16px}
.tip img{width:56px;height:56px;flex:none}.tip b{color:var(--or);display:block;margin-bottom:2px}.tip span{font-size:13px;color:#4A4F5C}
/* ---- favorites list ---- */
.fl{display:grid;gap:12px;padding:12px 16px}
.fi{display:flex;gap:12px;background:#fff;border-radius:var(--r);padding:10px;box-shadow:var(--sh);position:relative}
.fi .im{width:92px;height:92px;border-radius:12px;overflow:hidden;flex:none;background:var(--orS)}
.fi .im img{width:100%;height:100%;object-fit:cover}.fi .phd{font-size:40px}
.fi .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-right:26px}
.fi .t b{font-size:13.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fi .hx{position:absolute;top:10px;right:10px}
.fi .hx svg{width:22px;height:22px;fill:var(--red);stroke:var(--red);stroke-width:2}
/* ---- profile ---- */
.prof{display:flex;align-items:center;gap:14px;padding:18px 16px 20px}
.prof img{width:76px;height:76px;border-radius:50%;background:#FFE3C8}
.prof b{display:block;font-size:17px}.prof span{font-size:13.5px;color:#4A4F5C}
.menu{background:#fff;border-radius:var(--r);margin:0 16px 14px;box-shadow:var(--sh);overflow:hidden}
.menu a,.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;font-size:14.5px;font-weight:500;text-align:left;border-bottom:1px solid #F6EFE6}
.menu>*:last-child{border-bottom:0}
.menu svg{width:21px;height:21px;fill:none;stroke:var(--or);stroke-width:1.9;flex:none}
.menu .chev{margin-left:auto;stroke:#9AA0AE;width:18px;height:18px}
/* ---- tab bar ---- */
.tb{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;box-shadow:0 -2px 14px rgba(0,0,0,.05);display:flex;padding:7px 0 calc(6px + env(safe-area-inset-bottom))}
.tb a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:#8A8F9E;position:relative}
.tb a svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8}
.tb a.on{color:var(--or);font-weight:700}.tb a.on svg{fill:var(--or);stroke:var(--or)}
.tb a.on svg .ho{stroke:#fff}
.badge{position:absolute;top:-3px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:9.5px;font-weight:700;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
/* misc */
.empty{text-align:center;padding:50px 24px;color:var(--mu)}.empty img{width:88px;margin:0 auto 10px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.ft{text-align:center;font-size:11.5px;color:var(--mu);padding:22px 16px 26px}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,16px);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;opacity:0;transition:all .25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.pad{padding:0 16px}
/* ---- máy tính ---- */
@media (min-width:860px){
  body{padding-bottom:0}
  .tb{display:none}
  .dtop{display:block;position:sticky;top:0;z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
  .dtop .wrap{display:flex;align-items:center;gap:22px;height:64px}
  .dtop .lo{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:900;color:var(--or)}.dtop .lo img{width:40px;height:40px}
  .dtop nav{display:flex;gap:4px}.dtop nav a{padding:8px 14px;border-radius:999px;font-weight:600;color:#5A5F6C}.dtop nav a.on{background:var(--orS);color:var(--or)}
  .dtop .isr{max-width:420px;margin-left:auto}
  main{max-width:1180px;margin:0 auto}
  .ph-h{position:static;background:none;backdrop-filter:none}
  .hero{border-radius:24px;margin:18px 16px 0;padding:34px 40px 30px}
  .brand{font-size:56px}.tagl{font-size:17px}.mascot{width:220px;height:220px;right:30px;top:-10px}
  .hsr{max-width:560px}
  .cgrid{grid-template-columns:repeat(8,1fr)}
  .grid{grid-template-columns:repeat(4,1fr);gap:18px}
  .row{grid-auto-columns:calc((100% - 54px)/4);gap:18px}
  .cpage{grid-template-columns:repeat(8,1fr)}
  .detail{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding:18px 16px;align-items:start}
  .dimg{border-radius:24px;position:sticky;top:84px}
  .buyb{position:static;box-shadow:none;background:none;padding:16px 0 0}
  .fl{grid-template-columns:repeat(2,1fr)}
  .menu,.prof{max-width:620px}
}
</style>
</head>
<body>
<header class="dtop"><div class="wrap">
  <a class="lo" href="#/"><img src="__HHICON__" alt="">HaoHao Store</a>
  <nav id="dnav"><a href="#/" data-r="home">Trang chủ</a><a href="#/danh-muc" data-r="cats">Danh mục</a><a href="#/uu-dai" data-r="deal">Ưu đãi</a><a href="#/yeu-thich" data-r="fav">Yêu thích</a><a href="#/ca-nhan" data-r="me">Cá nhân</a></nav>
  <label class="isr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8F9E" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="dq" type="search" placeholder="Bạn muốn tìm gì hôm nay?" aria-label="Tìm sản phẩm"></label>
</div></header>
<main id="app"></main>
<nav class="tb" id="tb">
  <a href="#/" data-r="home"><svg viewBox="0 0 24 24"><path d="M3.5 11L12 4l8.5 7v8.5a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>Trang chủ</a>
  <a href="#/danh-muc" data-r="cats"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>Danh mục</a>
  <a href="#/yeu-thich" data-r="fav"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg>Yêu thích<span class="badge" id="fb" hidden></span></a>
  <a href="#/uu-dai" data-r="deal"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path class="ho" d="M10 20.5a2 2 0 0 0 4 0"/></svg>Thông báo</a>
  <a href="#/ca-nhan" data-r="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0z"/></svg>Cá nhân</a>
</nav>
<div class="toast" id="toast"></div>
<script>
const ICON = '__HHICON__';
// ---- dữ liệu: máy chủ trả /api/store; chưa có máy chủ thì dùng dữ liệu mẫu ----
const SAMPLE = {
  shop: { name: 'HaoHao', tagline: 'Mua sắm thông minh cùng HaoHao 🐹', deals: 'Ưu đãi hôm nay' },
  cats: [
    { id: 'nu', name: 'Thời trang Nữ', e: '👚', bg: '#FFE4E1', home: 1 },
    { id: 'nam', name: 'Thời trang Nam', e: '👕', bg: '#E1ECFF', home: 1 },
    { id: 'tre-em', name: 'Thời trang Trẻ em', e: '🧸', bg: '#FFE8F0', home: 1 },

  $('#shr').addEventListener('click', async () => { try { if (navigator.share) await navigator.share({ title: p.name, url: location.href }); else { await navigator.clipboard.writeText(location.href); toast('Đã chép link'); } } catch {} });

// ---- điều hướng ----
function route() {
  const h = location.hash.replace(/^#\/?/, ''), [a, b] = h.split('/'), v = decodeURIComponent(b || '');
  clearInterval(cdT); let r = 'home';
  if (a === 'p' && b) { r = 'p'; detail(v); }
  else if (a === 'c') { r = 'cats'; lsSrc = 'all'; list('', v); }
  else if (a === 'nguon') { r = 'cats'; lsSrc = v; list(''); }
  else if (a === 'tim') { r = 'home'; list(v); }
  else if (a === 'danh-muc') { r = 'cats'; cats(); }
  else if (a === 'uu-dai') { r = 'deal'; deals(); }
  else if (a === 'so-sanh') { r = 'p'; compare(v); }
  else if (a === 'yeu-thich') { r = 'fav'; fav(); }
  else if (a === 'ca-nhan') { r = 'me'; me(); }
  else if (a === 'da-xem') { r = 'me'; seenPage(); }
  else home();
  document.querySelectorAll('[data-r]').forEach(x => x.classList.toggle('on', x.dataset.r === r));
  $('#tb').hidden = r === 'p';
  if (a !== 'tim') scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const f = e.target.closest('[data-fav]'); if (f) { e.preventDefault(); e.stopPropagation(); togFav(f.dataset.fav); if (location.hash.startsWith('#/yeu-thich')) fav(); else f.classList.toggle('on', isFav(f.dataset.fav)); return; }
  const bk = e.target.closest('[data-back]'); if (bk) { e.preventDefault(); if (history.length > 1) history.back(); else location.hash = '#/'; return; }
  const b = e.target.closest('[data-buy]'); if (b) ping('buy', b.dataset.buy, b.dataset.bsrc || '');
});
$('#dq').addEventListener('keydown', e => { if (e.key === 'Enter') location.hash = '#/tim/' + encodeURIComponent(e.target.value.trim()); });
addEventListener('hashchange', route);
badge();
fetch('/api/store', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => { if (j && Array.isArray(j.products) && j.products.length) { D = { ...SAMPLE, ...j, shop: { ...SAMPLE.shop, ...(j.shop || {}) } }; route(); } }).catch(() => {});
route();
