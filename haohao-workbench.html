<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xưởng code HaoHao</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --bg: #EAF1FF; --panel: #FFFDF6; --ink: #23305E; --soft: #5B648A; --line: #C9CEDF;
  --honey: #F2B544; --honey-deep: #D98E1F; --coral: #E85D5D; --mint: #2F9E7E;
  --code-bg: #1C2547; --code-fg: #E6EAF8; --gutter: #6E78A3; --code-line: #2A3663;
  --ui: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #10172F; --panel: #172042; --ink: #E6EAF8; --soft: #A3ABCB; --line: #34406B; --code-bg: #0D1330; --code-line: #1E2850; }
}
:root[data-theme="dark"] { --bg: #10172F; --panel: #172042; --ink: #E6EAF8; --soft: #A3ABCB; --line: #34406B; --code-bg: #0D1330; --code-line: #1E2850; }
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--ui); display: flex; flex-direction: column; overflow: hidden; }

header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--honey); color: #23305E; flex-wrap: wrap; }
header img { width: 38px; height: 38px; transform: rotate(-6deg); }
header h1 { font-size: 18px; font-weight: 800; margin: 0; }
header p { margin: 0; font-size: 13px; flex: 1; min-width: 180px; }
.btn { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 10px; font: 600 13.5px/1.2 var(--ui); background: #23305E; color: #fff; white-space: nowrap; }
.btn.ghost { background: transparent; color: inherit; box-shadow: inset 0 0 0 2px currentColor; }
.btn.sm { padding: 5px 9px; font-size: 12.5px; }
.btn:focus-visible { outline: 3px solid var(--honey-deep); outline-offset: 2px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn[hidden] { display: none; }
#run { background: var(--honey); color: #23305E; }

.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 210px minmax(0, 1.15fr) minmax(0, 1fr); }

/* danh sách file */
.files { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.files h2, .pv-head h2 { font-size: 13px; font-weight: 800; margin: 0; padding: 12px 14px 6px; }
#fileList { list-style: none; margin: 0; padding: 0 8px; overflow-y: auto; flex: 1; }
#fileList button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border-radius: 8px; font: 13px/1.3 var(--mono); }
#fileList button:hover { background: color-mix(in srgb, var(--honey) 22%, transparent); }
#fileList button.on { background: var(--honey); color: #23305E; font-weight: 600; }
#fileList button:focus-visible { outline: 2px solid var(--honey-deep); }
#fileList .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); margin-left: auto; flex: none; }
#fileList .kind { font-size: 10.5px; padding: 1px 5px; border-radius: 4px; background: var(--line); color: var(--ink); font-family: var(--ui); font-weight: 600; flex: none; }
.newfile { padding: 10px; border-top: 1px dashed var(--line); display: flex; gap: 6px; }
.newfile input { flex: 1; min-width: 0; font: 12.5px var(--mono); padding: 6px 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
.newfile input:focus { outline: none; border-color: var(--honey-deep); }
.newfile .btn { background: var(--ink); color: var(--panel); }

/* trình soạn */
.editor { display: flex; flex-direction: column; min-height: 0; background: var(--code-bg); color: var(--code-fg); }
.ed-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--code-line); flex-wrap: wrap; }
.ed-bar .name { font: 600 13px var(--mono); }
.ed-bar .hint { font-size: 12px; color: var(--gutter); margin-right: auto; }
.ed-bar .btn.ghost { color: var(--code-fg); }
.ed-body { flex: 1; min-height: 0; display: flex; position: relative; }
#gutter { padding: 12px 8px 12px 12px; text-align: right; color: var(--gutter); font: 13px/1.6 var(--mono); user-select: none; overflow: hidden; white-space: pre; min-width: 46px; }
#code { flex: 1; resize: none; border: 0; outline: none; background: transparent; color: var(--code-fg); font: 13px/1.6 var(--mono); padding: 12px 14px 40px 6px; tab-size: 2; white-space: pre; overflow: auto; caret-color: var(--honey); }
#code::selection { background: #3D4F8F; }
.imgview { flex: 1; display: grid; place-items: center; gap: 10px; color: var(--gutter); text-align: center; padding: 20px; }
.imgview img { image-rendering: auto; max-width: 128px; background: repeating-conic-gradient(#2A3663 0 25%, transparent 0 50%) 0 0 / 16px 16px; border-radius: 8px; }
.status { display: flex; gap: 14px; padding: 5px 12px; font: 12px var(--mono); color: var(--gutter); border-top: 1px solid var(--code-line); }

/* xem thử */
.preview { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
.pv-head { display: flex; align-items: center; gap: 6px; padding: 6px 10px 6px 0; flex-wrap: wrap; }
.pv-head h2 { padding-right: 4px; }
.tabs { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; }
.tabs button { all: unset; cursor: pointer; padding: 5px 10px; border-radius: 8px; font-weight: 600; font-size: 12.5px; }
.tabs button.on { background: var(--ink); color: var(--panel); }
.tabs button:focus-visible { outline: 2px solid var(--honey-deep); }
.frames { flex: 1; min-height: 0; position: relative; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #fff; }
.frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
#deskWrap { position: absolute; inset: 0; background: linear-gradient(135deg, #2B5876, #4E4376); overflow: hidden; }
.desk-bg span { position: absolute; left: 14px; top: 10px; color: rgba(255,255,255,.7); font-size: 12px; font-weight: 600; }
#fDesk { position: absolute; inset: auto 18px 18px auto !important; width: 374px !important; height: 320px !important; border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
.sim { display: flex; gap: 6px; padding: 8px 10px; flex-wrap: wrap; align-items: center; }
.sim span { font-size: 12.5px; color: var(--soft); margin-right: 2px; }
.sim .btn { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
#console { height: 130px; overflow: auto; margin: 0; padding: 8px 12px; font: 12px/1.5 var(--mono); background: var(--code-bg); color: var(--code-fg); border-top: 1px solid var(--line); }
#console .warn { color: #F7C66B; } #console .error { color: #FF8C8C; } #console .info { color: #8FD9C0; }
#console:empty::before { content: "Nhật ký chạy thử hiện ở đây: lỗi code, console.log, tin nhắn gửi cho background."; color: var(--gutter); }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: 12px; font-weight: 600; font-size: 13.5px; z-index: 10; max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }

@media (max-width: 1100px) {
  .layout { grid-template-columns: 180px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
  .files { grid-row: 1 / 3; }
  .preview { border-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 700px) {
  body { overflow: auto; }
  .layout { display: flex; flex-direction: column; }
  .files { max-height: none; border-right: 0; }
  #fileList { display: flex; overflow-x: auto; gap: 4px; padding-bottom: 8px; }
  #fileList button { width: auto; white-space: nowrap; }
  .editor { height: 60vh; }
  .preview { height: 80vh; }
  header p { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

  <h1>Xưởng code HaoHao</h1>
  <p>Sửa code, bấm Chạy thử để xem ngay, xong thì tải file zip về cài vào Chrome.</p>
  <button class="btn ghost" id="resetAll">Khôi phục tất cả</button>
  <button class="btn" id="zip">Tải file zip</button>
</header>

<div class="layout">
  <nav class="files" aria-label="Các file của tiện ích">
    <h2>File</h2>
    <ul id="fileList"></ul>
    <div class="newfile">
      <input id="newName" placeholder="ten-file.js" aria-label="Tên file mới">
      <button class="btn sm" id="addFile">Thêm</button>
    </div>
  </nav>

  <section class="editor" aria-label="Trình soạn code">
    <div class="ed-bar">
      <span class="name" id="curName"></span>
      <span class="hint">Ctrl+S để lưu và chạy thử</span>
      <button class="btn sm ghost" id="restore">Khôi phục bản gốc</button>
      <button class="btn sm ghost" id="delFile" hidden>Xoá file</button>
      <button class="btn sm" id="run">Chạy thử</button>
    </div>
    <div class="ed-body" id="edBody">
      <div id="gutter" aria-hidden="true"></div>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Nội dung file"></textarea>
    </div>
    <div class="status"><span id="pos">Dòng 1, cột 1</span><span id="size"></span><span id="saved"></span></div>
  </section>

  <section class="preview" aria-label="Xem thử">
    <div class="pv-head">
      <h2>Xem thử</h2>
      <div class="tabs" role="tablist">
        <button role="tab" data-pv="demo" class="on">Trang web mẫu</button>
        <button role="tab" data-pv="shopee">Shopee mẫu</button>
        <button role="tab" data-pv="tiktok">TikTok mẫu</button>
        <button role="tab" data-pv="yt">YouTube mẫu</button>
        <button role="tab" data-pv="options">Trang cài đặt</button>
        <button role="tab" data-pv="desk">Ra màn hình</button>
      </div>
    </div>
    <div class="frames">
      <iframe id="fDemo" title="Trang web mẫu có HaoHao"></iframe>
      <iframe id="fOptions" title="Trang cài đặt HaoHao" hidden></iframe>
      <iframe id="fYt" title="Trang YouTube mẫu có HaoHao" hidden></iframe>
      <iframe id="fShopee" title="Trang Shopee mẫu có HaoHao" hidden></iframe>
      <iframe id="fTikTok" title="Trang TikTok Shop mẫu có HaoHao" hidden></iframe>
      <div id="deskWrap" hidden><div class="desk-bg"><span>Màn hình Windows (giả lập)</span></div><iframe id="fDesk" title="Cửa sổ HaoHao trên màn hình"></iframe></div>
    </div>
    <div class="sim">
      <span>Giả lập:</span>
      <button class="btn sm" id="simBell">Chuông nhắc</button>
      <button class="btn sm" id="simMail">Email mới</button>
      <button class="btn sm" id="simPomo">Hết phiên 🍅</button>
      <button class="btn sm" id="simRemind">Việc đến hạn</button>
      <button class="btn sm" id="simPrice">Giá chạm mốc</button>
      <button class="btn sm" id="resetData">Đặt lại dữ liệu thử</button>
    </div>
    <pre id="console" aria-live="polite"></pre>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const ORIGINAL = {"alert.js": "// © 2026 HaoHao – Bản quyền thuộc Phan Thanh Nhật (0366.159.790). Mọi quyền được bảo lưu.\nconst $ = s => document.querySelector(s);\nlet items = [], knocks = 0, ac = null, soundOn = true, closing = false;\nconst MAX_KNOCKS = 6, KNOCK_EVERY = 45000;\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\n\nasync function load() {\n  const [{ deskQueue = [] }, { settings = {} }] = await Promise.all([\n    chrome.storage.session.get('deskQueue'), chrome.storage.local.get('settings')\n  ]);\n  soundOn = settings.sound !== false;\n  const grew = deskQueue.length > items.length;\n  items = deskQueue;\n  if (!items.length) { closing = true; window.close(); return; }\n  render();\n  if (grew) knock();\n}\n\nfunction render() {\n  $('#head').textContent = items.length > 1 ? `Cốc cốc! Có ${items.length} lời nhắc` : items[0].kind === 'mail' ? 'Cốc cốc! Có thư mới' : 'Cốc cốc! Tới giờ rồi';\n  $('#sub').textContent = items.length > 1 ? 'Làm xong việc nào thì bấm việc đó nhé' : 'HaoHao nhắc bạn nè';\n  document.title = `HaoHao: ${items[0].title}`;\n  const L = $('#list'); L.innerHTML = '';\n  for (const it of items) {\n    const c = document.createElement('div'); c.className = 'card'; c.setAttribute('role', 'listitem');\n    const t = document.createElement('div'); t.className = 't';\n    const a = document.createElement('span'); a.textContent = it.title;\n    const b = document.createElement('span'); b.textContent = new Date(it.t).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });\n    t.append(a, b);\n    const x = document.createElement('div'); x.className = 'x'; x.textContent = it.text;\n    const acts = document.createElement('div'); acts.className = 'acts';\n    if (it.kind === 'pomo') acts.append(...(it.next\n      ? [btn('▶ Vào phiên tiếp', 'main', () => act(it, 'pomo-next')), btn('Để sau', '', () => act(it, 'done'))]\n      : it.end ? [btn('✅ Hoàn thành việc', 'main', () => act(it, 'pomo-done')), btn('▶ Làm tiếp', '', () => act(it, 'pomo-next')), btn('☕ Nghỉ', '', () => act(it, 'done'))]\n      : [btn('Ok ✓', 'main', () => act(it, 'done'))]));\n    else if (it.kind === 'mail') acts.append(\n      btn('Mở mail', 'main', () => act(it, 'open')),\n      btn('Đã xem ✓', '', () => act(it, 'done'))\n    );\n    else if (it.url) acts.append(\n      btn('🛒 Săn deal', 'main', () => act(it, 'deal')),\n      btn('Xong rồi ✓', '', () => act(it, 'done'))\n    );\n    else acts.append(\n      btn('Xong rồi ✓', 'main', () => act(it, 'done')),\n      btn('10 phút nữa', '', () => act(it, 'snooze', 10)),\n      btn('30 phút nữa', '', () => act(it, 'snooze', 30))\n    );\n    c.append(t, x, acts); L.append(c);\n  }\n  L.querySelector('button.main')?.focus();\n}\nfunction btn(text, cls, fn) { const b = document.createElement('button'); b.textContent = text; b.className = cls; b.addEventListener('click', fn); return b; }\nfunction act(it, action, minutes) {\n  unlockAudio();\n  chrome.runtime.sendMessage({ type: 'desk-act', id: it.id, action, minutes }).catch(() => {});\n}\n\nasync function knock() {\n  if (closing) return;\n  knocks++;\n  document.body.classList.remove('knock'); void document.body.offsetWidth; document.body.classList.add('knock');\n  playKnock();\n  try {\n    const w = await chrome.windows.getCurrent();\n    await chrome.windows.update(w.id, { focused: true, drawAttention: true });\n    const x = w.left;\n    if (typeof x === 'number') {\n      for (const dx of [16, -16, 12, -12, 8, -8, 4, 0]) { await chrome.windows.update(w.id, { left: x + dx }); await sleep(40); }\n    }\n  } catch {}\n}\n\nfunction unlockAudio() { try { ac = ac || new AudioContext(); if (ac.state === 'suspended') ac.resume(); } catch {} }\nfunction playKnock() {\n  if (!soundOn) return;\n  try {\n    unlockAudio();\n    const t = ac.currentTime + 0.05;\n    // hai tiếng gõ \"cốc cốc\"\n    [0, 0.24].forEach(d => {\n      const len = 0.14, buf = ac.createBuffer(1, Math.floor(ac.sampleRate * len), ac.sampleRate), data = buf.getChannelData(0);\n      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 5);\n      const src = ac.createBufferSource(); src.buffer = buf;\n      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = 1.2;\n      const g = ac.createGain(); g.gain.value = 2.2;\n      src.connect(f).connect(g).connect(ac.destination); src.start(t + d);\n      const o = ac.createOscillator(), og = ac.createGain(); o.frequency.setValueAtTime(190, t + d); o.frequency.exponentialRampToValueAtTime(90, t + d + .12);\n      og.gain.setValueAtTime(0.5, t + d); og.gain.exponentialRampToValueAtTime(0.001, t + d + .14);\n      o.connect(og).connect(ac.destination); o.start(t + d); o.stop(t + d + .15);\n    });\n    // chuông nhẹ sau khi gõ\n    [880, 1175, 1320].forEach((fq, i) => {\n      const s0 = t + 0.7 + i * 0.15, o = ac.createOscillator(), g = ac.createGain();\n      o.type = 'sine'; o.frequency.value = fq;\n      g.gain.setValueAtTime(0.0001, s0); g.gain.exponentialRampToValueAtTime(0.18, s0 + .02); g.gain.exponentialRampToValueAtTime(0.0001, s0 + .7);\n      o.connect(g).connect(ac.destination); o.start(s0); o.stop(s0 + .75);\n    });\n  } catch {}\n}\n\ndocument.addEventListener('pointerdown', unlockAudio, { once: true });\nchrome.storage.onChanged.addListener((ch, area) => { if (area === 'session' && ch.deskQueue) load(); });\nsetInterval(() => { if (items.length && knocks < MAX_KNOCKS) knock(); }, KNOCK_EVERY);\nload();\n", "voice.html": "<!doctype html>\n<html lang=\"vi\">\n<head>\n<meta charset=\"utf-8\">\n<title>HaoHao đang nghe…<\/title>\n<style>\n  :root { --ink: #23305E; --honey: #F2B544; --coral: #E85D5D; --mint: #2F9E7E; --cream: #FFFDF6; --soft: #6B7394; }\n  * { box-sizing: border-box; }\n  html, body { height: 100%; margin: 0; }\n  body { background: var(--cream); color: var(--ink); font: 14px/1.45 \"Segoe UI\", system-ui, sans-serif; display: flex; flex-direction: column; padding: 14px 16px; gap: 10px; }\n  .top { display: flex; align-items: center; gap: 14px; }\n  #mic { all: unset; cursor: pointer; width: 64px; height: 64px; border-radius: 50%; background: var(--coral); display: grid; place-items: center; flex: none; box-shadow: 0 4px 12px rgba(232,93,93,.35); }\n  #mic svg { width: 30px; height: 30px; }\n  #mic.on { animation: pulse 1.2s infinite; }\n  #mic.off { background: var(--ink); box-shadow: none; }\n  #mic:focus-visible { outline: 3px solid var(--honey); outline-offset: 3px; }\n  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(232,93,93,.5); } 70% { box-shadow: 0 0 0 16px rgba(232,93,93,0); } 100% { box-shadow: 0 0 0 0 rgba(232,93,93,0); } }\n  h1 { margin: 0; font-size: 17px; font-weight: 800; }\n  #status { font-size: 13px; color: var(--soft); }\n  textarea { flex: 1; width: 100%; resize: none; border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; font: 15px/1.5 \"Segoe UI\", system-ui, sans-serif; color: var(--ink); background: #fff; }\n  textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(242,181,68,.5); }\n  .acts { display: flex; gap: 8px; flex-wrap: wrap; }\n  button.b { all: unset; cursor: pointer; padding: 9px 14px; border-radius: 10px; font-weight: 700; font-size: 13.5px; border: 2px solid var(--ink); }\n  button.main { background: var(--ink); color: #fff; }\n  button.b:hover { background: #FFF0C7; } button.main:hover { background: #2f3f78; }\n  button.b:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }\n  button[disabled] { opacity: .45; pointer-events: none; }\n  .err { color: #9B2C2C; }\n  @media (prefers-reduced-motion: reduce) { #mic.on { animation: none; } }\n<\/style>\n<\/head>\n<body>\n  <div class=\"top\">\n    <button id=\"mic\" aria-label=\"Bắt đầu hoặc dừng nghe\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"/><path d=\"M5.5 11a6.5 6.5 0 0013 0M12 17.5V21\"/><\/svg>\n    <\/button>\n    <div>\n      <h1 id=\"head\">HaoHao đang nghe…<\/h1>\n      <div id=\"status\" role=\"status\">Cứ nói tự nhiên bằng tiếng Việt. Nói xong bấm Lưu.<\/div>\n    <\/div>\n  <\/div>\n  <textarea id=\"txt\" placeholder=\"Lời bạn nói sẽ hiện ở đây, sửa được trước khi lưu…\" aria-label=\"Nội dung ghi chú\"><\/textarea>\n  <div class=\"acts\">\n    <button class=\"b main\" id=\"saveIdea\">💡 Lưu vào kho ý tưởng<\/button>\n    <button class=\"b\" id=\"saveTodo\">✅ Thêm vào Todolist<\/button>\n    <button class=\"b\" id=\"again\">Nói lại<\/button>\n  <\/div>\n<script src=\"common.js\"><\/script>\n<script src=\"i18n.js\"><\/script>\n<script src=\"i18n-page.js\"><\/script>\n<script src=\"voice.js\"><\/script>\n<\/body>\n<\/html>\n", "options.html": "<!doctype html>\n<html lang=\"vi\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>HaoHao: cài đặt<\/title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap\">\n<link rel=\"stylesheet\" href=\"options.css\">\n<\/head>\n<body>\n<aside>\n  <img src=\"icons/icon128.png\" alt=\"\" class=\"pet\">\n  <h1>HaoHao<\/h1>\n  <p class=\"tag\">Chú hamster canh tin, canh giá và nhắc việc cho bạn trong Chrome.<\/p>\n  <nav>\n    <button data-tab=\"rules\" class=\"on\">Điều kiện<\/button>\n    <button data-tab=\"log\">Nhật ký<\/button>\n    <button data-tab=\"settings\">Cài đặt chung<\/button>\n  <\/nav>\n<\/aside>\n\n<main>\n  <section id=\"tab-rules\">\n    <header class=\"top\">\n      <div>\n        <h2>Điều kiện<\/h2>\n        <p class=\"sub\">Khi điều kiện đúng, HaoHao nhảy ra báo và gửi thông báo. Todolist, lịch nhắc và danh sách coin cũng chỉnh được ngay trong HaoHao trên trang web.<\/p>\n      <\/div>\n      <button id=\"add\" class=\"btn\">Thêm điều kiện<\/button>\n    <\/header>\n\n    <form id=\"editor\" hidden>\n      <div class=\"seg\" role=\"radiogroup\" aria-label=\"Loại điều kiện\">\n                <label><input type=\"radio\" name=\"type\" value=\"price\" checked><span>Crypto<\/span><\/label>\n        <label><input type=\"radio\" name=\"type\" value=\"reminder\"><span>Nhắc nhở 🔔<\/span><\/label>\n      <\/div>\n\n      <label class=\"f\">Tên gợi nhớ<input name=\"name\" required placeholder=\"Ví dụ: Kèo meme Solana\"><\/label>\n\n      <div class=\"grp\" data-for=\"price\">\n        <div class=\"row\">\n          <label class=\"f\">Nguồn giá\n            <select name=\"source\">\n              <option value=\"coingecko\">CoinGecko (coin lớn, nhập mã như bitcoin, solana)<\/option>\n              <option value=\"dexscreener\">DexScreener (meme coin, dán địa chỉ token)<\/option>\n            <\/select><\/label>\n          <label class=\"f\">Mã coin hoặc địa chỉ token<input name=\"coin\" placeholder=\"bitcoin\"><\/label>\n        <\/div>\n        <div class=\"row\">\n          <label class=\"f\">Báo khi\n            <select name=\"op\">\n              <option value=\"above\">Giá lớn hơn hoặc bằng ($)<\/option>\n              <option value=\"below\">Giá nhỏ hơn hoặc bằng ($)<\/option>\n              <option value=\"up\">Tăng ít nhất (% trong 24h)<\/option>\n              <option value=\"down\">Giảm ít nhất (% trong 24h)<\/option>\n            <\/select><\/label>\n          <label class=\"f\">Mốc<input name=\"value\" type=\"number\" step=\"any\" placeholder=\"120000\"><\/label>\n        <\/div>\n        <div class=\"test\"><button type=\"button\" id=\"test\" class=\"btn ghost\">Xem giá hiện tại<\/button><span id=\"testOut\"><\/span><\/div>\n        <p class=\"hint\">Giá được kiểm tra mỗi phút. Mỗi lần điều kiện chuyển từ sai sang đúng, bạn được báo một lần.<\/p>\n      <\/div>\n\n      <div class=\"grp\" data-for=\"reminder\" hidden>\n        <div class=\"row\">\n          <label class=\"f\">Biểu tượng\n            <select name=\"icon\"><option>🔔<\/option><option>💊<\/option><option>💧<\/option><option>🧒<\/option><option>🍚<\/option><option>🏃<\/option><option>📞<\/option><option>🛏️<\/option><option>🐶<\/option><option>🌱<\/option><\/select><\/label>\n          <label class=\"f\">Kiểu nhắc\n            <select name=\"kind\"><option value=\"daily\">Hằng ngày, vào các giờ cố định<\/option><option value=\"interval\">Lặp lại sau mỗi X phút<\/option><option value=\"once\">Một lần vào ngày giờ cụ thể<\/option><\/select><\/label>\n        <\/div>\n        <div class=\"row\">\n          <label class=\"f\" data-kind=\"daily\">Các giờ nhắc, cách nhau dấu phẩy<input name=\"times\" placeholder=\"08:00, 20:00\"><\/label>\n          <label class=\"f\" data-kind=\"interval\" hidden>Số phút<input name=\"minutes\" type=\"number\" min=\"5\" value=\"60\"><\/label>\n          <label class=\"f\" data-kind=\"interval\" hidden>Từ giờ<input name=\"from\" type=\"time\" value=\"08:00\"><\/label>\n          <label class=\"f\" data-kind=\"interval\" hidden>Đến giờ<input name=\"to\" type=\"time\" value=\"21:00\"><\/label>\n          <label class=\"f\" data-kind=\"once\" hidden>Ngày giờ<input name=\"datetime\" type=\"datetime-local\"><\/label>\n        <\/div>\n        <div class=\"days\" data-kind=\"daily\">\n          <span>Ngày trong tuần (không chọn là mọi ngày):<\/span>\n          <label><input type=\"checkbox\" name=\"day\" value=\"1\">T2<\/label><label><input type=\"checkbox\" name=\"day\" value=\"2\">T3<\/label>\n          <label><input type=\"checkbox\" name=\"day\" value=\"3\">T4<\/label><label><input type=\"checkbox\" name=\"day\" value=\"4\">T5<\/label>\n          <label><input type=\"checkbox\" name=\"day\" value=\"5\">T6<\/label><label><input type=\"checkbox\" name=\"day\" value=\"6\">T7<\/label>\n          <label><input type=\"checkbox\" name=\"day\" value=\"0\">CN<\/label>\n        <\/div>\n        <label class=\"f\">Lời nhắc<input name=\"message\" placeholder=\"Tới giờ đi đón con rồi!\"><\/label>\n      <\/div>\n\n      <div class=\"actions\">\n        <button type=\"submit\" class=\"btn\">Lưu điều kiện<\/button>\n        <button type=\"button\" id=\"cancel\" class=\"btn ghost\">Huỷ<\/button>\n      <\/div>\n    <\/form>\n\n    <div id=\"list\"><\/div>\n  <\/section>\n\n  <section id=\"tab-log\" hidden>\n    <header class=\"top\">\n      <div><h2>Nhật ký<\/h2><p class=\"sub\">Những lần HaoHao đã báo cho bạn.<\/p><\/div>\n      <button id=\"clearLog\" class=\"btn ghost\">Xoá nhật ký<\/button>\n    <\/header>\n    <ol id=\"log\"><\/ol>\n  <\/section>\n\n  <section id=\"tab-settings\" hidden>\n    <header class=\"top\"><div><h2>Cài đặt chung<\/h2><\/div><\/header>\n    <label class=\"f lang\">🌐 Ngôn ngữ giao diện / Language\n      <select id=\"lang\"><option value=\"vi\">🇻🇳 Tiếng Việt<\/option><option value=\"en\">🇬🇧 English<\/option><\/select><\/label>\n    <label class=\"chk big\"><input type=\"checkbox\" id=\"mascotEnabled\"> Hiện HaoHao trên các trang web<\/label>\n    <label class=\"chk big\"><input type=\"checkbox\" id=\"greet\"> HaoHao chào và báo việc đang chờ khi mở trang<\/label>\n    <label class=\"f lang\">⏱️ HaoHao chào lại sau mỗi\n      <select id=\"greetMin\"><option value=\"10\">10 phút<\/option><option value=\"15\">15 phút<\/option><option value=\"30\">30 phút<\/option><option value=\"60\">1 tiếng<\/option><option value=\"180\">3 tiếng<\/option><\/select><\/label>\n    <label class=\"chk big\"><input type=\"checkbox\" id=\"desktop\"> Khi nhắc nhở, HaoHao ra hẳn màn hình và gõ cửa (đè lên cả ứng dụng khác)<\/label>\n    <label class=\"chk big\"><input type=\"checkbox\" id=\"sound\"> Có tiếng gõ và tiếng chuông<\/label>\n    <label class=\"chk big\"><input type=\"checkbox\" id=\"shopTrust\"> Trên Shopee, HaoHao chấm điểm tin cậy sản phẩm và shop<\/label>\n    <label class=\"chk big\"><input type=\"checkbox\" id=\"shopAuto\"> Mở sản phẩm Shopee hoặc TikTok là HaoHao tự so giá với shop khác, món TikTok so thêm với Shopee (mở ngầm 1 tab vài giây)<\/label>\n    <label class=\"chk big\"><input type=\"checkbox\" id=\"shopAsk\"> Trên Shopee, luôn hiện bong bóng kết quả kiểm tra (tắt thì chỉ còn điểm nhỏ trên đầu HaoHao)<\/label>\n    <p class=\"sub\">🔗 Nút mua, lấy mã và tìm trên Shopee, TikTok Shop dùng link tiếp thị: HaoHao có thể nhận hoa hồng khi bạn mua, bạn không phải trả thêm.<\/p>\n    <div class=\"test\"><button id=\"deskTest\" class=\"btn ghost\">Thử HaoHao ra màn hình<\/button><span id=\"appStatus\"><\/span><\/div>\n    <div id=\"ai\" class=\"setup\">\n      <h3>📖 Đọc hộ (Gemini)<\/h3>\n      <p class=\"sub\">Lấy mã miễn phí tại <a href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noopener\">Google AI Studio<\/a> → <b>Create API key<\/b>. Mã chỉ lưu trong Chrome của bạn.<\/p>\n      <div class=\"test\">\n        <label class=\"f\" style=\"margin:0;max-width:360px\">Mã Gemini<input id=\"aiKey\" type=\"password\" placeholder=\"AIza…\" autocomplete=\"off\"><\/label>\n        <label class=\"f\" style=\"margin:0;max-width:220px\">Mô hình<input id=\"aiModel\" placeholder=\"Để trống: tự chọn\"><\/label>\n        <button type=\"button\" id=\"aiSave\" class=\"btn\">Lưu<\/button>\n        <button type=\"button\" id=\"aiTest\" class=\"btn ghost\">Thử kết nối<\/button>\n      <\/div>\n      <p id=\"aiState\" class=\"sub\"><\/p>\n    <\/div>\n\n    <div id=\"tiktok\" class=\"setup\">\n      <h3>🛍️ Link TikTok của tôi (dành cho chủ app)<\/h3>\n      <p class=\"sub\">Dán link sản phẩm từ phòng trưng bày TikTok (Chia sẻ → Sao chép liên kết, dạng <b>vt.tiktok.com/…<\/b>), mỗi link một dòng. HaoHao tự lấy mã và tên sản phẩm, rồi cập nhật cho mọi người dùng (trong vòng 6 giờ).<\/p>\n      <details class=\"sub\"><summary>Tạo mã GitHub (làm 1 lần)<\/summary>\n        <ol>\n          <li>Mở <a href=\"https://github.com/settings/personal-access-tokens/new\" target=\"_blank\" rel=\"noopener\">github.com/settings/personal-access-tokens/new<\/a><\/li>\n          <li>Token name: <b>HaoHao<\/b>. Expiration: chọn 1 năm.<\/li>\n          <li>Repository access: <b>Only select repositories<\/b> → chọ [\\d.,]+\\s*k?|[\\d.,]+\\s*k?\\s*₫))?(?:[^₫%]{0,20}Đơn (?:Tối Thiểu|tối thiểu|từ)\\s*(₫\\s*[\\d.,]+\\s*k?|[\\d.,]+\\s*k?\\s*₫))?/gi;\n  const money = s => HT.num(String(s).replace(/[₫\\s]/g, ''));\n  for (const m of t.matchAll(re)) {\n    const c = /%/.test(m[1]) ? { percent: parseInt(m[1]) } : { discount: money(m[1]) };\n    if (m[2]) c.maxDiscount = money(m[2]);\n    if (m[3]) c.minOrder = money(m[3]);\n    if ((c.discount && c.discount < 500) || (c.percent && c.percent > 90)) continue;\n    const key = JSON.stringify(c); if (!out.some(x => JSON.stringify(x) === key)) out.push(c);\n  }\n  return out.slice(0, 12);\n};\n\n\n// ---------- 🔍 Tìm cùng món ở shop khác trên Shopee ----------\n// Mã model (X20, WH-1000XM5, S24…): nếu tên gốc có thì món kia bắt buộc phải có\nconst UNIT = /^\\d+([.,]\\d+)?(gb|tb|mb|mah|w|kw|ml|l|g|kg|cm|mm|m|inch|in|hz|v|btu|lit|lít|k|tr|m2)$/i;\nHT.modelOf = title => String(title || '').split(/[\\s,()/[\\]|+]+/).map(t => t.replace(/^[-.]+|[-.]+$/g, ''))\n  .filter(t => t.length >= 3 && /^[A-Za-z0-9-]+$/.test(t) && /\\d/.test(t) && /[a-z]/i.test(t) && !UNIT.test(t) && !/^(spf|pa|ip|usb|hdmi|wifi|ddr|pd|gen|mk|v)\\d/i.test(t) && !/^\\d+(g|k|x)$/i.test(t))\n  .sort((a, b) => b.length - a.length)[0] || '';\nconst ACC = /\\b(op lung|bao da|cuong luc|mieng dan|dan man|cap sac|cu sac|day deo|tui dung|gia do|phu kien)\\b/;\n// 0..1: tên món kia giống tên gốc bao nhiêu (0 = khác món)\nHT.titleSim = (a, b) => {\n  const fa = HT.fold(a), fb = HT.fold(b);\n  if (ACC.test(fb) && !ACC.test(fa)) return 0;          // ốp lưng, cáp sạc… không phải cùng món\n  const m = HT.modelOf(a);\n  // có mã model mà món kia không có (hoặc là X200 thay vì X20) thì giảm mạnh độ giống\n  const miss = m && !new RegExp('(^|[^a-z0-9])' + HT.fold(m).replace(/-/g, '').replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&') + '(?![0-9])').test(fb.replace(/-/g, ''));\n  const wa = [...new Set(HT.fold(HT.cleanTitle(a)).split(/[^a-z0-9]+/).filter(w => w.length > 1))].slice(0, 10);\n  if (!wa.length) return 0;\n  const wb = new Set(HT.fold(b).split(/[^a-z0-9]+/));\n  return wa.filter(w => wb.has(w)).length / wa.length * (miss ? 0.5 : 1);\n};\n// ---------- ✅ Có đúng là CÙNG MỘT sản phẩm không? ----------\n// Chỉ khi qua hết các cửa dưới đây mới được coi là \"shop khác bán cùng món\":\n// cùng loại hàng, cùng thương hiệu, cùng mã model, cùng dung lượng/khối lượng, cùng số lượng trong gói,\n// không lệch thuộc tính chính (nam/nữ, dài/ngắn, jean/kaki…) và tên giống nhau đủ nhiều.\nconst SP_BRANDS = ['apple', 'iphone', 'ipad', 'macbook', 'airpods', 'samsung', 'galaxy', 'xiaomi', 'redmi', 'poco', 'oppo', 'vivo', 'realme', 'huawei', 'honor', 'nokia', 'sony', 'jbl', 'marshall', 'bose', 'anker', 'baseus', 'ugreen', 'remax', 'hoco', 'logitech', 'razer', 'dareu', 'asus', 'acer', 'dell', 'lenovo', 'msi', 'lg', 'panasonic', 'philips', 'sharp', 'toshiba', 'electrolux', 'sunhouse', 'kangaroo', 'tefal', 'elmich', 'lock&lock', 'locknlock', 'casio', 'nike', 'adidas', 'puma', 'converse', 'vans', 'uniqlo', 'loreal', 'cerave', 'bioderma', 'innisfree', 'senka', 'hada labo', 'la roche posay', 'cocoon', 'maybelline', 'romand', '3ce', 'garnier', 'nivea', 'vaseline', 'dove', 'colgate', 'omo', 'downy', 'comfort', 'ariel', 'vinamilk', 'nestle', 'milo', 'enfa', 'similac', 'huggies', 'bobby', 'merries', 'moony', 'pampers'];\nconst SP_GROUPS = [\n  ['nam', 'nu', 'be trai', 'be gai', 'tre em'],\n  ['dai', 'ngan', 'short', 'lung'],\n  ['tay dai', 'tay ngan', 'sat nach', 'ba lo'],\n  ['jean', 'kaki', 'tay', 'thun', 'ni', 'len', 'lanh', 'kate', 'jogger', 'da', 'dui'],\n  ['ong rong', 'ong suong', 'ong dung', 'ong loe', 'ong con', 'skinny', 'baggy'],\n  ['co tron', 'co tim', 'co be', 'co lo', 'co tru', 'hoodie', 'polo'],\n  ['co day', 'khong day', 'bluetooth'],\n  ['nguoi lon', 'tre em', 'so sinh'],\n];\nconst SP_STOP = new Set('co ban dep chuan form gia re han quoc cao cap thoi trang phong cach sieu xinh basic hang loai xuong mau nhieu mem min tot ben hot trend si le nhe ca tinh tre trung cho va the cua voi sale shop store official chinh sang chanh ulzzang style kieu moi nam nay 2024 2025 2026 sieu'.split(' '));\nconst SP_SYN = [[/\\bjeans\\b/g, 'jean'], [/\\bbo\\b(?= |$)/g, 'bo'], [/\\bquan short\\b/g, 'quan ngan'], [/\\bunisex\\b/g, 'nam nu'], [/\\bwireless\\b/g, 'khong day'], [/\\btrue wireless\\b|\\btws\\b/g, 'khong day']];\nconst spNorm = s => { let f = ' ' + HT.fold(HT.cleanTitle(s)).replace(/\\d+(?:[.,]\\d+)? ?%/g, ' ').replace(/[^a-z0-9.&]+/g, ' ') + ' '; for (const [r, t] of SP_SYN) f = f.replace(r, t); return f.replace(/\\s+/g, ' '); };\nconst spHas = (f, w) => new RegExp('(^| )' + w.replace(/[.*+?^${}()|[\\]\\\\&]/g, '\\\\$&') + '(?= |$)').test(f);\n// thông số có đơn vị: 128gb, 500ml, 1.5l, 20000mah, 65w… → { gb:['128'], ml:['500'] }\nconst SP_UNITS = { gb: 'gb', g: 'g', tb: 'tb', mah: 'mah', w: 'w', ml: 'ml', l: 'l', lit: 'l', kg: 'kg', gr: 'g', gram: 'g', inch: 'inch', hz: 'hz', btu: 'btu', vien: 'vien', goi: 'goi', mieng: 'mieng' };\nconst spSpecs = f => { const o = {}; for (const m of f.matchAll(/(?:^| )(\\d+(?:[.,]\\d+)?) ?(gb|tb|mah|ml|lit|l|kg|gr|gram|g|w|inch|hz|btu|vien|goi|mieng)(?= |$)/g)) { const u = SP_UNITS[m[2]], v = String(parseFloat(m[1].replace(',', '.'))); (o[u] = o[u] || new Set()).add(v); } return o; };\n// số lượng trong gói: combo 2, set 3, bộ 5, x2, 2 đôi, hộp 10 cái… (không ghi = 1)\nconst spQty = f => { const m = f.match(/(?:^| )(?:combo|set|bo|loc|pack|hop|tui) ?(\\d{1,3})(?= |$)|(?:^| )x ?(\\d{1,2})(?= |$)|(?:^| )(\\d{1,3}) ?(?:cai|chiec|doi|cuon|chai|lon|hop|tuyp)(?= |$)/); const n = m ? +(m[1] || m[2] || m[3]) : 1; return n > 0 && n < 500 ? n : 1; };\nHT.sameProduct = (a, b) => {\n  const no = why => ({ same: false, sim: 0, why });\n  const fa = spNorm(a), fb = spNorm(b), ra = HT.fold(a), rb = HT.fold(b);\n  if (ACC.test(rb) !== ACC.test(ra)) return no('phụ kiện khác món');\n  // thương hiệu: tên gốc có thì món kia phải có, và không được là hãng khác\n  const ba = SP_BRANDS.filter(x => spHas(fa, x)), bb = SP_BRANDS.filter(x => spHas(fb, x));\n  if (ba.length && !ba.some(x => bb.includes(x))) return no('khác thương hiệu');\n  if (bb.some(x => !ba.includes(x)) && ba.length) { if (!bb.every(x => ba.includes(x) || ['iphone', 'galaxy', 'redmi', 'poco', 'ipad', 'airpods', 'macbook'].includes(x))) return no('khác thương hiệu'); }\n  // mã model phải khớp đúng (X20 ≠ X200)\n  // (món kia không ghi mã nào thì có thể chỉ là mã riêng của shop → vẫn xét, nhưng đòi tên giống hơn)\n  const hasCode = (code, raw) => new RegExp('(^|[^a-z0-9])' + HT.fold(code).replace(/-/g, '').replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&') + '(?![0-9a-z])').test(raw.replace(/-/g, ''));\n  const m = HT.modelOf(a), mb = HT.modelOf(b);\n  const noCode = m && !hasCode(m, rb);\n  if (noCode && mb && !hasCode(mb, ra)) return no('khác mã model');\n  // dung lượng, khối lượng, công suất… cùng đơn vị thì phải trùng\n  const sa = spSpecs(fa), sb = spSpecs(fb);\n  for (const u in sa) if (sb[u] && ![...sa[u]].some(v => sb[u].has(v))) return no('khác dung lượng/khối lượng');\n  for (const u of ['gb', 'tb', 'ml', 'l', 'kg', 'mah']) if (sa[u] && !sb[u] && !(u === 'l' && sb.ml) && !(u === 'ml' && sb.l)) return no('không ghi rõ dung lượng');\n  if (spQty(fa) !== spQty(fb)) return no('khác số lượng trong gói');\n  // số trần trong tên (Buds 4, Series 9, 2 lớp…) phải có đủ ở món kia\n  const nums = f => new Set([...f.matchAll(/(?:^| )(\\d{1,4})(?= |$)(?! (?:mau|size|kieu|kich|sao))/g)].map(x => String(+x[1])));\n  const na = nums(fa), nb = nums(fb);\n  if ([...na].some(n => !nb.has(n))) return no('khác số hiệu');\n  // phiên bản: Pro / Lite / Max / Plus / Mini / Ultra / SE phải y hệt nhau\n  const ver = f => ['pro', 'lite', 'max', 'plus', 'mini', 'ultra', 'se', 'fe', 'neo'].filter(w => spHas(f, w)).join();\n  if (ver(fa) !== ver(fb)) return no('khác phiên bản');\n  // thuộc tính chính không được lệch nhau\n  for (const g of SP_GROUPS) {\n    const ga = g.filter(w => spHas(fa, w)), gb = g.filter(w => spHas(fb, w));\n    if (ga.length && gb.length && !ga.some(w => gb.includes(w))) return no('khác loại (' + ga[0] + ' / ' + gb[0] + ')');\n  }\n  // loại hàng: 2 chữ đầu của tên (quần jean, áo thun, tai nghe…) phải có trong món kia\n  const wa = fa.trim().split(' ').filter(w => w.length > 1 && !ba.includes(w)), wb = new Set(fb.trim().split(' '));\n  if (!wa.length) return no('không đọc được tên');\n  if (!wa.slice(0, 2).every(w => wb.has(w))) return no('khác loại hàng');\n  // độ giống: phần lớn chữ chính của tên gốc có trong món kia, và ngược lại\n  // bỏ chữ quảng cáo (đẹp, chuẩn, cao cấp, Hàn Quốc…) khi so, chỉ so chữ nói lên món hàng\n  const key = w => w.length > 1 && !SP_STOP.has(w);\n  const ka = [...new Set(wa.filter(key))].slice(0, 12), kb = [...new Set(fb.trim().split(' ').filter(key))].slice(0, 12), sa2 = new Set(fa.trim().split(' '));\n  if (!ka.length) return no('không đọc được tên');\n  const fwd = ka.filter(w => wb.has(w)).length / ka.length, back = kb.length ? kb.filter(w => sa2.has(w)).length / kb.length : 0;\n  const sim = Math.round((fwd * 0.65 + back * 0.35) * 100) / 100;\n  if (fwd < (noCode ? 0.8 : 0.7) || back < 0.45) return { same: false, sim, why: noCode ? 'khác mã model' : 'tên khác nhiều' };\n  return { same: true, sim, why: '' };\n};\n// ---------- 🔎 Tìm sản phẩm ----------\nHT.PRICE_RANGES = { lt100: [0, 100000], '100-300': [100000, 300000], gt300: [300000, Infinity] };\n// trang tìm kiếm Shopee theo độ liên quan, kèm khoảng giá nếu có\nHT.shopeeFindUrl = (q, range) => {\n  const r = HT.PRICE_RANGES[range];\n  return 'https://shopee.vn/search?keyword=' + encodeURIComponent(q) + (r ? (r[0] ? '&minPrice=' + r[0] : '') + (r[1] < Infinity ? '&maxPrice=' + r[1] : '') : '');\n};\n// tên món có đúng thứ người dùng tìm không (đủ ~70% chữ của từ khoá, không lạc sang phụ kiện)\nHT.matchQuery = (q, title) => {\n  const wq = [...new Set(HT.fold(q).split(/[^a-z0-9]+/).filter(w => w.length > 1))];\n  if (!wq.length) return true;\n  const ft = HT.fold(title);\n  if (ACC.test(ft) && !ACC.test(HT.fold(q))) return false;\n  const wt = new Set(ft.split(/[^a-z0-9]+/));\n  return wq.filter(w => wt.has(w)).length >= Math.ceil(wq.length * 0.7);\n};\n// từ khoá hay được tìm, để gợi ý khi đang gõ\nHT.HOT_KEYWORDS = ('tai nghe bluetooth|tai nghe có dây|tai nghe chụp tai|tai nghe gaming|loa bluetooth|sạc dự phòng|củ sạc nhanh|cáp sạc type c|cáp sạc iphone|ốp lưng iphone|kính cường lực|chuột không dây|bàn phím cơ|bàn phím không dây|lót chuột|giá đỡ điện thoại|đồng hồ thông minh|camera wifi|ổ cắm điện|đèn ngủ|đèn học|quạt mini|quạt tích điện|' +\n  'quần jean nam|quần jean nữ|quần short nam|quần tây nam|quần ống rộng nữ|áo thun nam|áo thun nữ|áo polo nam|áo sơ mi nam|áo sơ mi nữ|áo khoác nam|áo khoác nữ|áo hoodie|áo len|váy nữ|đầm công sở|đồ bộ nữ|đồ ngủ|đồ lót nữ|quần lót nam|tất vớ|' +\n  'giày thể thao nam|giày thể thao nữ|giày sneaker|dép nam|dép nữ|sandal nữ|giày cao gót|túi xách nữ|balo laptop|balo đi học|ví nam|thắt lưng nam|mũ lưỡi trai|kính mát|đồng hồ nam|đồng hồ nữ|' +\n  'sữa rửa mặt|kem chống nắng|serum vitamin c|toner|kem dưỡng ẩm|tẩy trang|son môi|phấn phủ|kem nền|mặt nạ|dầu gội|sữa tắm|kem đánh răng|bàn chải điện|nước hoa nữ|nước hoa nam|lăn khử mùi|máy sấy tóc|máy cạo râu|' +\n  'nồi chiên không dầu|nồi cơm điện|ấm siêu tốc|máy xay sinh tố|bếp từ|chảo chống dính|bộ nồi|hộp đựng thực phẩm|bình giữ nhiệt|máy hút bụi|robot hút bụi|cây lau nhà|móc treo quần áo|giá phơi đồ|chăn ga gối|gối ngủ|nệm|rèm cửa|' +\n  'tã bỉm|sữa bột|bình sữa|xe đẩy em bé|đồ chơi trẻ em|quần áo trẻ em|' +\n  'bánh tráng|đồ ăn vặt|cà phê|trà|hạt dinh dưỡng|nước giặt|nước xả vải|nước rửa chén|giấy vệ sinh|khăn giấy|' +\n  'thức ăn cho mèo|cát vệ sinh cho mèo|thức ăn cho chó|vợt cầu lông|thảm tập yoga|tạ tay|dây nhảy|bình nước thể thao').split('|');\nHT.suggest = (q, hist = [], n = 6) => {\n  const f = HT.fold(q).trim(); if (!f) return hist.slice(0, n).map(t => ({ t, hist: true }));\n  const out = [], has = t => out.some(x => HT.fold(x.t) === HT.fold(t));\n  for (const t of hist) if (HT.fold(t).includes(f) && !has(t)) out.push({ t, hist: true });\n  for (const t of HT.HOT_KEYWORDS) if (HT.fold(t).startsWith(f) && !has(t)) out.push({ t });\n  for (const t of HT.HOT_KEYWORDS) if ((' ' + HT.fold(t)).includes(' ' + f) && !has(t)) out.push({ t });\n  return out.slice(0, n);\n};\n// Món trong danh sách TikTok của bạn giống món/từ khoá đang xem (cùng loại hàng, không lệch nam/nữ, trẻ em…)\nHT.related = (text, n = 2, skipId = '') => {\n  const fa = spNorm(text), wa = fa.trim().split(' ').filter(w => w.length > 1 && !SP_STOP.has(w));\n  if (!wa.length) return [];\n  const out = [];\n  for (const [id, title] of Object.entries(HT.TT.titles || {})) {\n    if (id === skipId || !HT.TT.links[id]) continue;\n    const fb = spNorm(title), wb = new Set(fb.trim().split(' '));\n    if (!wb.has(wa[0])) continue;                                   // khác loại hàng (quần ≠ áo)\n    if (SP_GROUPS.some(g => { const ga = g.filter(w => spHas(fa, w)), gb = g.filter(w => spHas(fb, w)); return ga.length && gb.length && !ga.some(w => gb.includes(w)); })) continue;\n    const sc = wa.filter(w => wb.has(w)).length / Math.min(wa.length, 8);\n    if (sc >= 0.35) out.push({ id, title, url: HT.TT.links[id], image: (HT.TT.images || {})[id] || '', sc });\n  }\n  return out.sort((a, b) => b.sc - a.sc).slice(0, n);\n};\n// Nhãn uy tín gọn cho 1 sản phẩm trong danh sách tìm kiếm\nHT.listingTags = it => {\n  const t = [];\n  if (it.mall) t.push({ s: 'ok', t: '🏬 Mall' }); else if (it.preferred) t.push({ s: 'ok', t: '❤ Yêu thích' });\n  if (it.rating) t.push({ s: it.rating >= 4.7 ? 'ok' : it.rating >= 4.3 ? '' : 'warn', t: `★${it.rating}` });\n  if (it.sold != null && !isNaN(it.sold)) t.push(it.sold < 10 ? { s: 'warn', t: `⚠ Mới bán ${it.sold}` } : { s: it.sold >= 1000 ? 'ok' : '', t: `Đã bán ${it.sold >= 1000 ? (it.sold / 1000).toFixed(it.sold >= 10000 ? 0 : 1).replace('.', ',') + 'k' : it.sold}` });\n  else t.push({ s: 'warn', t: '⚠ Chưa rõ số bán' });\n  if (it.overseas) t.push({ s: 'warn', t: '✈ Hàng nước ngoài' });\n  return t;\n};\nHT.shopeeSearchUrl = q => 'https://shopee.vn/search?keyword=' + encodeURIComponent(q) + '&order=asc&page=0&sortBy=price';\n// Tên sản phẩm gọn để tìm ở sàn khác\nHT.cleanTitle = title => String(title || '').replace(/\\[[^\\]]*\\]|\\([^)]*\\)|【[^】]*】/g, ' ')\n  .replace(/\\b(chính hãng|hàng chính hãng|freeship|miễn phí vận chuyển|bảo hành \\d+ tháng|mới 100%|giá rẻ|sale|hot|new)\\b/gi, ' ')\n  .replace(/[|•\\-–]+/g, ' ').replace(/\\s+/g, ' ').trim();\n\n// ---------- 🎟️ Lịch sale ----------\n// Ngày đôi (1.1 … 12.12), sale giữa tháng (15), sale lương về (25), Black Friday. big = ngày sale lớn.\nHT.saleDays = (from = new Date(), n = 4) => {\n  const out = [], d0 = new Date(from); d0.setHours(0, 0, 0, 0);\n  for (let i = 0; i < 400 && out.length < n; i++) {\n    const d = new Date(d0); d.setDate(d0.getDate() + i);\n    const day = d.getDate(), mon = d.getMonth() + 1;\n    const lastFri = mon === 11 && d.getDay() === 5 && day + 7 > 30;\n    let name = '', big = false;\n    if (day === mon) { name = `${day}.${mon}`; big = mon >= 9 || mon === 6 || mon === 3; }\n    else if (lastFri) { name = 'Black Friday'; big = true; }\n    else if (day === 15) name = `Sale giữa tháng 15.${mon}`;\n    else if (day === 25) name = `Sale lương về 25.${mon}`;\n    if (name) out.push({ name, date: d, big, days: i });\n  }\n  return out;\n};\n\n// ---------- 📉 Nhận xét giá từ lịch sử 30 ngày ----------\nHT.priceVerdict = (history, now = Date.now()) => {\n  const pts = (history || []).filter(x => x.p && now - x.t <= 30 * 86400e3);\n  if (pts.length < 3) return { cls: 'na', text: 'Chưa đủ dữ liệu, HaoHao đang theo dõi thêm' };\n  const cur = pts[pts.length - 1].p;\n  // so với giá TRƯỚC lần đổi giá gần nhất (bỏ các lần ghi lặp lại giá hiện tại)\n  let k = pts.length - 1; while (k > 0 && pts[k - 1].p === cur) k--;\n  const prev = pts.slice(0, k).map(x => x.p);\n  if (!prev.length) return { cls: 'ok', text: 'Giá không đổi trong 30 ngày' };\n  const low = Math.min(...prev), avg = prev.reduce((a, b) => a + b, 0) / prev.length;\n  const sale = HT.saleDays(new Date(now), 6).find(x => x.big && x.days <= 10);\n  const rose = pts.some((x, i) => i && now - x.t <= 10 * 86400e3 && x.p > pts[i - 1].p * 1.03);\n  if (cur <= low) return { cls: 'good', text: 'Giá thấp nhất 30 ngày 👍' };\n  if (cur <= avg * 0.97) return { cls: 'good', text: 'Giá tốt, thấp hơn bình thường' };\n  if (sale && rose && cur >= avg * 1.05) return { cls: 'bad', text: `Đang bị đẩy giá trước ${sale.name} ⚠` };\n  if (cur >= avg * 1.05) return { cls: 'warn', text: 'Cao hơn bình thường, nên chờ thêm' };\n  return { cls: 'ok', text: 'Giá bình thường' };\n};\n\n// ---------- 🛡️ Kiểm tra sản phẩm & shop (Shopee) ----------\n// Số kiểu Shopee: \"2,3k\" = 2300, \"1,2tr\" = 1.200.000, \"10k+\" = 10000, \"1.234\" = 1234\nHT.num = s => {\n  const m = String(s || '').toLowerCase().replace(/\\s/g, '').match(/^([\\d.,]+)(k|tr|triệu|m)?\\+?$/);\n  if (!m) return NaN;\n  let x = m[1];\n  if (m[2]) x = x.replace(',', '.'); else x = x.replace(/[.,](?=\\d{3}(\\D|$))/g, '').replace(',', '.');\n  return Math.round(parseFloat(x) * (m[2] === 'k' ? 1e3 : m[2] ? 1e6 : 1));\n};\n// \"5 năm trước\" → 60, \"3 tháng trước\" → 3, \"20 ngày trước\" → 0.7\nHT.monthsAgo = s => {\n  const m = String(s || '').toLowerCase().match(/(\\d+)\\s*(năm|tháng|tuần|ngày|giờ|phút)/);\n  if (!m) return NaN;\n  return +m[1] * { 'năm': 12, 'tháng': 1, 'tuần': 0.25, 'ngày': 1 / 30, 'giờ': 0, 'phút': 0 }[m[2]];\n};\nconst fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + 'tr' : n >= 1e3 ? (n / 1e3).toFixed(1).replace('.0', '') + 'k' : String(n);\n// info: { rating, ratingCount, dist: {5,4,3,2,1}, sold, photos, dupReviews, mall, preferred, responseRate, responseTime, joinedMonths, shopRatings, shopStar, followers, shipFrom }\nHT.trustScore = info => {\n  let sc = info.shopOnly ? 72 : 60; const product = [], shop = [];\n  const add = (list, pts, s, t) => { sc += pts; list.push({ s, t }); };\n  const n = info.ratingCount, r = info.rating;\n  // --- sản phẩm --- (trang shop thì chỉ chấm shop)\n  if (info.shopOnly) {} else if (!n) add(product, -15, 'bad', 'Chưa có đánh giá nào, chưa ai kiểm chứng');\n  else {\n    if (r >= 4.95 && n < 50) add(product, -5, 'warn', `${r}★ nhưng chỉ ${n} đánh giá, điểm cao bất thường`);\n    else if (r >= 4.8) add(product, n >= 50 ? 10 : 4, 'ok', `${r}★ từ ${fmtN(n)} đánh giá`);\n    else if (r >= 4.5) add(product, 5, 'ok', `${r}★ từ ${fmtN(n)} đánh giá`);\n    else if (r >= 4) add(product, -3, 'warn', `Chỉ ${r}★ (${fmtN(n)} đánh giá), thấp hơn mặt bằng Shopee`);\n    else add(product, r < 3.5 ? -25 : -15, 'bad', `Điểm thấp: ${r}★ (${fmtN(n)} đánh giá)`);\n    if (n < 20) add(product, -10, 'warn', 'Ít đánh giá, chưa đủ để tin');\n    else if (n >= 1000) add(product, 8, 'ok', 'Rất nhiều người đã mua và đánh giá');\n    else if (n >= 100) add(product, 4, 'ok', 'Đủ nhiều đánh giá để tham khảo');\n  }\n  const d = info.shopOnly ? null : info.dist, tot = d ? [1, 2, 3, 4, 5].reduce((a, k) => a + (d[k] || 0), 0) : 0;\n  if (tot >= 20) {\n    const low = ((d[1] || 0) + (d[2] || 0)) / tot;\n    if (low >= 0.1) add(product, -12, 'bad', `${Math.round(low * 100)}% đánh giá 1–2★, nhiều người không hài lòng`);\n    else if (low >= 0.05) add(product, -5, 'warn', `${Math.round(low * 100)}% đánh giá 1–2★`);\n    else add(product, 3, 'ok', `Chỉ ${Math.round(low * 100)}% đánh giá 1–2★`);\n  }\n  if (info.photos && n) {\n    if (info.photos / n >= 0.1) add(product, 5, 'ok', `${fmtN(info.photos)} đánh giá có ảnh/video thật`);\n    else if (n >= 100 && info.photos / n < 0.03) add(product, -4, 'warn', 'Rất ít đánh giá có ảnh thật');\n  }\n  if (info.sold > 50 && n && n / info.sold > 0.9) add(product, -6, 'warn', 'Số đánh giá gần bằng số đã bán, có thể có đánh giá ảo');\n  else if (info.sold >= 1000) product.push({ s: 'ok', t: `Đã bán ${fmtN(info.sold)}` });\n  // đã đọc toàn bộ đánh giá (gồm hết 1–2★): trừ điểm theo tỉ lệ lời chê trên tổng số đánh giá\n  const fr = info.fullRead, rvAll = info.reviews;\n  if (fr && rvAll) {\n    if (rvAll.issues.length) {\n      const share = rvAll.bad / Math.max(info.ratingCount || 0, rvAll.read);\n      const top = rvAll.issues.slice(0, 3).map(i => `${i.label.toLowerCase()} (${i.n})`).join(', ');\n      // càng nhiều người chê càng trừ nặng: 1/5 người mua chê thì gần như chắc chắn có vấn đề\n      const pts = share >= 0.2 ? -35 : share >= 0.1 ? -22 : share >= 0.05 ? -12 : share >= 0.02 ? -6 : -3;\n      add(product, pts, share >= 0.05 ? 'bad' : 'warn', `${rvAll.bad} đánh giá chê (${(share * 100).toFixed(share < 0.01 ? 1 : 0)}%): ${top}`);\n    } else add(product, 3, 'ok', `Đọc ${rvAll.read} đánh giá: không thấy lời chê`);\n  }\n  const rv = fr ? null : info.reviewsNormal;\n  if (rv && rv.read) {\n    if (rv.issues.length) {\n      const top = rv.issues.slice(0, 3).map(i => `${i.label.toLowerCase()} (${i.n})`).join(', ');\n      add(product, -Math.min(15, 4 * rv.issues.length), rv.bad >= 3 || rv.issues.length >= 2 ? 'bad' : 'warn', `${rv.bad}/${rv.read} đánh giá đang hiện có lời chê: ${top}`);\n    } else if (rv.read >= 4) product.push({ s: 'ok', t: `Đọc ${rv.read} đánh giá đang hiện: không thấy lời chê` });\n  }\n  if (info.dupReviews >= 3) add(product, -8, 'bad', `${info.dupReviews} đánh giá giống hệt nhau, nghi đánh giá ảo`);\n  // --- shop ---\n  if (info.mall) add(shop, 12, 'ok', info.platform === 'tiktok' ? 'TikTok Shop Mall: hàng chính hãng' : 'Shopee Mall: hàng chính hãng, được đổi trả');\n  else if (info.preferred) add(shop, 6, 'ok', 'Shop Yêu Thích: bán tốt, ít bị phàn nàn');\n  else if (info.platform !== 'tiktok') shop.push({ s: 'warn', t: 'Shop thường, không phải Mall hay Yêu Thích' });\n  if (info.responseRate != null && !isNaN(info.responseRate)) {\n    if (info.responseRate >= 90) add(shop, 4, 'ok', `Phản hồi ${info.responseRate}%${info.responseTime ? ' ' + info.responseTime : ''}`);\n    else if (info.responseRate < 70) add(shop, -6, 'warn', `Chỉ phản hồi ${info.responseRate}% tin nhắn`);\n    else shop.push({ s: 'ok', t: `Phản hồi ${info.responseRate}%${info.responseTime ? ' ' + info.responseTime : ''}` });\n  }\n  const jm = info.joinedMonths;\n  if (jm != null && !isNaN(jm)) {\n    const lbl = jm >= 12 ? `${Math.floor(jm / 12)} năm` : jm >= 1 ? `${Math.round(jm)} tháng` : 'chưa tới 1 tháng';\n    if (jm < 3) add(shop, -10, 'bad', `Shop mới tham gia ${lbl}`);\n    else if (jm < 12) add(shop, -3, 'warn', `Shop tham gia ${lbl}`);\n    else add(shop, jm >= 24 ? 4 : 2, 'ok', `Shop hoạt động ${lbl}`);\n  }\n  if (info.shopStar) {\n    if (info.shopStar >= 4.8) add(shop, 5, 'ok', `Shop được chấm ${info.shopStar}★`);\n    else if (info.shopStar < 4.5) add(shop, -8, 'warn', `Shop chỉ được ${info.shopStar}★`);\n    else shop.push({ s: 'ok', t: `Shop được chấm ${info.shopStar}★` });\n  }\n  if (info.shopRatings != null && !isNaN(info.shopRatings)) {\n    if (info.shopRatings >= 10000) add(shop, 4, 'ok', `${fmtN(info.shopRatings)} lượt đánh giá shop`);\n    else if (info.shopRatings < 100) add(shop, -5, 'warn', `Shop mới có ${info.shopRatings} lượt đánh giá`);\n  }\n  if (info.followers != null && info.followers < 100) add(shop, -3, 'warn', `Chỉ ${info.followers} người theo dõi shop`);\n  if (info.shopName && info.platform === 'tiktok') shop.push({ s: 'ok', t: `Người bán: ${info.shopName}` });\n  if (info.shipFrom) {\n    if (/nước ngoài|quốc tế|trung quốc|overseas/i.test(info.shipFrom)) add(shop, -4, 'warn', `Hàng gửi từ ${info.shipFrom}: giao lâu, khó đổi trả`);\n    else shop.push({ s: 'ok', t: `Gửi từ ${info.shipFrom}` });\n  }\n  const score = Math.max(0, Math.min(100, Math.round(sc)));\n  const [level, cls] = score >= 80 ? ['Đáng tin', 'good'] : score >= 60 ? ['Khá ổn', 'ok'] : score >= 40 ? ['Cân nhắc', 'warn'] : ['Rủi ro', 'bad'];\n  return { score, level, cls, product, shop };\n};\n\n// ---------- 💬 Đọc lời chê trong đánh giá ----------\n// Mỗi chủ đề: mẫu có dấu (đánh giá thường có dấu) + mẫu không dấu. Trích nguyên câu của người mua, không nói chung chung.\nHT.REVIEW_TOPICS = [\n  { id: 'quality', label: 'Chất lượng kém', re: /(chất lượng kém|kém chất lượng|quá tệ|tệ|kém|dởm|đểu|rách|bung chỉ|sứt chỉ|xù lông|phai màu|ra màu|bạc màu|co rút|lỗi|hỏng|hư|mỏng dính|mỏng quá|vải mỏng|không bền|nhanh hỏng|cũ|trầy)/u,\n    fold: /(chat luong kem|kem chat luong|te qua|rach|bung chi|xu long|phai mau|ra mau|bac mau|mong dinh|vai mong|khong ben|nhanh hong)/ },\n  { id: 'look', label: 'Xấu, không giống hình', re: /(xấu|không giống hình|khác hình|không giống ảnh|khác ảnh|không như hình|không như ảnh|không giống video|khác video|không như video|không đúng mô tả|khác mô tả|sai màu|khác màu|màu khác|màu không giống)/u,\n    fold: /(khong giong hinh|khac hinh|khong giong anh|khac anh|khong nhu hinh|khong giong video|khac video|khong dung mo ta|khac mo ta|sai mau|khac mau|mau khac)/ },\n  { id: 'size', label: 'Sai size, không vừa', re: /(chật|rộng quá|quá rộng|nhỏ quá|quá nhỏ|to quá|quá to|sai size|không vừa|size không chuẩn|lệch size|form xấu|dài quá|ngắn quá)/u,\n    fold: /(sai size|khong vua|size khong chuan|lech size)/ },\n  { id: 'fake', label: 'Nghi hàng giả, nhái', re: /(hàng giả|fake|hàng nhái|nhái|không chính hãng|không phải hàng thật|hàng dỏm|hàng lỗi)/u,\n    fold: /(hang gia|hang nhai|khong chinh hang|hang dom)/ },\n  { id: 'ship', label: 'Giao hàng, đóng gói', re: /(giao chậm|giao lâu|giao thiếu|thiếu hàng|thiếu đồ|giao sai|gửi sai|đóng gói sơ sài|đóng gói ẩu|móp|bẹp|vỡ|bể)/u,\n    fold: /(giao cham|giao lau|giao thieu|thieu hang|giao sai|gui sai|dong goi so sai)/ },\n  { id: 'smell', label: 'Mùi khó chịu', re: /(mùi hôi|hôi rình|bốc mùi|mùi khó chịu|mùi hắc|mùi hóa chất|mùi lạ|hôi quá)/u,\n    fold: /(mui hoi|boc mui|mui kho chiu|mui hac|mui hoa chat)/ },\n  { id: 'shop', label: 'Shop, đổi trả', re: /(không trả lời|không rep|thái độ|không hỗ trợ|lừa đảo|lừa|không cho đổi|không đổi trả|không hoàn tiền|shop tệ)/u,\n    fold: /(khong tra loi|khong ho tro|lua d e.local.set({ pomoStats: Object.fromEntries(keep.map(x => [x, pomoStats[x]])) });\n    const round = (pomo.round || 0) + 1, isLong = round % (cfg.every || 4) === 0, mins = isLong ? cfg.lng : cfg.brk;\n    await pomoSave({ ...pomo, phase: isLong ? 'long' : 'break', endAt: Date.now() + mins * 60000, round });\n    await fire(P, `🍅 Hoàn thành ${pomo.focusMin || cfg.focus} phút Pomodoro${pomo.task ? `: ${pomo.task}` : ''}! Đang cho bạn ${isLong ? 'nghỉ dài' : 'nghỉ'} ${mins} phút.`, 'remind', { end: true, task: pomo.task || '' });\n  } else {\n    if (cfg.autoNext) {\n      await pomoStart({});\n      await fire(P, `☕ Hết giờ nghỉ! Tự vào phiên ${(pomo.round || 0) + 1}, cố lên nhé 💪`, 'remind');\n    } else {\n      await pomoSave({ ...pomo, phase: 'idle', paused: false });\n      await fire(P, `☕ Hết giờ nghỉ! Sẵn sàng vào phiên ${(pomo.round || 0) + 1} chưa?`, 'remind', { next: true });\n    }\n  }\n}\n\nasync function pomoTaskDone(task) {   // \"Hoàn thành việc\" sau phiên tập trung: tick việc trong Todo\n  if (!task) return;\n  const { todos = [] } = await chrome.storage.local.get('todos');\n  const t = todos.find(x => !x.done && x.text === task);\n  if (t) { t.done = true; await chrome.storage.local.set({ todos }); }\n}\n\n// ---------- Nhắc nhanh bằng câu tiếng Việt (menu chuột phải, ô nhập trong nhánh Nhắc) ----------\nasync function quickRemind(text) {\n  const r = HT.parseWhen(text);\n  const { todos = [] } = await chrome.storage.local.get('todos');\n  const item = { id: 't' + Date.now().toString(36), text: r.task.slice(0, 200), done: false, due: r.due ? HT.localISO(r.due) : '', notified: false };\n  todos.push(item);\n  await chrome.storage.local.set({ todos });\n  return { ok: true, item, due: r.due ? r.due.getTime() : 0 };\n}\n\n// ---------- Menu chuột phải ----------\nasync function makeMenus() {\n  await loadLang();\n  chrome.contextMenus.removeAll(() => {\n    chrome.contextMenus.create({ id: 'hh', title: HT.tr('🐹 HaoHao'), contexts: ['selection', 'page' h-open', tab: 'todo' });\n  }\n  if (info.menuItemId === 'hh-note') {\n    await ideaAdd({ type: sel ? 'text' : 'page', text: sel, title: tab ? tab.title : '', url: tab ? tab.url : '' });\n    toTab({ type: 'hh-open', tab: 'idea' });\n  }\n  if (info.menuItemId === 'hh-translate') toTab({ type: 'hh-open', tab: 'info', sub: 'dich', text: sel });\n  if (info.menuItemId === 'hh-explain') toTab({ type: 'hh-open', tab: 'info', sub: 'explain', text: sel });\n  // bôi đen tên món → HaoHao tìm và lọc sẵn trong bảng Mua sắm; trang không chạy được HaoHao thì mở thẳng Shopee\n  if (info.menuItemId === 'hh-shop' && sel) {\n    const q = sel.replace(/\\s+/g, ' ').slice(0, 100);\n    const ok = tab && tab.id && await chrome.tabs.sendMessage(tab.id, { type: 'hh-open', tab: 'shop', search: q }).then(() => true).catch(() => false);\n    if (!ok) openDeal(HT.shopeeFindUrl(q));\n  }\n  if (info.menuItemId === 'hh-summary') toTab({ type: 'hh-open', tab: 'info', sub: 'read', run: true });\n});\n\n// ---------- 💡 Giải thích ----------\nasync function aiExplain({ text, mode, context }) {\n  const how = {\n    de: 'Giải thích thật dễ hiểu như nói với người không chuyên, 2 đến 4 câu, không dùng thuật ngữ khó.',\n    chitiet: 'Giải thích chi tiết: định nghĩa, cách hoạt động hoặc cách tính (nếu có), khi nào dùng, lưu ý thường gặp. Dùng gạch đầu dòng \"- \".',\n    vidu: 'Giải thích ngắn gọn 1 đến 2 câu, rồi cho 2 ví dụ cụ thể, gần gũi với người Việt (có số liệu minh hoạ nếu hợp).'\n  }[mode] || '';\n  return gemini([{ role: 'user', parts: [{ text:\n    `Người dùng đang đọc trang \"${context || ''}\" và bôi đen cụm sau, muốn biết nó nghĩa là gì:\n\"${String(text).slice(0, 2000)}\"\n${how}\nNếu là tiếng nước ngoài thì ghi nghĩa tiếng Việt trước. Bắt đầu bằng **tên cụm từ** in đậm. Trả lời bằng tiếng Việt.` }] }], AI_SYS, { temperature: 0.3, maxTokens: 2048 });\n}\n\n// ---------- 🛒 Mua sắm (Shopee, TikTok Shop): mở link tiếp thị ----------\n// Chỉ mở link tiếp thị khi người dùng tự bấm (nút Mua ngay, So giá, Tìm). Không tự thay link khi đang lướt web.\nasync function openDeal(url) {\n  if (typeof url !== 'string' || !/^https:\\/\\//.test(url) || MAIL_HOSTS.some(h => url.startsWith(h))) return;\n  const { couponFeed } = await chrome.storage.local.get('couponFeed'); HT.setTikTok(couponFeed && couponFeed.tiktok);\n  chrome.tabs.create({ url: HT.aff(url) });\n}\n// ---------- 🎟️ Kho mã giảm giá ----------\n// Nhận nội dung coupons.json (từ GitHub hoặc bản đóng gói), lọc dữ liệu hợp lệ rồi lưu cho các trang dùng\nasync function applyFeed(feed) {\n  const coupons = (feed.coupons || []).filter(c => c && c.id && HT.couponLive(c)).slice(0, 200);\n  const hubs = (feed.hubs || []).filter(h => h && /^https:\\/\\//.test(h.url)).slice(0, 12);\n  // link TikTok riêng từng món: chỉ nhận mã sản phẩm là số và link tiktok.com; kèm tên món để gợi ý món tương tự\n  const tt = feed.tiktok || {}, links = {}, titles = {}, images = {};\n  for (const [id, u] of Object.entries(tt.links || {}).slice(0, 2000)) if (/^\\d{8,}$/.test(id) && /^https:\\/\\/(vt|vm|www|shop)\\.tiktok\\.com\\//.test(u)) {\n    links[id] = u; const t = (tt.titles || {})[id]; if (typeof t === 'string' && t.trim()) titles[id] = t.trim().slice(0, 160);\n    const im = (tt.images || {})[id]; if (typeof im === 'string' && /^https:\\/\\/[\\w.-]+\\.(ibyteimg|tiktokcdn|tiktokcdn-us|byteimg)\\.com\\//.test(im)) images[id] = im;\n  }\n  const tiktok = { creator: /^[\\w.]{2,40}$/.test(tt.creator || '') ? tt.creator : '', links, titles, images, showcase: /^https:\\/\\/(www\\.|vt\\.|vm\\.)?tiktok\\.com\\//.test(tt.showcase || '') ? tt.showcase : '' };\n  HT.setTikTok(tiktok);\n  const sp = feed.shopee || {}, shopee = { showcase: /^https:\\/\\/(collshp\\.com|shopee\\.vn|s\\.shopee\\.vn)\\//.test(sp.showcase || '') ? sp.showcase : '' };\n  await chrome.storage.local.set({ couponFeed: { at: Date.now(), updated: feed.updated || '', coupons, hubs, tiktok, shopee } });\n  return { ok: true, n: coupons.length };\n}\n\n// ---------- 🛍️ Link TikTok của tôi (chủ app): dán link vt.tiktok.com → tự lấy mã + tên món → ghi lên GitHub ----------\nconst FEED_REPO = { owner: 'nhatphan79', repo: 'nhatphan79', path: 'haohao-extension/coupons.json', branch: 'main' };\nconst ttTitleOf = url => { try { const j = JSON.parse(new URL(url).searchParams.get('og_info') || '{}'); return String(j.title || '').replace(/\\+/g, ' ').trim(); } catch { return ''; } };\nconst ttImageOf = url => { try { const j = JSON.parse(new URL(url).searchParams.get('og_info') || '{}'); return /^https:\\/\\//.test(j.image || '') ? j.image : ''; } catch { return ''; } };\nconst htmlDecode = s => String(s || '').replace(/&amp;/g, '&').replace(/&quot;/g, '\"').replace(/&#39;/g, \"'\").replace(/&lt;/g, '<').replace(/&gt;/g, '>');\n// 1 dòng dán vào: \"link\" hoặc \"link  mã-sản-phẩm\" (khi TikTok không cho HaoHao tự đọc mã)\nasync function ttResolve(line) {\n  const link = (line.match(/https:\\/\\/(?:vt|vm)\\.tiktok\\.com\\/[\\w-]+\\/?/) || [])[0];\n  const long = (line.match(/https:\\/\\/(?:www|shop)\\.tiktok\\.com\\/\\S+/) || [])[0];\n  let id = (line.replace(/https?:\\/\\/\\S+/g, ' ').match(/\\b(\\d{15,22})\\b/) || [])[1] || (long ? HT.ttId(long) : ''), title = long ? ttTitleOf(long) : '', image = long ? ttImageOf(long) : '';\n  if (!link) return { line, error: long ? 'Cần link rút gọn vt.tiktok.com (Chia sẻ → Sao chép liên kết)' : 'Không thấy link TikTok' };\n  if (!id || !title) {\n    try {\n      const r = await fetch(link, { redirect: 'follow', credentials: 'omit' });\n      id = id || HT.ttId(r.url); title = title || ttTitleOf(r.url); image = image || ttImageOf(r.url);\n      if (!id || !title) {\n        const html = await r.text();\n        id = id || ((html.match(/\\/pdp\\/(?:[^\"'?\\/\\s]*\\/)?(\\d{15,22})|\\/product\\/(\\d{15,22})/) || []).slice(1).find(Boolean) || '');\n        title = title || htmlDecode((html.match(/<meta[^>]+property=[\"']og:title[\"'][^>]+content=[\"']([^\"']+)/i) || [])[1] || '').replace(/\\s*\\|\\s*TikTok.*$/i, '');\n        image = image || htmlDecode((html.match(/<meta[^>]+property=[\"']og:image[\"'][^>]+content=[\"']([^\"']+)/i) || [])[1] || '');\n      }\n    } catch {}\n  }\n  if (!id) return { line, link, error: 'Không đọc được mã sản phẩm: dán thêm mã (dãy số sau /pdp/) cùng dòng' };\n  return { line, link, id, title: title.slice(0, 160), image };\n}\nconst b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\\s/g, '')), c => c.charCodeAt(0)));\nconst b64enc = s => { const u = new TextEncoder().encode(s); let b = ''; for (let i = 0; i < u.length; i += 0x8000) b += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(b); };\n// đọc coupons.json trên GitHub (nhánh main), sửa bằng mut(feed), ghi lại; xong áp dụng ngay trên máy này\nasync function ghFeedEdit(mut, message) {\n  const { ghToken } = await chrome.storage.local.get('ghToken');\n  if (!ghToken) throw new Error('notoken');\n  const api = `https://api.github.com/repos/${FEED_REPO.owner}/${FEED_REPO.repo}/contents/${FEED_REPO.path}`;\n  const h = { Authorization: 'Bearer ' + ghToken, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };\n  const r = await fetch(api + '?ref=' + FEED_REPO.branch, { headers: h, cache: 'no-store' });\n  if (r.status === 401) throw new Error('badtoken');\n  if (r.status === 404) throw new Error('nofile');\n  if (!r.ok) throw new Error('GitHub ' + r.status);\n  const j = await r.json(), feed = JSON.parse(b64dec(j.content));\n  mut(feed);\n  feed.updated = new Date().toISOString().slice(0, 10);\n  const w = await fetch(api, { method: 'PUT', headers: { ...h, 'Content-Type': 'application/json' },\n    body: JSON.stringify({ message, content: b64enc(JSON.stringify(feed, null, 2) + '\\n'), sha: j.sha, branch: FEED_REPO.branch }) });\n  if (w.status === 401 || w.status === 403) throw new Error('noperm');\n  if (!w.ok) throw new Error('GitHub ' + w.status);\n  await applyFeed(feed);\n  return feed;\n}\nasync function ttAdd({ text }) {\n  const lines = String(text || '').split(/\\n+/).map(x => x.trim()).filter(Boolean).slice(0, 50);\n  const res = []; for (const l of lines) res.push(await ttResolve(l));\n  const ok = res.filter(x => x.id);\n  if (ok.length) await ghFeedEdit(feed => {\n    const t = feed.tiktok = feed.tiktok || {}; t.links = t.links || {}; t.titles = t.titles || {};\n    t.images = t.images || {};\n    for (const x of ok) { t.links[x.id] = x.link; if (x.title) t.titles[x.id] = x.title; if (x.image) t.images[x.id] = x.image; }\n  }, `HaoHao: thêm ${ok.length} link TikTok`);\n  return { ok: true, added: ok.map(x => ({ id: x.id, title: x.title })), failed: res.filter(x => !x.id).map(x => ({ line: x.line.slice(0, 80), error: x.error })) };\n}\nasync function ttRemove({ id }) {\n  await ghFeedEdit(feed => { const t = feed.tiktok || {}; if (t.links) delete t.links[id]; if (t.titles) delete t.titles[id]; if (t.images) delete t.images[id]; }, 'HaoHao: bỏ 1 link TikTok');\n  return { ok: true };\n}\n\n// Lấy từ file coupons.json trên GitHub (chủ app cập nhật); mạng lỗi thì dùng bản đóng gói sẵn trong tiện ích.\nasync function syncCoupons() {\n  let feed = null;\n  try { const r = await fetch(HT.COUPON_FEED + '?t=' + Math.floor(Date.now() / 3600e3), { cache: 'no-store' }); if (r.ok) feed = await r.json(); } catch {}\n  // GitHub chưa có / mất mạng: dùng bản đi kèm tiện ích (luôn mới theo phiên bản); hỏng nữa mới dùng bản đã lưu\n  if (!feed) { try { feed = await (await fetch(chrome.runtime.getURL('coupons.json'))).json(); } catch {} }\n  if (!feed) { const { couponFeed } = await chrome.storage.local.get('couponFeed'); if (couponFeed && couponFeed.coupons) { HT.setTikTok(couponFeed.tiktok); return { ok: true, cached: true, n: couponFeed.coupons.length }; } return { ok: false }; }\n  return applyFeed(feed);\n}\n\n// ---------- 🔍 Tìm cùng món ở shop khác trên Shopee ----------\n// Shopee không cho đọc từ nền, nên dùng 1 tab ẩn: mở trang tìm kiếm (sắp theo giá) để lấy danh sách,\n// rồi mở lần lượt vài sản phẩm rẻ hơn để đọc tên shop và chấm điểm kiểm tra, xong đóng tab.\nconst scanJobs = new Map();\nfunction scanIn(tabId, url, type, ms) {\n  return new Promise(resolve => {\n    const t = setTimeout(() => { scanJobs.delete(tabId); resolve(null); }, ms);\n    scanJobs.set(tabId, { type, done: r => { clearTimeout(t); scanJobs.delete(tabId); resolve(r); } });\n    chrome.tabs.update(tabId, { url });\n  });\n}\n// Tab dò ngầm nằm trong 1 cửa sổ thu nhỏ riêng, không chen vào thanh tab của người dùng; xong việc thì đóng cửa sổ\nlet scanWinP = null, scanUsers = 0;\nasync function scanTab() {\n  scanUsers++;\n  if (scanWinP) { const id = await scanWinP.catch(() => null); if (id && await chrome.windows.get(id).then(() => 1, () => 0)) return chrome.tabs.create({ windowId: id, url: 'about:blank', active: false }); }\n  let first;\n  scanWinP = chrome.windows.create({ url: 'about:blank', state: 'minimized', focused: false }).then(w => { first = w.tabs[0]; return w.id; });\n  await scanWinP; return first;\n}\nfunction dropScanTab(tabId) {\n  if (--scanUsers > 0) return chrome.tabs.remove(tabId).catch(() => {});\n  scanUsers = 0; const p = scanWinP; scanWinP = null;\n  if (p) p.then(id => chrome.windows.remove(id)).catch(() => {});\n}\nlet sameQueue = Promise.resolve();\n// báo tiến độ về trang đang hỏi: kết quả nhanh (từ trang tìm kiếm) rồi từng bước kiểm tra kỹ\nconst tellTab = (sender, key, m) => { if (sender && sender.tab && sender.tab.id) chrome.tabs.sendMessage(sender.tab.id, { type: 'same-progress', key, ...m }).catch(() => {}); };\nconst quickOpts = list => HT.pickOptions(list.map(x => ({ ...x, ...HT.listingScore(x), issues: [], quick: true })));\nfunction sameFind(msg, sender) { const run = sameQueue.then(() => sameFindOne(msg, sender)); sameQueue = run.catch(() => {}); return run; }\nasync function sameFindOne({ q, key, title, price }, sender) {\n  const ck = 'same3:' + key, cache = (await chrome.storage.session.get(ck))[ck];\n  if (cache && Date.now() - cache.at < 20 * 60e3) return { ...cache, cached: true };\n  // tab trống trước, ghi nhận việc rồi mới tải trang (để trang không chạy trước khi kịp ghi nhận)\n  const tab = await scanTab();\n  try {\n    tellTab(sender, key, { step: 'search' });\n    const list = await scanIn(tab.id, HT.shopeeSearchUrl(q), 'search', 25000);\n    if (!list) return { ok: false, error: 'timeout' };\n    // chỉ giữ đúng CÙNG sản phẩm (cùng hãng, model, dung lượng, phiên bản, số lượng…); rẻ dưới 1/2 giá là đáng ngờ → bỏ\n    const same = list.filter(x => x.key !== key).map(x => ({ ...x, ...HT.sameProduct(title, x.title) })).filter(x => x.same && x.price >= price * 0.5);\n    const cheaper = same.filter(x => x.price < price * 0.99).sort((a, b) => a.price - b.price);\n    // ứng viên: 2 món rẻ nhất + 2 món có dấu hiệu uy tín nhất (Mall, Yêu thích, bán nhiều)\n    const rep = x => (x.mall ? 3 : x.preferred ? 2 : 0) + (x.sold >= 1000 ? 1 : 0) + (x.rating >= 4.8 ? 1 : 0);\n    const cands = [...new Map([...cheaper.slice(0, 2), ...[...cheaper].sort((a, b) => rep(b) - rep(a) || a.price - b.price).slice(0, 2), ...cheaper.slice(2)].map(x => [x.key, x])).values()].slice(0, 3);\n    tellTab(sender, key, { step: 'check', done: 0, of: cands.length, quick: { total: same.length, options: quickOpts(cheaper) } });\n    const checked = [];\n    for (const c of cands) { const x = await checkListing(tab.id, c, t => HT.sameProduct(title, t).same); if (x) checked.push(x); tellTab(sender, key, { step: 'check', done: checked.length, of: cands.length }); }\n    // 3 lựa chọn: đáng mua nhất (rẻ nhất trong shop điểm cao), rẻ nhất, uy tín nhất\n    const res = { ok: true, at: Date.now(), total: same.length, options: HT.pickOptions(checked) };\n    await chrome.storage.session.set({ [ck]: res });\n    return res;\n  } finally { dropScanTab(tab.id); }\n}\n\n// Mở trang 1 sản phẩm trong tab ẩn để chấm điểm shop. verify(tênĐầyĐủ) = false thì bỏ món đó.\nasync function checkListing(tabId, c, verify) {\n  const r = await scanIn(tabId, c.url, 'item', 14000);\n  if (verify && r && r.title && !verify(r.title)) return null;\n  const info = (r && r.info) || { rating: c.rating, ratingCount: null, sold: c.sold, mall: c.mall, preferred: c.preferred, shipFrom: c.overseas ? 'Nước ngoài' : '' };\n  const ts = HT.trustScore(info);\n  return { key: c.key, url: c.url, image: (r && r.image) || c.image || '', title: (r && r.title) || c.title, sim: c.sim, price: (r && r.price) || c.price, shopName: (r && r.shopName) || '', score: ts.score, level: ts.level, cls: ts.cls,\n    rating: info.rating || c.rating, sold: info.sold ?? c.sold, mall: !!(info.mall || c.mall), preferred: !!(info.preferred || c.preferred), full: !!(r && r.info),\n    // bản kiểm tra gọn cho nút 🛡️: điểm xấu trước, tối đa 6 dòng + 2 lời chê nổi bật\n    reasons: [...ts.product, ...ts.shop].sort((a, b) => ({ bad: 0, warn: 1, ok: 2 }[a.s] - { bad: 0, warn: 1, ok: 2 }[b.s])).slice(0, 6),\n    issues: ((info.reviews && info.reviews.issues) || []).slice(0, 2).map(i => ({ label: i.label, n: i.n, quote: i.quotes[0] || '' })) };\n}\n\n// 🔎 Tìm sản phẩm: mở ngầm trang tìm kiếm Shopee, bỏ món rủi ro / lạc đề, kiểm tra 4 món tốt nhất rồi chọn 3\nfunction prodSearch(msg, sender) { const run = sameQueue.then(() => prodSearchOne(msg, sender)); sameQueue = run.catch(() => {}); return run; }\nasync function prodSearchOne({ q, range, mall }, sender) {\n  q = String(q || '').trim().slice(0, 100); if (!q) return { ok: false, error: 'empty' };\n  const ck = 'ps:' + HT.fold(q) + '|' + (range || '') + '|' + (mall ? 1 : 0), cache = (await chrome.storage.session.get(ck))[ck];\n  if (cache && Date.now() - cache.at < 20 * 60e3) return { ...cache, cached: true };\n  const tab = await scanTab();\n  try {\n    const pk = 'ps:' + HT.fold(q);\n    tellTab(sender, pk, { step: 'search' });\n    const list = await scanIn(tab.id, HT.shopeeFindUrl(q, range), 'search', 25000);\n    if (!list) return { ok: false, error: 'timeout' };\n    const [lo, hi] = HT.PRICE_RANGES[range] || [0, Infinity];\n    const fit = list.filter(x => x.price >= lo && x.price <= hi && (!mall || x.mall) && HT.matchQuery(q, x.title));\n    // bỏ món rủi ro: bán dưới 10, điểm dưới 4.3, hàng nước ngoài\n    const safe = fit.filter(x => !x.overseas && !(x.sold != null && x.sold < 10) && !(x.rating && x.rating < 4.3)).map(x => ({ ...x, ...HT.listingScore(x) }));\n    const top = [...safe].sort((a, b) => b.score - a.score || a.price - b.price);\n    const cheap = [...safe].filter(x => x.score >= 70).sort((a, b) => a.price - b.price);\n    // trùng nhau (món điểm cao cũng là món rẻ) thì lấy thêm món kế tiếp cho đủ 3\n    const cands = [...new Map([...top.slice(0, 2), ...cheap.slice(0, 1), ...top.slice(2), ...cheap.slice(1)].map(x => [x.key, x])).values()].slice(0, 3);\n    tellTab(sender, pk, { step: 'check', done: 0, of: cands.length, quick: { total: fit.length, safe: safe.length, options: quickOpts(safe) } });\n    const checked = [];\n    for (const c of cands) { const x = await checkListing(tab.id, c); if (x) checked.push(x); tellTab(sender, pk, { step: 'check', done: checked.length, of: cands.length }); }\n    const res = { ok: true, at: Date.now(), total: fit.length, safe: safe.length, options: HT.pickOptions(checked) };\n    await chrome.storage.session.set({ [ck]: res });\n    return res;\n  } finally { dropScanTab(tab.id); }\n}\n\n// Đọc toàn bộ đánh giá bằng tab ẩn (khi không lấy thẳng được): bấm lọc sao và lật từng trang\n// hàng đợi riêng: đọc đánh giá (có thể lâu) không làm chậm việc tìm shop rẻ hơn\nlet rvQueue = Promise.resolve();\nfunction reviewsScan(msg) { const run = rvQueue.then(() => reviewsScanOne(msg)); rvQueue = run.catch(() => {}); return run; }\nasync function reviewsScanOne({ url, key }) {\n  const ck = 'rv:' + key, cache = (await chrome.storage.session.get(ck))[ck];\n  if (cache && Date.now() - cache.at < 60 * 60e3) return cache;\n  const tab = await scanTab();\n  try {\n    const items = await scanIn(tab.id, url, 'reviews', 120000);\n    const res = { at: Date.now(), items: items || [] };\n    if (items && items.length) await chrome.storage.session.set({ [ck]: res });\n    return res;\n  } finally { dropScanTab(tab.id); }\n}\n", "voice.js": "// © 2026 HaoHao – Bản quyền thuộc Phan Thanh Nhật (0366.159.790). Mọi quyền được bảo lưu.\nconst $ = s => document.querySelector(s);\nconst target = new URLSearchParams(location.search).get('target') || 'idea';\nconst SR = window.SpeechRecognition || window.webkitSpeechRecognition;\nlet rec = null, listening = false, finalText = '';\n\nif (target === 'todo') { $('#saveTodo').classList.add('main'); $('#saveIdea').classList.remove('main'); }\n\nfunction setUI() {\n  $('#mic').classList.toggle('on', listening); $('#mic').classList.toggle('off', !listening);\n  $('#head').textContent = listening ? 'HaoHao đang nghe…' : 'Đã dừng nghe';\n  const has = $('#txt').value.trim().length > 0;\n  $('#saveIdea').disabled = !has; $('#saveTodo').disabled = !has;\n}\nfunction status(t, err) { $('#status').textContent = t; $('#status').classList.toggle('err', !!err); }\n\nfunction start() {\n  if (!SR) { status('Chrome này không hỗ trợ nhận giọng nói. Bạn gõ tay vào ô bên dưới nhé.', true); setUI(); return; }\n  if (listening) return;\n  rec = new SR();\n  rec.lang = 'vi-VN'; rec.continuous = true; rec.interimResults = true;\n  finalText = $('#txt').value ? $('#txt').value.trim() + ' ' : '';\n  rec.onresult = e => {\n    let interim = '';\n    for (let i = e.resultIndex; i < e.results.length; i++) {\n      const r = e.results[i];\n      if (r.isFinal) finalText += r[0].transcript.trim() + ' '; else interim += r[0].transcript;\n    }\n    $('#txt').value = (finalText + interim).trim();\n    setUI();\n  };\n  rec.onerror = e => {\n    const map = {\n      'not-allowed': 'Chưa cho phép dùng micro. Bấm vào biểu tượng ổ khoá hoặc micro ở đầu cửa sổ, chọn Cho phép, rồi bấm nút micro lại.',\n      'service-not-allowed': 'Chrome chưa cho phép nhận giọng nói. Bấm nút micro để thử lại.',\n      'no-speech': 'Không nghe thấy gì. Bấm nút micro rồi nói lại nhé.',\n      'audio-capture': 'Không tìm thấy micro trên máy.',\n      'network': 'Nhận giọng nói cần có mạng Internet.'\n    };\n    status(map[e.error] || ('Lỗi: ' + e.error), true);\n  };\n  rec.onend = () => { listening = false; setUI(); if (!$('#status').classList.contains('err')) status($('#txt').value ? 'Xong. Sửa lại nếu cần rồi bấm Lưu.' : 'Bấm nút micro để nói.'); };\n  try { rec.start(); listening = true; status('Cứ nói tự nhiên bằng tiếng Việt. Nói xong bấm Lưu.'); } catch { }\n  setUI();\n}\nfunction stop() { if (rec) rec.stop(); }\n\n$('#mic').addEventListener('click', () => listening ? stop() : start());\n$('#again').addEventListener('click', () => { stop(); $('#txt').value = ''; finalText = ''; setTimeout(start, 250); });\n$('#txt').addEventListener('input', setUI);\n$('#saveIdea').addEventListener('click', async () => {\n  stop();\n  const text = $('#txt').value.trim(); if (!text) return;\n  await chrome.runtime.sendMessage({ type: 'idea-add', item: { type: 'voice', text, title: 'Ghi chú giọng nói' } });\n  status('Đã lưu vào kho ý tưởng 💡'); setTimeout(() => window.close(), 600);\n});\n$('#saveTodo').addEventListener('click', async () => {\n  stop();\n  const text = $('#txt').value.trim(); if (!text) return;\n  const { todos = [] } = await chrome.storage.local.get('todos');\n  todos.push({ id: 't' + Date.now().toString(36), text, done: false, due: '', notified: false });\n  await chrome.storage.local.set({ todos });\n  status('Đã thêm vào Todolist ✅'); setTimeout(() => window.close(), 600);\n});\ndocument.addEventListener('keydown', e => { if (e.key === 'Escape') window.close(); });\nsetUI();\nstart();\n", "options.css": ":root {\n  --ink: #23305E; --ink-soft: #5B648A; --honey: #F2B544; --honey-deep: #D98E1F;\n  --sky: #EAF1FF; --paper: #FFFDF6; --line: #C9CEDF; --coral: #E85D5D; --mint: #2F9E7E;\n}\n* { box-sizing: border-box; }\nbody { margin: 0; min-he
