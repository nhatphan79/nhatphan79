const $ = s => document.querySelector(s);
const code = $('#code'), gutter = $('#gutter');
let files = {};      // tên -> nội dung text
let current = 'content.js';
const DRAFT_KEY = 'haohao-workbench-v1', OLD_KEY = 'hattieu-workbench-v1';

// ---------- lưu nháp ----------
function loadDrafts() {
  files = { ...ORIGINAL };
  try {
    if (!localStorage.getItem(DRAFT_KEY) && localStorage.getItem(OLD_KEY)) {
      localStorage.setItem(DRAFT_KEY, localStorage.getItem(OLD_KEY).replace(/Hạt Tiêu/g, 'HaoHao'));
      localStorage.removeItem(OLD_KEY);
    }
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    if (d && d.files) Object.assign(files, d.files);
    if (d && d.removed) d.removed.forEach(n => { if (!(n in ORIGINAL)) delete files[n]; });
  } catch {}
}
function saveDrafts() {
  const changed = {};
  for (const n in files) if (files[n] !== ORIGINAL[n]) changed[n] = files[n];
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ files: changed })); $('#saved').textContent = 'Đã lưu nháp'; } catch { $('#saved').textContent = 'Không lưu được nháp trên trình duyệt này'; }
}

// ---------- danh sách file ----------
const kindOf = n => (n.split('.').pop() || '').toUpperCase().slice(0, 4);
function renderList() {
  const L = $('#fileList'); L.innerHTML = '';
  const names = [...Object.keys(files).sort(order), ...Object.keys(BINARY)];
  for (const n of names) {
    const li = document.createElement('li'); const b = document.createElement('button');
    b.className = n === current ? 'on' : '';
    const k = document.createElement('span'); k.className = 'kind'; k.textContent = n in BINARY ? 'PNG' : kindOf(n);
    const t = document.createElement('span'); t.textContent = n;
    b.append(k, t);
    if (!(n in BINARY) && files[n] !== ORIGINAL[n]) { const d = document.createElement('span'); d.className = 'dot'; d.title = 'Đã sửa'; b.append(d); }
    b.addEventListener('click', () => open(n));
    li.append(b); L.append(li);
  }
}
function order(a, b) {
  const rank = n => ['manifest.json', 'content.js', 'background.js', 'common.js', 'options.html', 'options.js', 'options.css', 'alert.html', 'alert.js', 'voice.html', 'voice.js', 'coupons.json'].indexOf(n);
  const ra = rank(a), rb = rank(b);
  return (ra < 0 ? 99 : ra) - (rb < 0 ? 99 : rb) || a.localeCompare(b);
}

// ---------- trình soạn ----------
function open(n) {
  current = n;
  $('#curName').textContent = n;
  const body = $('#edBody');
  body.querySelector('.imgview')?.remove();
  const isBin = n in BINARY;
  code.hidden = gutter.hidden = isBin;
  $('#restore').hidden = isBin || !(n in ORIGINAL);
  $('#delFile').hidden = isBin || (n in ORIGINAL);
  if (isBin) {
    const v = document.createElement('div'); v.className = 'imgview';
    v.innerHTML = `<img src="data:image/png;base64,${BINARY[n]}" alt="${n}"><div>Ảnh icon, không sửa được ở đây.<br>Muốn đổi icon, thay file PNG sau khi giải nén.</div>`;
    body.append(v);
    $('#size').textContent = ''; $('#pos').textContent = '';
  } else {
    code.value = files[n]; code.scrollTop = 0; code.scrollLeft = 0;
    updateGutter(); updatePos();
  }
  renderList();
}
function updateGutter() {
  const lines = code.value.split('\n').length;
  let s = ''; for (let i = 1; i <= lines; i++) s += i + '\n';
  gutter.textContent = s;
  gutter.scrollTop = code.scrollTop;
  $('#size').textContent = `${lines} dòng`;
}
function updatePos() {
  const before = code.value.slice(0, code.selectionStart).split('\n');
  $('#pos').textContent = `Dòng ${before.length}, cột ${before[before.length - 1].length + 1}`;
}
let draftTimer;
code.addEventListener('input', () => {
  files[current] = code.value; updateGutter(); updatePos();
  $('#saved').textContent = 'Đang sửa…';
  clearTimeout(draftTimer); draftTimer = setTimeout(() => { saveDrafts(); renderList(); }, 600);
});
code.addEventListener('scroll', () => { gutter.scrollTop = code.scrollTop; });
code.addEventListener('keyup', updatePos); code.addEventListener('click', updatePos);
code.addEventListener('keydown', e => {
  if (e.key === 'Tab' && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    const s = code.selectionStart, en = code.selectionEnd;
    code.setRangeText('  ', s, en, 'end');
    code.dispatchEvent(new Event('input'));
  } else if (e.key === 'Enter') {
    const s = code.selectionStart;
    const line = code.value.slice(0, s).split('\n').pop();
    const indent = line.match(/^\s*/)[0] + (/[{[(]\s*$/.test(line) ? '  ' : '');
    e.preventDefault(); code.setRangeText('\n' + indent, s, code.selectionEnd, 'end');
    code.dispatchEvent(new Event('input'));
  }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveDrafts(); renderList(); run(); }
});

$('#restore').addEventListener('click', () => {
  files[current] = ORIGINAL[current]; saveDrafts(); open(current); toast(`Đã khôi phục ${current} về bản gốc`);
});
$('#delFile').addEventListener('click', () => {
  const n = current; delete files[n]; saveDrafts(); open('content.js'); toast(`Đã xoá ${n}`);
});
$('#resetAll').addEventListener('click', () => {
  if (!confirmTwice('resetAll', 'Bấm lần nữa để xoá mọi chỗ đã sửa')) return;
  files = { ...ORIGINAL }; try { localStorage.removeItem(DRAFT_KEY); } catch {}
  open('content.js'); run(); toast('Đã khôi phục toàn bộ về bản gốc');
});
$('#addFile').addEventListener('click', addFile);
$('#newName').addEventListener('keydown', e => { if (e.key === 'Enter') addFile(); });
function addFile() {
  const n = $('#newName').value.trim();
  if (!/^[\w.-]+\.(js|json|html|css|txt|md)$/i.test(n)) return toast('Tên file cần có đuôi .js .json .html .css .txt hoặc .md, không dấu cách');
  if (n in files || n in BINARY) return toast('Đã có file tên này');
  files[n] = n.endsWith('.js') ? '// ' + n + '\n' : '';
  $('#newName').value = ''; saveDrafts(); open(n); code.focus();
  if (n.endsWith('.js')) log('info', `Nhớ khai báo ${n} trong manifest.json (ví dụ thêm vào "js" của content_scripts) thì Chrome mới chạy file này.`);
}
const armed = {};
function confirmTwice(key, msg) {
  if (armed[key] && Date.now() - armed[key] < 3000) { armed[key] = 0; return true; }
  armed[key] = Date.now(); toast(msg); return false;
}

async function aiPreview(m) {

  const LEN = { ngan: 'rất ngắn (khoảng 80 chữ)', vua: 'vừa phải (khoảng 150 đến 250 chữ)', chitiet: 'chi tiết (khoảng 400 đến 600 chữ)' }[m.length] || 'vừa phải (khoảng 150 đến 250 chữ)';
  const what = src.kind === 'youtube' ? 'video YouTube này' : src.sub === 'sel' ? 'đoạn văn bản này' : 'nội dung trang web này';
  const sumPrompt = `Tóm tắt ${what}, độ dài ${LEN}. Trình bày đúng mẫu sau:\n**Tóm lại:** 1 đến 2 câu nêu điều quan trọng nhất.\n**Ý chính:**\n- ý thứ nhất\n- ý thứ hai\n(3 đến 7 ý, mỗi ý một dòng bắt đầu bằng "- ")\n`
    + (src.kind === 'youtube' ? `**Mốc thời gian:**\n- [mm:ss] nội dung đoạn đó\n(4 đến 8 mốc quan trọng nhất, dùng đúng thời gian trong lời thoại)\n` : '')
    + 'Giữ nguyên số liệu quan trọng. Không chào hỏi, không nhận xét ngoài lề.';
  const sys = 'Bạn là HaoHao, trợ lý "đọc hộ": nói rõ ràng, đi thẳng vào ý. Luôn trả lời bằng tiếng Việt. Chỉ dựa vào nội dung được cung cấp, không bịa thêm.\n\n';
  const turns = [{ role: 'user', content: sys + content + '\n\n' + sumPrompt }];
  if (m.mode === 'ask') {
    turns.push({ role: 'assistant', content: m.summary || '' });
    for (const x of (m.qa || [])) if (x.a) turns.push({ role: 'user', content: x.q }, { role: 'assistant', content: x.a });

}
function pomoSet(p) {
  const old = store.data.pomo; store.data.pomo = p;
  window.__ht.emit({ pomo: { oldValue: old, newValue: p } });
}
function pomoShim(m) {
  const old = store.data.pomo || {}, cfg = { focus: 25, brk: 5, lng: 15, ...((store.data.settings || {}).pomo || {}) };
  if (m.type === 'pomo-start' || m.type === 'pomo-skip') pomoSet({ phase: 'focus', endAt: Date.now() + cfg.focus * 60000, paused: false, round: old.round || 0, task: m.task !== undefined ? m.task : (old.task || ''), focusMin: cfg.focus });
  if (m.type === 'pomo-pause') pomoSet({ ...old, paused: true, remain: Math.max(0, old.endAt - Date.now()) });
  if (m.type === 'pomo-resume') pomoSet({ ...old, paused: false, endAt: Date.now() + (old.remain || 0) });
  if (m.type === 'pomo-stop') pomoSet({ phase: 'idle', round: old.round || 0, task: old.task || '' });
  log('info', 'Pomodoro: ' + m.type.replace('pomo-', '') + (m.task ? ' – ' + m.task : ''));
}
function pomoEndSim() {
  const p = store.data.pomo || {}, cfg = { focus: 25, brk: 5, lng: 15, ...((store.data.settings || {}).pomo || {}) };
  if (p.phase === 'focus') {
    const round = (p.round || 0) + 1, d = new Date(), k = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    const oldS = store.data.pomoStats || {}; store.data.pomoStats = { ...oldS, [k]: (oldS[k] || 0) + 1 };
    window.__ht.emit({ pomoStats: { oldValue: oldS, newValue: store.data.pomoStats } });
    pomoSet({ ...p, phase: 'break', endAt: Date.now() + cfg.brk * 60000, round });
    pushDesk({ title: 'Pomodoro', text: `🍅 Hoàn thành ${p.focusMin || cfg.focus} phút Pomodoro${p.task ? `: ${p.task}` : ''}! Đang cho bạn nghỉ ${cfg.brk} phút.`, kind: 'pomo', end: true, task: p.task || '' });
  } else if (p.phase === 'break' || p.phase === 'long') {
    pomoSet({ ...p, phase: 'idle' });
    pushDesk({ title: 'Tập trung', text: `☕ Hết giờ nghỉ! Sẵn sàng vào phiên ${(p.round || 0) + 1} chưa?`, kind: 'pomo', next: true });
  } else log('warn', 'Chưa có phiên nào đang chạy. Bấm ▶ Bắt đầu trong Todolist trước.');
}

$('#simPomo').addEventListener('click', pomoEndSim);
$('#simMail').addEventListener('click', () => pushDesk({ title: 'Email mới', text: '📧 Nguyễn Văn A: Hỏi báo giá xây nhà 3 tầng', kind: 'mail', url: 'https://mail.google.com/mail/u/0/#inbox' }));
$('#simBell').addEventListener('click', () => pushDesk({ title: 'Uống thuốc', text: '💊 Đến giờ uống thuốc rồi', kind: 'reminder', ruleId: 'r5' }));
$('#simRemind').addEventListener('click', () => pushDesk({ title: 'Todolist', text: '✅ Gọi lại cho khách hỏi báo giá nhà 3 tầng', kind: 'todo', ruleId: 't1' }));
$('#simPrice').addEventListener('click', () => sendAlert({ type: 'ht-alert', title: 'BTC vượt 120k', text: 'BITCOIN đang ở $120,450 (24h +3.2%). Điều kiện: bitcoin giá ≥ $120,000', mood: 'alert', kind: 'price' }));
$('#resetData').addEventListener('click', () => { store.data = structuredClone(SEED); run(); toast('Đã đặt lại điều kiện và cài đặt thử'); });

// ---------- nhật ký ----------
function log(lvl, text) {
  const c = $('#console'); const line = document.createElement('div');
  if (lvl) line.className = lvl;
  line.textContent = (lvl === 'error' ? '✕ ' : lvl === 'warn' ? '! ' : '› ') + text;
  c.append(line); c.scrollTop = c.scrollHeight;
}
let toastTimer;
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 3200); }

// ---------- tải zip ----------
let downloads = null;
const zipBtn = $('#zip');
zipBtn.disabled = true; zipBtn.title = 'Đang chuẩn bị…';
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('downloads').then(d => { downloads = d; zipReady(); }).catch(() => zipReady());
} else zipReady();
function zipReady() {
  zipBtn.disabled = !downloads || !window.JSZip;
  zipBtn.title = zipBtn.disabled ? 'Chức năng tải file không có ở chế độ xem này' : '';
}
zipBtn.addEventListener('click', async () => {
  checkJSON();
  try {
    const z = new JSZip(); const dir = z.folder('tien-ich-chrome');
    for (const n in files) dir.file(n, files[n]);
    for (const n in BINARY) dir.file(n, BINARY[n], { base64: true });
    const blob = await z.generateAsync({ type: 'blob' });
    await downloads.save({ filename: 'tien-ich-chrome.zip', data: blob });
    toast('Đã tải tien-ich-chrome.zip. Giải nén rồi nạp vào chrome://extensions');
  } catch (e) {
    if (e && e.code === 'declined') return;
    if (e && e.code === 'rate_limited') return toast('Đang có một hộp thoại tải file mở, xử lý nó trước nhé');
    toast('Không tải được file: ' + (e && e.message || e));
  }
});

// ---------- khởi động ----------
loadDrafts(); open(current); run();
</script>
