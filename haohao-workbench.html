<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xưởng code HaoHao</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --bg: #EAF1FF; --panel: #FFFDF6; --ink: #23305E; --soft: #5B648A; --line: #C9CEDF;
  --honey: #F2B544; --honey-deep: #D98E1F; --coral: #E85D5D; --mint: #2F9E7E;
  --code-bg: #1C2547; --code-fg: #E6EAF8; --gutter: #6E78A3; --code-line: #2A3663;
  --ui: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #10172F; --panel: #172042; --ink: #E6EAF8; --soft: #A3ABCB; --line: #34406B; --code-bg: #0D1330; --code-line: #1E2850; }
}
:root[data-theme="dark"] { --bg: #10172F; --panel: #172042; --ink: #E6EAF8; --soft: #A3ABCB; --line: #34406B; --code-bg: #0D1330; --code-line: #1E2850; }
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--ui); display: flex; flex-direction: column; overflow: hidden; }

header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--honey); color: #23305E; flex-wrap: wrap; }
header img { width: 38px; height: 38px; transform: rotate(-6deg); }
header h1 { font-size: 18px; font-weight: 800; margin: 0; }
header p { margin: 0; font-size: 13px; flex: 1; min-width: 180px; }
.btn { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 10px; font: 600 13.5px/1.2 var(--ui); background: #23305E; color: #fff; white-space: nowrap; }
.btn.ghost { background: transparent; color: inherit; box-shadow: inset 0 0 0 2px currentColor; }
.btn.sm { padding: 5px 9px; font-size: 12.5px; }
.btn:focus-visible { outline: 3px solid var(--honey-deep); outline-offset: 2px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn[hidden] { display: none; }
#run { background: var(--honey); color: #23305E; }

.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 210px minmax(0, 1.15fr) minmax(0, 1fr); }

/* danh sách file */
.files { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.files h2, .pv-head h2 { font-size: 13px; font-weight: 800; margin: 0; padding: 12px 14px 6px; }
#fileList { list-style: none; margin: 0; padding: 0 8px; overflow-y: auto; flex: 1; }
#fileList button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border-radius: 8px; font: 13px/1.3 var(--mono); }
#fileList button:hover { background: color-mix(in srgb, var(--honey) 22%, transparent); }
#fileList button.on { background: var(--honey); color: #23305E; font-weight: 600; }
#fileList button:focus-visible { outline: 2px solid var(--honey-deep); }
#fileList .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); margin-left: auto; flex: none; }
#fileList .kind { font-size: 10.5px; padding: 1px 5px; border-radius: 4px; background: var(--line); color: var(--ink); font-family: var(--ui); font-weight: 600; flex: none; }
.newfile { padding: 10px; border-top: 1px dashed var(--line); display: flex; gap: 6px; }
.newfile input { flex: 1; min-width: 0; font: 12.5px var(--mono); padding: 6px 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
.newfile input:focus { outline: none; border-color: var(--honey-deep); }
.newfile .btn { background: var(--ink); color: var(--panel); }

/* trình soạn */
.editor { display: flex; flex-direction: column; min-height: 0; background: var(--code-bg); color: var(--code-fg); }
.ed-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--code-line); flex-wrap: wrap; }
.ed-bar .name { font: 600 13px var(--mono); }
.ed-bar .hint { font-size: 12px; color: var(--gutter); margin-right: auto; }
.ed-bar .btn.ghost { color: var(--code-fg); }
.ed-body { flex: 1; min-height: 0; display: flex; position: relative; }
#gutter { padding: 12px 8px 12px 12px; text-align: right; color: var(--gutter); font: 13px/1.6 var(--mono); user-select: none; overflow: hidden; white-space: pre; min-width: 46px; }
#code { flex: 1; resize: none; border: 0; outline: none; background: transparent; color: var(--code-fg); font: 13px/1.6 var(--mono); padding: 12px 14px 40px 6px; tab-size: 2; white-space: pre; overflow: auto; caret-color: var(--honey); }
#code::selection { background: #3D4F8F; }
.imgview { flex: 1; display: grid; place-items: center; gap: 10px; color: var(--gutter); text-align: center; padding: 20px; }
.imgview img { image-rendering: auto; max-width: 128px; background: repeating-conic-gradient(#2A3663 0 25%, transparent 0 50%) 0 0 / 16px 16px; border-radius: 8px; }
.status { display: flex; gap: 14px; padding: 5px 12px; font: 12px var(--mono); color: var(--gutter); border-top: 1px solid var(--code-line); }

/* xem thử */
.preview { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
.pv-head { display: flex; align-items: center; gap: 6px; padding: 6px 10px 6px 0; flex-wrap: wrap; }
.pv-head h2 { padding-right: 4px; }
.tabs { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; }
.tabs button { all: unset; cursor: pointer; padding: 5px 10px; border-radius: 8px; font-weight: 600; font-size: 12.5px; }
.tabs button.on { background: var(--ink); color: var(--panel); }
.tabs button:focus-visible { outline: 2px solid var(--honey-deep); }
.frames { flex: 1; min-height: 0; position: relative; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #fff; }
.frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
#deskWrap { position: absolute; inset: 0; background: linear-gradient(135deg, #2B5876, #4E4376); overflow: hidden; }
.desk-bg span { position: absolute; left: 14px; top: 10px; color: rgba(255,255,255,.7); font-size: 12px; font-weight: 600; }
#fDesk { position: absolute; inset: auto 18px 18px auto !important; width: 374px !important; height: 320px !important; border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
.sim { display: flex; gap: 6px; padding: 8px 10px; flex-wrap: wrap; align-items: center; }
.sim span { font-size: 12.5px; color: var(--soft); margin-right: 2px; }
.sim .btn { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
#console { height: 130px; overflow: auto; margin: 0; padding: 8px 12px; font: 12px/1.5 var(--mono); background: var(--code-bg); color: var(--code-fg); border-top: 1px solid var(--line); }
#console .warn { color: #F7C66B; } #console .error { color: #FF8C8C; } #console .info { color: #8FD9C0; }
#console:empty::before { content: "Nhật ký chạy thử hiện ở đây: lỗi code, console.log, tin nhắn gửi cho background."; color: var(--gutter); }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: 12px; font-weight: 600; font-size: 13.5px; z-index: 10; max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }

@media (max-width: 1100px) {
  .layout { grid-template-columns: 180px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
  .files { grid-row: 1 / 3; }
  .preview { border-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 700px) {
  body { overflow: auto; }
  .layout { display: flex; flex-direction: column; }
  .files { max-height: none; border-right: 0; }
  #fileList { display: flex; overflow-x: auto; gap: 4px; padding-bottom: 8px; }
  #fileList button { width: auto; white-space: nowrap; }
  .editor { height: 60vh; }
  .preview { height: 80vh; }
  header p { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

  <h1>Xưởng code HaoHao</h1>
  <p>Sửa code, bấm Chạy thử để xem ngay, xong thì tải file zip về cài vào Chrome.</p>
  <button class="btn ghost" id="resetAll">Khôi phục tất cả</button>
  <button class="btn" id="zip">Tải file zip</button>
</header>

<div class="layout">
  <nav class="files" aria-label="Các file của tiện ích">
    <h2>File</h2>
    <ul id="fileList"></ul>
    <div class="newfile">
      <input id="newName" placeholder="ten-file.js" aria-label="Tên file mới">
      <button class="btn sm" id="addFile">Thêm</button>
    </div>
  </nav>

  <section class="editor" aria-label="Trình soạn code">
    <div class="ed-bar">
      <span class="name" id="curName"></span>
      <span class="hint">Ctrl+S để lưu và chạy thử</span>
      <button class="btn sm ghost" id="restore">Khôi phục bản gốc</button>
      <button class="btn sm ghost" id="delFile" hidden>Xoá file</button>
      <button class="btn sm" id="run">Chạy thử</button>
    </div>
    <div class="ed-body" id="edBody">
      <div id="gutter" aria-hidden="true"></div>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Nội dung file"></textarea>
    </div>
    <div class="status"><span id="pos">Dòng 1, cột 1</span><span id="size"></span><span id="saved"></span></div>
  </section>

  <section class="preview" aria-label="Xem thử">
    <div class="pv-head">
      <h2>Xem thử</h2>
      <div class="tabs" role="tablist">
        <button role="tab" data-pv="demo" class="on">Trang web mẫu</button>
        <button role="tab" data-pv="yt">YouTube mẫu</button>
        <button role="tab" data-pv="options">Trang cài đặt</button>
        <button role="tab" data-pv="desk">Ra màn hình</button>
      </div>
    </div>
    <div class="frames">
      <iframe id="fDemo" title="Trang web mẫu có HaoHao"></iframe>
      <iframe id="fOptions" title="Trang cài đặt HaoHao" hidden></iframe>
      <iframe id="fYt" title="Trang YouTube mẫu có HaoHao" hidden></iframe>
      <div id="deskWrap" hidden><div class="desk-bg"><span>Màn hình Windows (giả lập)</span></div><iframe id="fDesk" title="Cửa sổ HaoHao trên màn hình"></iframe></div>
    </div>
    <div class="sim">
      <span>Giả lập:</span>
      <button class="btn sm" id="simBell">Chuông nhắc</button>
      <button class="btn sm" id="simMail">Email mới</button>
      <button class="btn sm" id="simPomo">Hết phiên 🍅</button>
      <button class="btn sm" id="simRemind">Việc đến hạn</button>
      <button class="btn sm" id="simPrice">Giá chạm mốc</button>
      <button class="btn sm" id="resetData">Đặt lại dữ liệu thử</button>
    </div>
    <pre id="console" aria-live="polite"></pre>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const ORIGINAL = {"alert.js": "const $ = s => document.querySelector(s);\nlet items = [], knocks = 0, ac = null, soundOn = true, closing = false;\nconst MAX_KNOCKS = 6, KNOCK_EVERY = 45000;\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\n\nasync function load() {\n  const [{ deskQueue = [] }, { settings = {} }] = await Promise.all([\n    chrome.storage.session.get('deskQueue'), chrome.storage.local.get('settings')\n  ]);\n  soundOn = settings.sound !== false;\n  const grew = deskQueue.length > items.length;\n  items = deskQueue;\n  if (!items.length) { closing = true; window.close(); return; }\n  render();\n  if (grew) knock();\n}\n\nfunction render() {\n  $('#head').textContent = items.length > 1 ? `Cốc cốc! Có ${items.length} lời nhắc` : items[0].kind === 'mail' ? 'Cốc cốc! Có thư mới' : 'Cốc cốc! Tới giờ rồi';\n  $('#sub').textContent = items.length > 1 ? 'Làm xong việc nào thì bấm việc đó nhé' : 'HaoHao nhắc bạn nè';\n  document.title = `HaoHao: ${items[0].title}`;\n  const L = $('#list'); L.innerHTML = '';\n  for (const it of items) {\n    const c = document.createElement('div'); c.className = 'card'; c.setAttribute('role', 'listitem');\n    const t = document.createElement('div'); t.className = 't';\n    const a = document.createElement('span'); a.textContent = it.title;\n    const b = document.createElement('span'); b.textContent = new Date(it.t).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });\n    t.append(a, b);\n    const x = document.createElement('div'); x.className = 'x'; x.textContent = it.text;\n    const acts = document.createElement('div'); acts.className = 'acts';\n    if (it.kind === 'pomo') acts.append(...(it.next\n      ? [btn('▶ Vào phiên tiếp', 'main', () => act(it, 'pomo-next')), btn('Để sau', '', () => act(it, 'done'))]\n      : it.end ? [btn('✅ Hoàn thành việc', 'main', () => act(it, 'pomo-done')), btn('▶ Làm tiếp', '', () => act(it, 'pomo-next')), btn('☕ Nghỉ', '', () => act(it, 'done'))]\n      : [btn('Ok ✓', 'main', () => act(it, 'done'))]));\n    else if (it.kind === 'mail') acts.append(\n      btn('Mở mail', 'main', () => act(it, 'open')),\n      btn('Đã xem ✓', '', () => act(it, 'done'))\n    );\n    else acts.append(\n      btn('Xong rồi ✓', 'main', () => act(it, 'done')),\n      btn('10 phút nữa', '', () => act(it, 'snooze', 10)),\n      btn('30 phút nữa', '', () => act(it, 'snooze', 30))\n    );\n    c.append(t, x, acts); L.append(c);\n  }\n  L.querySelector('button.main')?.focus();\n}\nfunction btn(text, cls, fn) { const b = document.createElement('button'); b.textContent = text; b.className = cls; b.addEventListener('click', fn); return b; }\nfunction act(it, action, minutes) {\n  unlockAudio();\n  chrome.runtime.sendMessage({ type: 'desk-act', id: it.id, action, minutes }).catch(() => {});\n}\n\nasync function knock() {\n  if (closing) return;\n  knocks++;\n  document.body.classList.remove('knock'); void document.body.offsetWidth; document.body.classList.add('knock');\n  playKnock();\n  try {\n    const w = await chrome.windows.getCurrent();\n    await chrome.windows.update(w.id, { focused: true, drawAttention: true });\n    const x = w.left;\n    if (typeof x === 'number') {\n      for (const dx of [16, -16, 12, -12, 8, -8, 4, 0]) { await chrome.windows.update(w.id, { left: x + dx }); await sleep(40); }\n    }\n  } catch {}\n}\n\nfunction unlockAudio() { try { ac = ac || new AudioContext(); if (ac.state === 'suspended') ac.resume(); } catch {} }\nfunction playKnock() {\n  if (!soundOn) return;\n  try {\n    unlockAudio();\n    const t = ac.currentTime + 0.05;\n    // hai tiếng gõ \"cốc cốc\"\n    [0, 0.24].forEach(d => {\n      const len = 0.14, buf = ac.createBuffer(1, Math.floor(ac.sampleRate * len), ac.sampleRate), data = buf.getChannelData(0);\n      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 5);\n      const src = ac.createBufferSource(); src.buffer = buf;\n      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = 1.2;\n      const g = ac.createGain(); g.gain.value = 2.2;\n      src.connect(f).connect(g).connect(ac.destination); src.start(t + d);\n      const o = ac.createOscillator(), og = ac.createGain(); o.frequency.setValueAtTime(190, t + d); o.frequency.exponentialRampToValueAtTime(90, t + d + .12);\n      og.gain.setValueAtTime(0.5, t + d); og.gain.exponentialRampToValueAtTime(0.001, t + d + .14);\n      o.connect(og).connect(ac.destination); o.start(t + d); o.stop(t + d + .15);\n    });\n    // chuông nhẹ sau khi gõ\n    [880, 1175, 1320].forEach((fq, i) => {\n      const s0 = t + 0.7 + i * 0.15, o = ac.createOscillator(), g = ac.createGain();\n      o.type = 'sine'; o.frequency.value = fq;\n      g.gain.setValueAtTime(0.0001, s0); g.gain.exponentialRampToValueAtTime(0.18, s0 + .02); g.gain.exponentialRampToValueAtTime(0.0001, s0 + .7);\n      o.connect(g).connect(ac.destination); o.start(s0); o.stop(s0 + .75);\n    });\n  } catch {}\n}\n\ndocument.addEventListener('pointerdown', unlockAudio, { once: true });\nchrome.storage.onChanged.addListener((ch, area) => { if (area === 'session' && ch.deskQueue) load(); });\nsetInterval(() => { if (items.length && knocks < MAX_KNOCKS) knock(); }, KNOCK_EVERY);\nload();\n", "voice.html": "<!doctype html>\n<html lang=\"vi\">\n<head>\n<meta charset=\"utf-8\">\n<title>HaoHao đang nghe…<\/title>\n<style>\n  :root { --ink: #23305E; --honey: #F2B544; --coral: #E85D5D; --mint: #2F9E7E; --cream: #FFFDF6; --soft: #6B7394; }\n  * { box-sizing: border-box; }\n  html, body { height: 100%; margin: 0; }\n  body { background: var(--cream); color: var(--ink); font: 14px/1.45 \"Segoe UI\", system-ui, sans-serif; display: flex; flex-direction: column; padding: 14px 16px; gap: 10px; }\n  .top { display: flex; align-items: center; gap: 14px; }\n  #mic { all: unset; cursor: pointer; width: 64px; height: 64px; border-radius: 50%; background: var(--coral); display: grid; place-items: center lder=\"Ví dụ: Kèo meme Solana\"><\/label>\n\n      <div class=\"grp\" data-for=\"price\">\n        <div class=\"row\">\n          <label class=\"f\">Nguồn giá\n            <select name=\"source\">\n              <option value=\"coingecko\">CoinGecko (coin lớn, nhập mã như bitcoin, solana)<\/option>\n              <option value=\"dexscreener\">DexScreener (meme coin, dán địa chỉ token)<\/option>\n            <\/select><\/label>\n          <label class=\"f\">Mã coin hoặc địa chỉ token<input name=\"coin\" placeholder=\"bitcoin\"><\/label>\n        <\/div>\n        <div class=\"row\">\n          <label class=\"f\">Báo khi\n            <select name=\"op\">\n              <option value=\"above\">Giá lớn hơn hoặc bằng ($)<\/option>\n              <option value=\"below\">Giá nhỏ hơn hoặc bằng ($)<\/option>\n              <option value=\"up\">Tăng ít nhất (% trong 24h)<\/option>\n              <option value=\"down\">Giảm ít nhất (% trong 24h)<\/option>\n            <\/select><\/label>\n          <label class=\"f\">Mốc<input name=\"value\" type=\"number\" step=\"any\" placeholder=\"120000\"><\/label>\n        <\/div>\n        <div class=\"test\"><button type=\"button\" id=\"test\" class=\"btn ghost\">Xem giá hiện tại<\/button><span id=\"testOut\"><\/span><\/div>\n        <p class=\"hint\">Giá được kiểm tra mỗi phút. Mỗi lần điều kiện chuyển từ sai sang đúng, bạn được báo một lần.<\/p>\n      <\/div>\n\n      <div class=\"grp\" data-for=\"reminder\" hidden>\n        <div class=\"row\">\n          <label class=\"f\">Biểu tượng\n            <select name=\"icon\"><option>🔔<\/option><option>💊<\/option><option>💧<\/option><option>🧒<\/option><option>🍚<\/option><option>🏃<\/option><option>📞<\/option><option>🛏️<\/option><option>🐶<\/option><option>🌱<\/option><\/select><\/label>\n          <label class=\"f\">Kiểu nhắc\n            <select name=\"kind\"><option value=\"daily\">Hằng ngày, vào các giờ cố định<\/option><option value=\"interval\">Lặp lại sau mỗi X phút<\/option><option value=\"once\">Một lần vào ngày giờ cụ thể<\/option><\/select><\/label>\n        <\/div>\n        <div class=\"row\">\n          <label class=\"f\" data-kind=\"daily\">Các giờ nhắc, cách nhau dấu phẩy<input name=\"times\" placeholder=\"08:00, 20:00\"><\/label>\n          <label class=\"f\" data-kind=\"interval\" hidden>Số phút<input name=\"minutes\" type=\"number\" min=\"5\" value=\"60\"><\/label>\n          <label class=\"f\" data-kind=\"interval\" hidden>Từ giờ<input name=\"from\" type=\"time\" value=\"08:00\"><\/label>\n          <label class=\"f\" data-kind=\"interval\" hidden>Đến giờ<input name=\"to\" type=\"time\" value=\"21:00\"><\/label>\n          <label class=\"f\" data-kind=\"once\" hidden>Ngày giờ<input name=\"datetime\" type=\"datetime-local\"><\/label>\n        <\/div>\n        <div class=\"days\" data-kind=\"daily\">\n          <span>Ngày trong tuần (không chọn là mọi ngày):<\/span>\n          <label><input type=\"checkbox\" name=\"day\" value=\"1\">T2<\/label><label><input type=\"checkbox\" name=\"day\" value=\"2\">T3<\/label>\n          <label><input type=\"checkbox\" name=\"day\" value=\"3\">T4<\/label><label><input type=\"checkbox\" name=\"day\" value=\"4\">T5<\/label>\n          <label><input type=\"checkbox\" name=\"day\" value=\"5\">T6<\/label><label><input type=\"checkbox\" name=\"day\" value=\"6\">T7<\/label>\n          <label><input type=\"checkbox\" name=\"day\" value=\"0\">CN<\/label>\n        <\/div>\n        <label class=\"f\">Lời nhắc<input name=\"message\" placeholder=\"Tới giờ đi đón con rồi!\"><\/label>\n      <\/div>\n\n      <div class=\"actions\">\n        <button type=\"submit\" class=\"btn\">Lưu điều kiện<\/button>\n        <button type=\"button\" id=\"cancel\" class=\"btn ghost\">Huỷ<\/button>\n      <\/div>\n    <\/form>\n\n    <div id=\"list\"><\/div>\n  <\/section>\n\n  <section id=\"tab-log\" hidden>\n    <header class=\"top\">\n      <div><h2>Nhật ký<\/h2><p class=\"sub\">Những lần HaoHao đã báo cho bạn.<\/p><\/div>\n      <button id=\"clearLog\" class=\"btn ghost\">Xoá nhật ký<\/button>\n    <\/header>\n    <ol id=\"log\"><\/ol>\n  <\/section>\n\n  <section id=\"tab-settings\" hidden>\n    <header class=\"top\"><div><h2>Cài đặt chung<\/h2><\/div><\/header>\n    <label class=\"chk big\"><input type=\"checkbox\" id=\"mascotEnabled\"> Hiện HaoHao trên các trang web<\/label>\n    <label class=\"chk big\"><input type=\"checkbox\" id=\"greet\"> HaoHao chào và báo việc đang chờ khi mở trang<\/label>\n    <label class=\"chk big\"><input type=\"checkbox\" id=\"desktop\"> Khi nhắc nhở, HaoHao ra hẳn màn hình và gõ cửa (đè lên cả ứng dụng khác)<\/label>\n    <label class=\"chk big\"><input type=\"checkbox\" id=\"sound\"> Có tiếng gõ và tiếng chuông<\/label>\n    <div class=\"test\"><button id=\"deskTest\" class=\"btn ghost\">Thử HaoHao ra màn hình<\/button><span id=\"appStatus\"><\/span><\/div>\n    <div id=\"ai\" class=\"setup\">\n      <h3>📖 Đọc hộ (Gemini)<\/h3>\n      <p class=\"sub\">Lấy mã miễn phí tại <a href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noopener\">Google AI Studio<\/a> → <b>Create API key<\/b>. Mã chỉ lưu trong Chrome của bạn.<\/p>\n      <div class=\"test\">\n        <label class=\"f\" style=\"margin:0;max-width:360px\">Mã Gemini<input id=\"aiKey\" type=\"password\" placeholder=\"AIza…\" autocomplete=\"off\"><\/label>\n        <label class=\"f\" style=\"margin:0;max-width:220px\">Mô hình<input id=\"aiModel\" placeholder=\"gemini-2.5-flash\"><\/label>\n        <button type=\"button\" id=\"aiSave\" class=\"btn\">Lưu<\/button>\n        <button type=\"button\" id=\"aiTest\" class=\"btn ghost\">Thử kết nối<\/button>\n      <\/div>\n      <p id=\"aiState\" class=\"sub\"><\/p>\n    <\/div>\n\n    <div id=\"outlook\" class=\"setup\">\n      <h3>📧 Đăng nhập Outlook / Hotmail (thiết lập 1 lần)<\/h3>\n      <p class=\"sub\">Microsoft bắt mỗi phần mềm tự đăng ký một \"mã ứng dụng\" miễn phí. Làm 1 lần là xong, dùng được cho cả Outlook cá nhân (hotmail, outlook.com) và Outlook công ty.<\/p>\n      <ol>\n        <li>Mở <a href=\"https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade\" target=\"_blank\" rel=\"noopener\">trang App registrations của Microsoft<\/a>, đăng nhập bằng tài khoản Outlook, bấm <b>New registration<\/b>.<\/li>\n        <li>Name: <b>HaoHao<\/b>. Supported account types: chọn dòng <b>Accounts in any organizational directory … and personal Microsoft accounts<\/b>.<\/li>\n        <li>Redirect URI: chọn <b>Web<\/b>, dán địa chỉ này vào:\n          <div class=\"copy\"><code id=\"msRedirect\">…<\/code><button type=\"button\" id=\"copyRedirect\" class=\"btn ghost sm\">Sao chép<\/button><\/div>\n          rồi bấm <b>Register<\/b>.<\/li>\n        <li>Vào mục <b>Authentication<\/b>, tick ô <b>Access tokens (used for implicit flows)<\/b>, bấm <b>Save<\/b>.<\/li>\n        <li>Quay lại <b>Overview<\/b>, sao chép <b>Application (client) ID<\/b>, dán vào ô dưới rồi bấm Lưu.<\/li>\n      <\/ol>\n      <div class=\"test\">\n        <label class=\"f\" style=\"margin:0;max-width:420px\">Application (client) ID<input id=\"msClientId\" placeholder=\"xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\"><\/label>\n        <button type=\"button\" id=\"saveClient\" class=\"btn\">Lưu<\/button>\n        <button type=\"button\" id=\"msLogin\" class=\"btn ghost\">Đăng nhập Outlook<\/button>\n      <\/div>\n      <p id=\"msState\" class=\"sub\"><\/p>\n    <\/div>\n\n    <h3>Trang đang ẩn HaoHao<\/h3>\n    <ul id=\"hidden\"><\/ul>\n    <h3>Sao lưu<\/h3>\n    <div class=\"test\">\n      <button id=\"export\" class=\"btn ghost\">Tải file sao lưu<\/button>\n      <label class=\"btn ghost file\">Nạp file sao lưu<input type=\"file\" id=\"import\" accept=\".json\" hidden><\/label>\n      <button id=\"resetPos\" class=\"btn ghost\">Đưa HaoHao về góc phải<\/button>\n    <\/div>\n  <\/section>\n<\/main>\n<script src=\"common.js\"><\/script>\n<script src=\"options.js\"><\/script>\n<\/body>\n<\/html>\n", "content.js": "(() => {\n  if (window imeout(focusNudge, 2000);\n    setTimeout(trackPrice, 3000);\n  });\n  // có việc sắp tới giờ trong lúc đang mở trang thì cũng nhắc nhẹ\n  setInterval(() => { if (document.visibilityState === 'visible') greet(); }, 5 * 60e3);\n})();\n", "alert.html": "<!doctype html>\n<html lang=\"vi\">\n<head>\n<meta charset=\"utf-8\">\n<title>HaoHao nhắc bạn<\/title>\n<style>\n  :root { --ink: #23305E; --honey: #F2B544; --honey-deep: #D98E1F; --cream: #FFFDF6; --coral: #E85D5D; --soft: #6B7394; }\n  * { box-sizing: border-box; }\n  html, body { height: 100%; margin: 0; }\n  body { background: var(--cream); color: var(--ink); font: 14px/1.45 \"Segoe UI\", system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; }\n  .top { display: flex; align-items: center; gap: 12px; padding: 12px 16px 10px; background: var(--honey); position: relative; }\n  .stage { position: relative; width: 92px; height: 88px; flex: none; }\n  .stage svg { width: 88px; height: 88px; overflow: visible; transform-origin: 50% 90%; }\n  .paw { position: absolute; right: -4px; top: 34px; width: 20px; height: 20px; border-radius: 50%; background: #D98E1F; border: 2px solid #B8741A; opacity: 0; }\n  .ripple { position: absolute; right: -14px; top: 24px; width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--ink); opacity: 0; }\n  .say { position: absolute; right: -30px; top: -6px; background: #fff; color: var(--coral); border: 2px solid var(--ink); border-radius: 10px; padding: 1px 7px; font-weight: 800; font-size: 13px; white-space: nowrap; opacity: 0; transform: scale(.6) rotate(8deg); }\n  h1 { margin: 0; font-size: 19px; font-weight: 800; line-height: 1.2; }\n  .top p { margin: 3px 0 0; font-size: 13px; }\n\n  body.knock .stage svg { animation: lean 1.1s ease-in-out; }\n  body.knock .paw { animation: tap 1.1s ease-in-out; }\n  body.knock .r1 { animation: ring 1.1s ease-out; }\n  body.knock .r2 { animation: ring 1.1s ease-out .28s; }\n  body.knock .say { animation: pop 1.6s ease-out forwards; }\n  body.knock #list { animation: jolt 1.1s ease-in-out; }\n  @keyframes lean { 0%,100% { transform: none; } 15%,45% { transform: rotate(8deg) translateX(4px); } 30%,60% { transform: rotate(3deg); } }\n  @keyframes tap { 0%,100% { opacity: 0; transform: scale(.6); } 12%,42% { opacity: 1; transform: scale(1.35); } 25%,55% { opacity: 1; transform: scale(.9); } 70% { opacity: 0; } }\n  @keyframes ring { 0% { opacity: 0; transform: scale(.3); } 15% { opacity: .9; } 100% { opacity: 0; transform: scale(2.2); } }\n  @keyframes pop { 0% { opacity: 0; transform: scale(.6) rotate(8deg); } 15% { opacity: 1; transform: scale(1.1) rotate(-4deg); } 30%,80% { opacity: 1; transform: scale(1) rotate(-4deg); } 100% { opacity: 0; } }\n  @keyframes jolt { 15%,45% { transform: translateY(2px); } 30%,60% { transform: translateY(-1px); } }\n\n  #list { flex: 1; overflow-y: auto; padding: 10px 14px 14px; }\n  .card { background: #fff; border: 2px solid var(--ink); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 4px 4px 0 var(--coral); }\n  .card .t { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--soft); font-weight: 600; }\n  .card .x { font-size: 17px; font-weight: 700; margin: 3px 0 10px; word-break: break-word; }\n  .acts { display: flex; gap: 6px; flex-wrap: wrap; }\n  button { all: unset; cursor: pointer; padding: 7px 10px; border-radius: 10px; font-weight: 700; font-size: 13px; border: 2px solid var(--ink); }\n  button.main { background: var(--ink); color: #fff; }\n  button:hover { filter: brightness(1.08); } button:not(.main):hover { background: #FFF0C7; }\n  button:focus-visible { outline: 3px solid var(--honey-deep); outline-offset: 2px; }\n  @media (prefers-reduced-motion: reduce) { body.knock * { animation: none !important; } }\n<\/style>\n<\/head>\n<body>\n  <div class=\"top\">\n    <div class=\"stage\" aria-hidden=\"true\">\n      <svg viewBox=\"0 0 100 100\">\n        <circle cx=\"28\" cy=\ age.local.set({ rules });\nconst saveSettings = () => chrome.storage.local.set({ settings });\n\n// ---------- tabs ----------\ndocument.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {\n  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));\n  document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== 'tab-' + b.dataset.tab);\n}));\n\n// ---------- danh sách điều kiện ----------\nfunction renderRules(quotes) {\n  const L = $('#list'); L.innerHTML = '';\n  if (!rules.length) {\n    L.innerHTML = '<div class=\"empty\">Chưa có điều kiện nào. Bấm “Thêm điều kiện” để HaoHao bắt đầu làm việc.<\/div>';\n    return;\n  }\n  for (const type of ['price', 'reminder']) {\n    const list = rules.filter(r => r.type === type);\n    if (!list.length) continue;\n    const g = document.createElement('div'); g.className = 'group';\n    g.innerHTML = `<h3>${TYPE_NAMES[type]} <small>${list.length}<\/small><\/h3>`;\n    for (const r of list) {\n      const row = document.createElement('div'); row.className = 'rule' + (r.enabled ? '' : ' off');\n      const sw = document.createElement('label'); sw.className = 'sw';\n      sw.innerHTML = `<input type=\"checkbox\" aria-label=\"Bật hoặc tắt ${esc(r.name)}\" ${r.enabled ? 'checked' : ''}><span><\/span>`;\n      sw.querySelector('input').addEventListener('change', e => { r.enabled = e.target.checked; saveRules(); row.classList.toggle('off', !r.enabled); });\n      const info = document.createElement('div');\n      info.innerHTML = `<div class=\"n\">${type === 'reminder' ? esc(r.icon || '🔔') + ' ' : ''}${esc(r.name)}<\/div><div class=\"d\">${esc(HT.describe(r))}<\/div>`;\n      if (type === 'price') {\n        const k = r.source === 'dexscreener' ? 'dx:' + (r.coin || '').trim() : 'cg:' + (r.coin || '').trim().toLowerCase();\n        if (quotes[k]) info.insertAdjacentHTML('beforeend', `<div class=\"q\">Giá gần nhất: $${HT.fmt(quotes[k].price)} (24h ${quotes[k].change >= 0 ? '+' : ''}${quotes[k].change.toFixed(1)}%)<\/div>`);\n      }\n      if (type === 'reminder' && r.message) info.insertAdjacentHTML('beforeend', `<div class=\"d\">“${esc(r.message)}”<\/div>`);\n      const ops = document.createElement('div'); ops.className = 'ops';\n      const ed = btn('Sửa', 'btn ghost sm', () => r.kind === 'lunar' ? alert('Lịch nhắc âm lịch sửa trong HaoHao: bấm HaoHao trên trang web > nhánh Nhắc nhở > nút ✎.') : openEditor(r));\n      const del = btn('Xoá', 'btn ghost sm danger', () => {\n        if (!confirm(`Xoá điều kiện “${r.name}”?`)) return;\n        rules = rules.filter(x => x !== r); saveRules(); load();\n      });\n      ops.append(ed, del);\n      row.append(sw, info, ops); g.append(row);\n    }\n    L.append(g);\n  }\n}\nfunction btn(text, cls, fn) { const b = document.createElement('button'); b.className = cls; b.textContent = text; b.addEventListener('click', fn); return b; }\nfunction esc(s) { return String(s ?? '').replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c])); }\n\n// ---------- trình soạn điều kiện ----------\nfunction syncForm() {\n  const type = form.type.value;\n  form.querySelectorAll('.grp').forEach(g => g.hidden = g.dataset.for !== type);\n  const kind = form.kind.value;\n  form.querySelectorAll('[data-kind]').forEach(el => el.hidden = el.dataset.kind !== kind);\n  form.coin.placeholder = form.source.value === 'dexscreener' ? 'Dán địa chỉ token (contract)' : 'bitcoin';\n  form.value.placeholder = ['up', 'down'].includes(form.op.value) ? '20' : '120000';\n}\nform.addEventListener('change', syncForm);\n\nfunction openEditor(r) {\n  editing = r || null;\n  form.reset();\n  const v = r || { type: 'price', accentless: true, mode: 'any', source: 'coingecko', op: 'above', kind: 'daily', times: ['08:00'], minutes: 60, icon: '🔔' };\n  form.type.value = v.type;\n  form.name.value = v.name || '';\n  form.words.value = (v.words || []).join(', ');\n  form.sites.value = v.sites || '';\n  form.mode.value = v.mode || 'any';\n  form.accentless.checked = v.accentless !== false;\n  form.source.value = v.source || 'coingecko';\n  form.coin.value = v.coin || '';\n  form.op.value = v.op || 'above';\n  form.value.value = v.value ?? '';\n  form.kind.value = v.kind || 'daily';\n  form.times.value = HT.timesOf(v).join(', ') || '08:00';\n  form.icon.value = v.icon || '🔔';\n  form.from.value = v.from || '08:00'; form.to.value = v.to || '21:00';\n  form.querySelectorAll('[name=day]').forEach(c => c.checked = (v.days || []).includes(Number(c.value)));\n  form.minutes.value = v.minutes || 60;\n  form.datetime.value = v.datetime || '';\n  form.message.value = v.message || '';\n  $('#testOut').textContent = '';\n  form.hidden = false; syncForm(); form.name.focus();\n  form.scrollIntoView({ behavior: 'smooth', block: 'start' });\n}\n$('#add').addEventListener('click', () => openEditor(null));\n$('#cancel').addEventListener('click', () => { form.hidden = true; editing = null; });\n\nform.addEventListener('submit', e => {\n  e.preventDefault();\n  const type = form.type.value;\n  const r = { id: editing?.id || 'r' + Date.now().toString(36), type, name: form.name.value.trim(), enabled: editing ? editing.enabled : true };\n  if (type === 'keyword') {\n    r.words = form.words.value.split(/[,\\n]/).map(s => s.trim()).filter(Boolean);\n    if (!r.words.length) return alert('Nhập ít nhất một từ khoá.');\n    r.sites = form.sites.value.trim(); r.mode = form.mode.value; r.accentless = form.accentless.checked;\n  } else if (type === 'price') {\n    r.source = form.source.value; r.coin = form.coin.value.trim(); r.op = form.op.value; r.value = Number(form.value.value);\n    if (!r.coin || form.value.value === '') return alert('Nhập mã coin và mốc giá.');\n  } else {\n    r.kind = form.kind.value; r.icon = form.icon.value; r.minutes = Math.max(5, Number(form.minutes.value) || 60);\n    r.times = [...new Set((form.times.value.match(/\\d{1,2}:\\d{2}/g) || []). rue;\n  const who = normTxt(e.name + ' ' + e.email), body = normTxt(e.title + ' ' + e.summary);\n  return senders.some(x => who.includes(x)) || words.some(x => body.includes(x));\n}\nasync function fetchGmail(m) {\n  const url = `https://mail.google.com/mail/u/${Number(m.account) || 0}/feed/atom${m.primary !== false ? '/%5Esmartlabel_personal' : ''}`;\n  const r = await fetch(url, { credentials: 'include', cache: 'no-store' });\n  const txt = await r.text();\n  if (!r.ok || !txt.includes('<feed')) throw new Error(r.status === 401 || r.status === 403 || /accounts\\.google\\.com/.test(r.url) ? 'login' : 'bad');\n  return parseFeed(txt);\n}\n\n// ---------- Outlook / Hotmail / Office 365 (đăng nhập Microsoft, đọc qua Microsoft Graph) ----------\nconst MS_SCOPE = 'openid profile https://graph.microsoft.com/Mail.Read https://graph.microsoft.com/User.Read';\nconst msRedirect = () => chrome.identity.getRedirectURL('ms');\nasync function msAuth(interactive) {\n  const { settings = {} } = await chrome.storage.local.get('settings');\n  const cid = ((settings.mail || {}).msClientId || '').trim();\n  if (!cid) throw new Error('noclient');\n  const state = Math.random().toString(36).slice(2);\n  const url = 'https://login.microsoftonline.com/common/oauth2/v2.0/authorize?' + new URLSearchParams({\n    client_id: cid, response_type: 'token', redirect_uri: msRedirect(), scope: MS_SCOPE,\n    response_mode: 'fragment', state, prompt: interactive ? 'select_account' : 'none'\n  });\n  const back = await chrome.identity.launchWebAuthFlow({ url, interactive });\n  const p = new URLSearchParams((new URL(back).hash || '').slice(1));\n  if (p.get('error') || !p.get('access_token')) throw new Error(interactive ? (p.get('error_description') || p.get('error') || 'login') : 'login');\n  if (p.get('state') !== state) throw new Error('login');\n  const token = p.get('access_token'), exp = Date.now() + (Number(p.get('expires_in')) || 3600) * 1000 - 60000;\n  await chrome.storage.session.set({ msT ettings = {} } = await chrome.storage.local.get('settings');\n  const ai = settings.ai || {};\n  const key = (ai.key || '').trim();\n  if (!key) throw new Error('nokey');\n  const model = (ai.model || 'gemini-2.5-flash').trim();\n  const gen = { temperature: opts.temperature ?? 0.4, maxOutputTokens: opts.maxTokens || 4096 };\n  if (/flash/i.test(model) && /2\\.5/.test(model)) gen.thinkingConfig = { thinkingBudget: 0 };   // nhanh hơn, đỡ tốn lượt\n  if (opts.video) gen.mediaResolution = 'MEDIA_RESOLUTION_LOW';                                  // video đỡ tốn lượt\n  if (opts.json) gen.responseMimeType = 'application/json';\n  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {\n    method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },\n    body: JSON.stringify({ contents, systemInstruction: { parts: [{ text: system }] }, generationConfig: gen })\n  });\n  const j = await r.json().catch(() => ({}));\n  if (!r.ok) {\n    const msg = (j.error && j.error.message) || ('HTTP ' + r.status);\n    if (r.status === 429) throw new Error('quota');\n    if (/API key/i.test(msg)) throw new Error('badkey');\n    throw new Error(msg);\n  }\n  const text = ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || []).map(p => p.text || '').join('').trim();\n  if (opts.meta) opts.meta.finish = j.candidates && j.candidates[0] && j.candidates[0].finishReason;\n  if (!text) throw new Error(j.promptFeedback && j.promptFeedback.blockReason ? 'blocked' : 'empty');\n  return text;\n}\nasync function aiRead({ mode, src, length, summary, qa = [], question }) {\n  const LEN = { ngan: 'rất ngắn (khoảng 80 chữ)', vua: 'vừa phải (khoảng 150 đến 250 chữ)', chitiet: 'chi tiết (khoảng 400 đến 600 chữ)' }[length] || 'vừa phải (khoảng 150 đến 250 chữ)';\n  const what = src.kind === 'youtube' ? 'video YouTube này' : src.kind === 'pdf' ? 'tài liệu PDF này' : src.sub === 'sel' ? 'đoạn văn bản này' : 'nội dung trang web này';\n  const prompt = `Tóm tắt ${what}, độ dài ${LEN}. Trình bày đúng mẫu sau:\n**Tóm lại:** 1 đến 2 câu nêu điều quan trọng nhất.\n**Ý chính:**\n- ý thứ nhất\n- ý thứ hai\n(3 đến 7 ý, mỗi ý một dòng bắt đầu bằng \"- \")\n` + (src.kind === 'youtube' ? `**Mốc thời gian:**\n- [mm:ss] nội dung đoạn đó\n(4 đến 8 mốc quan trọng nhất, dùng đúng thời gian trong video)\n` : '') + `Giữ nguyên số liệu, giá, ngày tháng quan trọng. Không chào hỏi, không nhận xét ngoài lề.`;\n  const first = { role: 'user', parts: [] };\n  if (src.kind === 'youtube') first.parts.push({ fileData: { fileUri: src.url } });\n  else if (src.kind === 'pdf') first.parts.push({ inlineData: { mimeType: 'application/pdf', data: src.pdf } });\n  else first.parts.push({ text: `Tiêu đề: ${src.title}\\nĐịa chỉ: ${src.url}\\n\\n--- NỘI DUNG ---\\n${src.text}` });\n  first.parts.push({ text: prompt });\n  const contents = [first];\n  if (mode === 'ask') {\n    contents.push({ role: 'model', parts: [{ text: summary || '' }] });\n    for (const x of qa) if (x.a) contents.push({ role: 'user', parts: [{ text: x.q }] }, { role: 'model', parts: [{ text: x.a }] });\n    contents.push({ role: 'user', parts: [{ text: question + '\\n(Trả lời ngắn gọn, chỉ dựa trên nội dung ở trên. Nếu nội dung không nhắc tới thì nói rõ là không có.)' }] });\n  }\n  return gemini(contents, AI_SYS, { video: src.kind === 'youtube' });\n}\n\n// ---------- Kho ý tưởng ----------\nasync function ideaAdd(item) {\n  const { ideas = [], settings = {} } = await chrome.storage.local.get(['ideas', 'settings']);\n  const it = {\n    id: 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),\n    type: item.type || 'text', text: String(item.text || '').slice(0, 5000), title: String(item.title || '').slice(0, 200),\n    url: String(item.url || '').slice(0, 1000), sec: Number(item.sec) || 0, at: Date.now(), ai: null\n  };\n  ideas.unshift(it);\n  await chrome.storage.local.set({ ideas: ideas.slice(0, 500) });\n  const ai = settings.ai || {}, ideaSet = settings.ideas || {};\n  if (ai.key && ideaSet.autoAI === true) ideaSuggest(it.id).catch(() => {});\n  return it.id;\n}\nasync function setIdea(id, patch) {\n  const { ideas = [] } = await chrome.storage.local.get('ideas');\n  const it = ideas.find(x => x.id === id); if (!it) return null;\n  Object.assign(it, patch); await chrome.storage.local.set({ ideas }); return it;\n}\nasync function ideaSuggest(id) {\n  const { ideas = [], settings = {} } = await chrome.storage.local.get(['ideas', 'settings']);\n  const it = ideas.find(x => x.id === id); if (!it) return;\n  const plat = { facebook: 'bài đăng Facebook', tiktok: 'video TikTok', chung: 'mạng xã hội' }[(settings.ideas || {}).platform || 'chung'];\n  await setIdea(id, { ai: { pending: true } });\n  const ask = `Đây là một ý tưởng tôi lưu lại để làm nội dung cho ${plat}.\nHãy đề xuất:\n- \"titles\": 3 tiêu đề hấp dẫn, mỗi cái dưới 70 ký tự\n- \"caption\": 1 caption cho ${plat}, 2 đến 4 câu, emoji vừa phải, có lời kêu gọi tương tác ở cuối\n- \"hashtags\": 5 hashtag phù hợp (có dấu # ở đầu)\nTrả về đúng JSON dạng {\"titles\":[\"...\"],\"caption\":\"...\",\"hashtags\":[\"#...\"]}, viết bằng tiếng Việt.`;\n  const parts = [];\n  if (it.type === 'video' && /youtube\\.com\\/watch\\?v=/.test(it.url)) parts.push({ fileData: { fileUri: it.url.replace(/&t=\\d+s?/, '') } });\n  parts.push({ text: `Loại: ${it.type}\\nNguồn: ${it.title || ''} ${it.url || ''}\\nNội dung đã lưu:\\n${it.text || '(không có, dựa vào nguồn)'}\\n\\n${ask}` });\n  try {\n    const raw = await gemini([{ role: 'user', parts }], AI_SYS, { json: true, video: it.type === 'video' });\n    const j = JSON.parse(raw.replace(/^```(json)?|```$/g, '').trim());\n    await setIdea(id, { ai: { titles: (j.titles || []).slice(0, 3), caption: j.caption || '', hashtags: (j.hashtags || []).slice(0, 8) } });\n  } catch (e) {\n    await setIdea(id, { ai: { error: e.message } });\n  }\n}\n// Cửa oCfg();\n  const P = { name: 'Pomodoro', type: 'pomo', id: 'pomo' };\n  if (pomo.phase === 'focus') {\n    const k = todayKey();\n    pomoStats[k] = (pomoStats[k] || 0) + 1;\n    const keep = Object.keys(pomoStats).slice(-60);\n    await chrome.storage.local.set({ pomoStats: Object.fromEntries(keep.map(x => [x, pomoStats[x]])) });\n    const round = (pomo.round || 0) + 1, isLong = round % (cfg.every || 4) === 0, mins = isLong ? cfg.lng : cfg.brk;\n    await pomoSave({ ...pomo, phase: isLong ? 'long' : 'break', endAt: Date.now() + mins * 60000, round });\n    await fire(P, `🍅 Hoàn thành ${pomo.focusMin || cfg.focus} phút Pomodoro${pomo.task ? `: ${pomo.task}` : ''}! Đang cho bạn ${isLong ? 'nghỉ dài' : 'nghỉ'} ${mins} phút.`, 'remind', { end: true, task: pomo.task || '' });\n  } else {\n    if (cfg.autoNext) {\n      await pomoStart({});\n      await fire(P, `☕ Hết giờ nghỉ! Tự vào phiên ${(pomo.round || 0) + 1}, cố lên nhé 💪`, 'remind');\n    } else {\n      await pomoSave({ ...pomo, phase: 'idle', paused: false });\n      await fire(P, `☕ Hết giờ nghỉ! Sẵn sàng vào phiên ${(pomo.round || 0) + 1} chưa?`, 'remind', { next: true });\n    }\n  }\n}\n\nasync function pomoTaskDone(task) {   // \"Hoàn thành việc\" sau phiên tập trung: tick việc trong Todo\n  if (!task) return;\n  const { todos = [] } = await chrome.storage.local.get('todos');\n  const t = todos.find(x => !x.done && x.text === task);\n  if (t) { t.done = true; await chrome.storage.local.set({ todos }); }\n}\n\n// ---------- Nhắc nhanh bằng câu tiếng Việt (menu chuột phải, ô nhập trong nhánh Nhắc) ----------\nasync function quickRemind(text) {\n  const r = HT.parseWhen(text);\n  const { todos = [] } = await chrome.storage.local.get('todos');\n  const item = { id: 't' + Date.now().toString(36), text: r.task.slice(0, 200), done: false, due: r.due ? HT.localISO(r.due) : '', notified: false };\n  todos.push(item);\n  await chrome.storage.local.set({ todos });\n  return { ok: true, item, due: r.due ? r.due.getTi t chrome.storage.local.set({ todos });\n    toTab({ type: 'hh-open', tab: 'todo' });\n  }\n  if (info.menuItemId === 'hh-note') {\n    await ideaAdd({ type: sel ? 'text' : 'page', text: sel, title: tab ? tab.title : '', url: tab ? tab.url : '' });\n    toTab({ type: 'hh-open', tab: 'idea' });\n  }\n  if (info.menuItemId === 'hh-translate') toTab({ type: 'hh-open', tab: 'info', sub: 'dich', text: sel });\n  if (info.menuItemId === 'hh-explain') toTab({ type: 'hh-open', tab: 'info', sub: 'explain', text: sel });\n  if (info.menuItemId === 'hh-summary') toTab({ type: 'hh-open', tab: 'info', sub: 'read', run: true });\n});\n\n// ---------- 💡 Giải thích ----------\nasync function aiExplain({ text, mode, context }) {\n  const how = {\n    de: 'Giải thích thật dễ hiểu như nói với người không chuyên, 2 đến 4 câu, không dùng thuật ngữ khó.',\n    chitiet: 'Giải thích chi tiết: định nghĩa, cách hoạt động hoặc cách tính (nếu có), khi nào dùng, lưu ý thường gặp. Dùng gạch đầu dòng \"- \".',\n    vidu: 'Giải thích ngắn gọn 1 đến 2 câu, rồi cho 2 ví dụ cụ thể, gần gũi với người Việt (có số liệu minh hoạ nếu hợp).'\n  }[mode] || '';\n  return gemini([{ role: 'user', parts: [{ text:\n    `Người dùng đang đọc trang \"${context || ''}\" và bôi đen cụm sau, muốn biết nó nghĩa là gì:\n\"${String(text).slice(0, 2000)}\"\n${how}\nNếu là tiếng nước ngoài thì ghi nghĩa tiếng Việt trước. Bắt đầu bằng **tên cụm từ** in đậm. Trả lời bằng tiếng Việt.` }] }], AI_SYS, { temperature: 0.3, maxTokens: 2048 });\n}\n\n// ---------- 🔎 Tìm kiếm chung trên thanh địa chỉ: gõ \"hh\" + dấu cách ----------\nconst escXml = s => String(s).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&apos;' }[c]));\nconst searchPage = q => chrome.runtime.getURL('search.html') + (q ? '?q=' + encodeURIComponent(q) : '');\nchrome.omnibox.setDefaultSuggestion({ description: 'Tìm trong HaoHao: gõ từ cần tìm (Todo, Note, Nhắc nhở, Mua sắm…)' });\nchrome.omnibox.onInputChanged.addListe ze: 12.5px; color: var(--ink); word-break: break-all; }\n#hidden { padding: 0; list-style: none; }\n#hidden li { display: flex; justify-content: space-between; align-items: center; background: #fff; border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; max-width: 480px; }\n.file { display: inline-block; }\n\n@media (max-width: 760px) {\n  body { grid-template-columns: 1fr; }\n  aside { position: static; height: auto; padding: 20px; }\n  .pet { width: 64px; height: 64px; }\n  nav { flex-direction: row; flex-wrap: wrap; }\n  .rule { grid-template-columns: auto 1fr; } .rule .ops { grid-column: 1 / -1; }\n}\n.days { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 14px; margin-bottom: 14px; }\n.days span { font-size: 13px; font-weight: 600; width: 100%; }\n.days label { display: flex; gap: 5px; align-items: center; }\n.days input { width: 17px; height: 17px; accent-color: var(--coral); }\n.setup { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 4px 20px 16px; margin: 24px 0; max-width: 760px; }\n.setup:target { border-color: var(--honey-deep); box-shadow: 0 0 0 4px rgba(242,181,68,.35); }\n.setup ol { padding-left: 20px; } .setup li { margin-bottom: 8px; }\n.setup a { color: var(--ink); font-weight: 600; }\n.copy { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }\n.copy code { background: var(--sky); padding: 6px 10px; border-radius: 8px; font-size: 13px; word-break: break-all; }\n", "search.html": "<!doctype html>\n<html lang=\"vi\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>HaoHao: tìm kiếm<\/title>\n<style>\n  :root { --ink: #23305E; --soft: #6B7394; --honey: #F2B544; --blue: #2E7DD7; --line: #E3E6F0; --paper: #FFFDF6; --sky: #EAF1FF; }\n  * { box-sizing: border-box; }\n  body { margin: 0; min-height: 100vh; background: var(--sky); color: var(--ink); font: 14px/1.5 \"Be Vietnam Pro\", \"Segoe UI\", system-ui, sans-serif; }\n  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 60px; }\n  .hd { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }\n  .hd img { width: 52px; height: 52px; transform: rotate(-6deg); }\n  .hd h1 { margin: 0; font-size: 22px; font-weight: 800; }\n  .hd p { margin: 0; color: var(--soft); font-size: 13px; }\n  form { display: flex; gap: 8px; background: var(--paper); border: 2.5px solid var(--blue); border-radius: 999px; padding: 6px 6px 6px 18px; box-shadow: 0 6px 18px rgba(35,48,94,.12); }\n  form input { all: unset; flex: 1; min-width: 0; font-size: 17px; }\n  form button { all: unset; cursor: pointer; background: var(--blue); color: #fff; font-weight: 700; padding: 9px 18px; border-radius: 999px; }\n  form button:focus-visible, .chip:focus-visible, .r button:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }\n  .web { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 20px; }\n  .chip { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 999px; background: var(--paper); border: 1.5px solid var(--line); font-weight: 600; font-size: 13px; }\n  .chip:hover { border-color: var(--ink); }\n  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--soft); margin: 18px 0 6px; }\n  .r { background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start; }\n  .r.hit { border-color: var(--honey); box-shadow: 0 0 0 4px rgba(242,181,68,.3); }\n  .r .ic { font-size: 20px; line-height: 1.3; }\n  .r .bd { flex: 1; min-width: 0; }\n  .r .tt { font-weight: 700; word-break: break-word; }\n  .r .tt a { color: inherit; }\n  .r .sb { font-size: 12px; color: var(--soft); }\n  .r .more { white-space: pre-wrap; font-size: 13px; margin-top: 6px; color: #3A4470; max-height: 240px; overflow: auto; }\n  .r.dn .tt { text-decoration: line-through; color: #9AA1BE; }\n  .r button { all: unset; cursor: pointer; font-size: 12.5px; font-weight: 700; padding: 5px 10px; border-radius: 8px; border: 1.5px solid var(--ink); white-space: nowrap; }\n  .r button:hover { background: #FFF0C7; }\n  mark { background: #FFE08A; color: inherit; border-radius: 3px; padding: 0 1px; }\n  .empty { color: var(--soft); padding: 12px 2px; }\n  .acts { display: flex; gap: 8px; flex-wrap: wrap; }\n  .acts button { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--ink); font-weight: 700; font-size: 13px; background: var(--paper); }\n  @media (prefers-color-scheme: dark) {\n    :root { --ink: #E6EAF8; --soft: #A3ABCB; --line: #34406B; --paper: #172042; --sky: #10172F; }\n    .r .more { color: #C9CEDF; } .r button:hover, .acts button:hover { background: #2A3663; } mark { color: #23305E; }\n  }\n<\/style>\n<\/head>\n<body>\n<main>\n  <div class=\"hd\"><img src=\"icons/icon128.png\" alt=\"\"><div><h1>Tìm kiếm chung<\/h1><p>Tìm trong Todo, Note, Nhắc nhở, cảnh báo giá, đồ đã lưu, coin, và trên web.<\/p><\/div><\/div>\n  <form id=\"f\" role=\"search\"><input id=\"q\" type=\"search\" placeholder=\"Gõ để tìm, có dấu hay không đều được…\" aria-label=\"Tìm kiếm\" autofocus><button>Google<\/button><\/form>\n  <div class=\"web\" id=\"web\"><\/div>\n  <div id=\"out\" aria-live=\"polite\"><\/div>\n<\/main>\n<script src=\"common.js\"><\/script>\n<script src=\"search.js\"><\/script>\n<\/body>\n<\/html>\n", "search.js": "// Trang tìm kiếm chung, mở từ thanh địa chỉ (hh + dấu cách) hoặc từ HaoHao.\nconst $ = s => document.querySelector(s);\nconst params = new URLSearchParams(location.search);\nlet data = {}, openKey = params.get('open') || '';\nconst expanded = new Set(openKey ? [openKey] : []);\n\nconst el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };\nfunction markHit(text, q) {\n  const f = document.createDocumentFragment(), words = HT.fold(q).split(/\\s+/).filter(Boolean);\n  let out = ''; const map = [];\n  for (let i = 0; i < text.length; i++) { const n = HT.fold(text[i]); for (let k = 0; k < n.length; k++) { out += n[k]; map.push(i); } }\n  const hits = [];\n  for (const w of words) { let i = out.indexOf(w); while (i >= 0 && hits.length < 40) { hits.push([map[i], map[i + w.length - 1] + 1]); i = out.indexOf(w, i + w.length); } }\n  hits.sort((a, b) => a[0] - b[0]);\n  let at = 0;\n  for (const [a, b] of hits) { if (a < at) continue; f.append(text.slice(at, a)); f.append(el('mark', '', text.slice(a, b))); at = b; }\n  f.append(text.slice(at)); return f;\n}\nconst save = k => chrome.storage.local.set({ [k]: data[k] });\n\nfunction draw() {\n  const q = $('#q').value.trim(), O = $('#out');\n  O.innerHTML = '';\n  document.title = q ? `${q} · HaoHao` : 'HaoHao: tìm kiếm';\n  if (!q) { O.append(el('div', 'empty', 'Mẹo: trên thanh địa chỉ Chrome, gõ hh rồi dấu cách và từ cần tìm.')); return; }\n  const res = HT.search(data, q, 200);\n  if (!res.length) {\n    O.append(el('div', 'empty', `Không thấy \"${q}\" trong HaoHao.`));\n    const a = el('div', 'acts');\n    const bt = el('button', '', '＋ Thêm thành Todo');\n    bt.addEventListener('click', () => { (data.todos = data.todos || []).push({ id: 't' + Date.now().toString(36), text: q, done: false, due: '', notified: false }); save('todos'); });\n    const bn = el('button', '', '💡 Lưu thành Note');\n    bn.addEventListener('click', async () => { await chrome.runtime.sendMessage({ type: 'idea-add', item: { type: 'text', text: q } }).catch(() => {}); });\n    a.append(bt, bn); O.append(a); return;\n  }\n  const groups = {};\n  res.forEach(r => (groups[r.kind] = groups[r.kind] || []).push(r));\n  for (const kind of Object.keys(HT.SEARCH_KIND)) {\n    const list = groups[kind]; if (!list) continue;\n    O.append(el('h2', '', `${HT.SEARCH_KIND[kind]} (${list.length})`));\n    for (const r of list) O.append(card(r, q));\n  }\n  const hit = O.querySelector('.r.hit'); if (hit) { hit.scrollIntoView({ block: 'center' }); openKey = ''; }\n}\n\nfunction card(r, q) {\n  const key = r.kind + ':' + r.id;\n  const c = el('div', 'r' + (r.done ? ' dn' : '') + (openKey && key === openKey ? ' hit' : ''));\n  c.append(el('span', 'ic', r.icon));\n  const bd = el('div', 'bd'), tt = el('div', 'tt');\n  if (r.url && (r.kind === 'shop' || r.kind === 'idea')) { const a = el('a'); a.href = r.url; a.target = '_blank'; a.rel = 'noopener'; a.append(markHit(r.title, q)); tt.append(a); }\n  else tt.append(markHit(r.title, q));\n  bd.append(tt, el('div', 'sb', r.sub));\n  if (r.kind === 'idea') {\n    const it = (data.ideas || []).find(i => i.id === r.id);\n    if (it && it.text && it.text !== r.title) {\n      if (expanded.has(key)) { const m = el('div', 'more'); m.append(markHit(it.text, q)); bd.append(m); }\n      const b = el('button', '', expanded.has(key) ? 'Thu gọn' : 'Xem nội dung');\n      b.addEventListener('click', () => { expanded.has(key) ? expanded.delete(key) : expanded.add(key); draw(); });\n      c.append(bd, b); return c;\n    }\n  }\n  c.append(bd);\n  if (r.kind === 'todo') {\n    const t = (data.todos || []).find(x => x.id === r.id);\n    const b = el('button', '', t && t.done ? '↺ Làm lại' : '✓ Xong');\n    b.addEventListener('click', () => { if (!t) return; t.done = !t.done; save('todos'); });\n    c.append(b);\n  } else if (r.kind === 'bell' || r.kind === 'alert') {\n    const x = (data.rules || []).find(y => y.id === r.id);\n    const b = el('button', '', x && x.enabled ? 'Tắt' : 'Bật');\n    b.addEventListener('click', () => { if (!x) return; x.enabled = !x.enabled; save('rules'); });\n    c.append(b);\n  }\n  return c;\n}\n\nHT.WEB.forEach(w => {\n  const b = el('button', 'chip', `${w.emoji} ${w.label}`);\n  b.addEventListener('click', () => { const q = $('#q').value.trim(); if (!q) return $('#q').focus(); location.href = HT.webUrl(w.id, q); });\n  $('#web').append(b);\n});\nlet tm = null;\n$('#q').addEventListener('input', () => {\n  clearTimeout(tm);\n  tm = setTimeout(() => { const q = $('#q').value.trim(); history.replaceState(null, '', q ? '?q=' + encodeURIComponent(q) : location.pathname); draw(); }, 120);\n});\n$('#f').addEventListener('submit', e => { e.preventDefault(); const q = $('#q').value.trim(); if (q) location.href = HT.webUrl('google', q); });\nchrome.storage.onChanged.addListener((ch, area) => {\n  if (area !== 'local' || !HT.SEARCH_KEYS.some(k => ch[k])) return;\n  for (const k of HT.SEARCH_KEYS) if (ch[k]) data[k] = ch[k].newValue;\n  draw();\n});\n$('#q').value = params.get('q') || '';\nchrome.storage.local.get(HT.SEARCH_KEYS).then(d => { data = d; draw(); });\n"};

const zipBtn = $('#zip');
zipBtn.disabled = true; zipBtn.title = 'Đang chuẩn bị…';
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('downloads').then(d => { downloads = d; zipReady(); }).catch(() => zipReady());
} else zipReady();
function zipReady() {
  zipBtn.disabled = !downloads || !window.JSZip;
  zipBtn.title = zipBtn.disabled ? 'Chức năng tải file không có ở chế độ xem này' : '';
}
zipBtn.addEventListener('click', async () => {
  checkJSON();
  try {
    const z = new JSZip(); const dir = z.folder('tien-ich-chrome');
    for (const n in files) dir.file(n, files[n]);
    for (const n in BINARY) dir.file(n, BINARY[n], { base64: true });
    const blob = await z.generateAsync({ type: 'blob' });
    await downloads.save({ filename: 'tien-ich-chrome.zip', data: blob });
    toast('Đã tải tien-ich-chrome.zip. Giải nén rồi nạp vào chrome://extensions');
  } catch (e) {
    if (e && e.code === 'declined') return;
    if (e && e.code === 'rate_limited') return toast('Đang có một hộp thoại tải file mở, xử lý nó trước nhé');
    toast('Không tải được file: ' + (e && e.message || e));
  }
});

// ---------- khởi động ----------
loadDrafts(); open(current); run();
</script>
</body>
</html>
