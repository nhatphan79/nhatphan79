<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xưởng code HaoHao</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --bg: #EAF1FF; --panel: #FFFDF6; --ink: #23305E; --soft: #5B648A; --line: #C9CEDF;
  --honey: #F2B544; --honey-deep: #D98E1F; --coral: #E85D5D; --mint: #2F9E7E;
  --code-bg: #1C2547; --code-fg: #E6EAF8; --gutter: #6E78A3; --code-line: #2A3663;
  --ui: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #10172F; --panel: #172042; --ink: #E6EAF8; --soft: #A3ABCB; --line: #34406B; --code-bg: #0D1330; --code-line: #1E2850; }
}
:root[data-theme="dark"] { --bg: #10172F; --panel: #172042; --ink: #E6EAF8; --soft: #A3ABCB; --line: #34406B; --code-bg: #0D1330; --code-line: #1E2850; }
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--ui); display: flex; flex-direction: column; overflow: hidden; }

header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--honey); color: #23305E; flex-wrap: wrap; }
header img { width: 38px; height: 38px; transform: rotate(-6deg); }
header h1 { font-size: 18px; font-weight: 800; margin: 0; }
header p { margin: 0; font-size: 13px; flex: 1; min-width: 180px; }
.btn { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 10px; font: 600 13.5px/1.2 var(--ui); background: #23305E; color: #fff; white-space: nowrap; }
.btn.ghost { background: transparent; color: inherit; box-shadow: inset 0 0 0 2px currentColor; }
.btn.sm { padding: 5px 9px; font-size: 12.5px; }
.btn:focus-visible { outline: 3px solid var(--honey-deep); outline-offset: 2px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn[hidden] { display: none; }
#run { background: var(--honey); color: #23305E; }

.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 210px minmax(0, 1.15fr) minmax(0, 1fr); }

/* danh sách file */
.files { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.files h2, .pv-head h2 { font-size: 13px; font-weight: 800; margin: 0; padding: 12px 14px 6px; }
#fileList { list-style: none; margin: 0; padding: 0 8px; overflow-y: auto; flex: 1; }
#fileList button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border-radius: 8px; font: 13px/1.3 var(--mono); }
#fileList button:hover { background: color-mix(in srgb, var(--honey) 22%, transparent); }
#fileList button.on { background: var(--honey); color: #23305E; font-weight: 600; }
#fileList button:focus-visible { outline: 2px solid var(--honey-deep); }
#fileList .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); margin-left: auto; flex: none; }
#fileList .kind { font-size: 10.5px; padding: 1px 5px; border-radius: 4px; background: var(--line); color: var(--ink); font-family: var(--ui); font-weight: 600; flex: none; }
.newfile { padding: 10px; border-top: 1px dashed var(--line); display: flex; gap: 6px; }
.newfile input { flex: 1; min-width: 0; font: 12.5px var(--mono); padding: 6px 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
.newfile input:focus { outline: none; border-color: var(--honey-deep); }
.newfile .btn { background: var(--ink); color: var(--panel); }

/* trình soạn */
.editor { display: flex; flex-direction: column; min-height: 0; background: var(--code-bg); color: var(--code-fg); }
.ed-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--code-line); flex-wrap: wrap; }
.ed-bar .name { font: 600 13px var(--mono); }
.ed-bar .hint { font-size: 12px; color: var(--gutter); margin-right: auto; }
.ed-bar .btn.ghost { color: var(--code-fg); }
.ed-body { flex: 1; min-height: 0; display: flex; position: relative; }
#gutter { padding: 12px 8px 12px 12px; text-align: right; color: var(--gutter); font: 13px/1.6 var(--mono); user-select: none; overflow: hidden; white-space: pre; min-width: 46px; }
#code { flex: 1; resize: none; border: 0; outline: none; background: transparent; color: var(--code-fg); font: 13px/1.6 var(--mono); padding: 12px 14px 40px 6px; tab-size: 2; white-space: pre; overflow: auto; caret-color: var(--honey); }
#code::selection { background: #3D4F8F; }
.imgview { flex: 1; display: grid; place-items: center; gap: 10px; color: var(--gutter); text-align: center; padding: 20px; }
.imgview img { image-rendering: auto; max-width: 128px; background: repeating-conic-gradient(#2A3663 0 25%, transparent 0 50%) 0 0 / 16px 16px; border-radius: 8px; }
.status { display: flex; gap: 14px; padding: 5px 12px; font: 12px var(--mono); color: var(--gutter); border-top: 1px solid var(--code-line); }

/* xem thử */
.preview { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
.pv-head { display: flex; align-items: center; gap: 6px; padding: 6px 10px 6px 0; flex-wrap: wrap; }
.pv-head h2 { padding-right: 4px; }
.tabs { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; }
.tabs button { all: unset; cursor: pointer; padding: 5px 10px; border-radius: 8px; font-weight: 600; font-size: 12.5px; }
.tabs button.on { background: var(--ink); color: var(--panel); }
.tabs button:focus-visible { outline: 2px solid var(--honey-deep); }
.frames { flex: 1; min-height: 0; position: relative; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #fff; }
.frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
#deskWrap { position: absolute; inset: 0; background: linear-gradient(135deg, #2B5876, #4E4376); overflow: hidden; }
.desk-bg span { position: absolute; left: 14px; top: 10px; color: rgba(255,255,255,.7); font-size: 12px; font-weight: 600; }
#fDesk { position: absolute; inset: auto 18px 18px auto !important; width: 374px !important; height: 320px !important; border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
.sim { display: flex; gap: 6px; padding: 8px 10px; flex-wrap: wrap; align-items: center; }
.sim span { font-size: 12.5px; color: var(--soft); margin-right: 2px; }
.sim .btn { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
#console { height: 130px; overflow: auto; margin: 0; padding: 8px 12px; font: 12px/1.5 var(--mono); background: var(--code-bg); color: var(--code-fg); border-top: 1px solid var(--line); }
#console .warn { color: #F7C66B; } #console .error { color: #FF8C8C; } #console .info { color: #8FD9C0; }
#console:empty::before { content: "Nhật ký chạy thử hiện ở đây: lỗi code, console.log, tin nhắn gửi cho background."; color: var(--gutter); }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: 12px; font-weight: 600; font-size: 13.5px; z-index: 10; max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }

@media (max-width: 1100px) {
  .layout { grid-template-columns: 180px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
  .files { grid-row: 1 / 3; }
  .preview { border-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 700px) {
  body { overflow: auto; }
  .layout { display: flex; flex-direction: column; }
  .files { max-height: none; border-right: 0; }
  #fileList { display: flex; overflow-x: auto; gap: 4px; padding-bottom: 8px; }
  #fileList button { width: auto; white-space: nowrap; }
  .editor { height: 60vh; }
  .preview { height: 80vh; }
  header p { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

  <h1>Xưởng code HaoHao</h1>
  <p>Sửa code, bấm Chạy thử để xem ngay, xong thì tải file zip về cài vào Chrome.</p>
  <button class="btn ghost" id="resetAll">Khôi phục tất cả</button>
  <button class="btn" id="zip">Tải file zip</button>
</header>

<div class="layout">
  <nav class="files" aria-label="Các file của tiện ích">
    <h2>File</h2>
    <ul id="fileList"></ul>
    <div class="newfile">
      <input id="newName" placeholder="ten-file.js" aria-label="Tên file mới">
      <button class="btn sm" id="addFile">Thêm</button>
    </div>
  </nav>

  <section class="editor" aria-label="Trình soạn code">
    <div class="ed-bar">
      <span class="name" id="curName"></span>
      <span class="hint">Ctrl+S để lưu và chạy thử</span>
      <button class="btn sm ghost" id="restore">Khôi phục bản gốc</button>
      <button class="btn sm ghost" id="delFile" hidden>Xoá file</button>
      <button class="btn sm" id="run">Chạy thử</button>
    </div>
    <div class="ed-body" id="edBody">
      <div id="gutter" aria-hidden="true"></div>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Nội dung file"></textarea>
    </div>
    <div class="status"><span id="pos">Dòng 1, cột 1</span><span id="size"></span><span id="saved"></span></div>
  </section>

  <section class="preview" aria-label="Xem thử">
    <div class="pv-head">
      <h2>Xem thử</h2>
      <div class="tabs" role="tablist">
        <button role="tab" data-pv="demo" class="on">Trang web mẫu</button>
        <button role="tab" data-pv="shopee">Shopee mẫu</button>
        <button role="tab" data-pv="tiktok">TikTok mẫu</button>
        <button role="tab" data-pv="yt">YouTube mẫu</button>
        <button role="tab" data-pv="options">Trang cài đặt</button>
        <button role="tab" data-pv="desk">Ra màn hình</button>
      </div>
    </div>
    <div class="frames">
      <iframe id="fDemo" title="Trang web mẫu có HaoHao"></iframe>
      <iframe id="fOptions" title="Trang cài đặt HaoHao" hidden></iframe>
      <iframe id="fYt" title="Trang YouTube mẫu có HaoHao" hidden></iframe>
      <iframe id="fShopee" title="Trang Shopee mẫu có HaoHao" hidden></iframe>
      <iframe id="fTikTok" title="Trang TikTok Shop mẫu có HaoHao" hidden></iframe>
      <div id="deskWrap" hidden><div class="desk-bg"><span>Màn hình Windows (giả lập)</span></div><iframe id="fDesk" title="Cửa sổ HaoHao trên màn hình"></iframe></div>
    </div>
    <div class="sim">
      <span>Giả lập:</span>
      <button class="btn sm" id="simBell">Chuông nhắc</button>
      <button class="btn sm" id="simMail">Email mới</button>
      <button class="btn sm" id="simPomo">Hết phiên 🍅</button>
      <button class="btn sm" id="simRemind">Việc đến hạn</button>
      <button class="btn sm" id="simPrice">Giá chạm mốc</button>
      <button class="btn sm" id="resetData">Đặt lại dữ liệu thử</button>
    </div>
    <pre id="console" aria-live="polite"></pre>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const ORIGINAL = {"alert.js": "const $ = s => document.querySelector(s);\nlet items = [], knocks = 0, ac = null, soundOn = true, closing = false;\nconst MAX_KNOCKS = 6, KNOCK_EVERY = 45000;\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\n\nasync function load() {\n  const [{ deskQueue = [] }, { settings = {} }] = await Promise.all([\n    chrome.storage.session.get('deskQueue'), chrome.storage.local.get('settings')\n  ]);\n  soundOn = settings.sound !== false;\n  const grew = deskQueue.length > items.length;\n  items = deskQueue;\n  if (!items.length) { closing = true; window.close(); return; }\n  render();\n  if (grew) knock();\n}\n\nfunction render() {\n  $('#head').textContent = items.length > 1 ? `Cốc cốc! Có ${items.length} lời nhắc` : items[0].kind === 'mail' ? 'Cốc cốc! Có thư mới' : 'Cốc cốc! Tới giờ rồi';\n  $('#sub').textContent = items.length > 1 ? 'Làm xong việc nào thì bấm việc đó nhé' : 'HaoHao nhắc bạn nè';\n  document.title = `HaoHao: ${items[0].title}`;\n  const L = $('#list'); L.innerHTML = '';\n  for (const it of items) {\n    const c = document.createElement('div'); c.className = 'card'; c.setAttribute('role', 'listitem');\n    const t = document.createElement('div'); t.className = 't';\n    const a = document.createElement('span'); a.textContent = it.title;\n    const b = document.createElement('span'); b.textContent = new Date(it.t).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });\n    t.append(a, b);\n    const x = document.createElement('div'); x.className = 'x'; x.textContent = it.text;\n    const acts = document.createElement('div'); acts.className = 'acts';\n    if (it.kind === 'pomo') acts.append(...(it.next\n      ? [btn('▶ Vào phiên tiếp', 'main', () => act(it, 'pomo-next')), btn('Để sau', '', () => act(it, 'done'))]\n      : it.end ? [btn('✅ Hoàn thành việc', 'main', () => act(it, 'pomo-done')), btn('▶ Làm tiếp', '', () => act(it, 'pomo-next')), btn('☕ Nghỉ', '', () => act(it, 'done'))]\n      : [btn('Ok ✓', 'main', () => act(it, 'done'))]));\n    else if (it.kind === 'mail') acts.append(\n      btn('Mở mail', 'main', () => act(it, 'open')),\n      btn('Đã xem ✓', '', () => act(it, 'done'))\n    );\n    else if (it.url) acts.append(\n      btn('🛒 Săn deal', 'main', () => act(it, 'deal')),\n      btn('Xong rồi ✓', '', () => act(it, 'done'))\n    );\n    else acts.append(\n      btn('Xong rồi ✓', 'main', () => act(it, 'done')),\n      btn('10 phút nữa', '', () => act(it, 'snooze', 10)),\n      btn('30 phút nữa', '', () => act(it, 'snooze', 30))\n    );\n    c.append(t, x, acts); L.append(c);\n  }\n  L.querySelector('button.main')?.focus();\n}\nfunction btn(text, cls, fn) { const b = document.createElement('button'); b.textContent = text; b.className = cls; b.addEventListener('click', fn); return b; }\nfunction act(it, action, minutes) {\n  unlockAudio();\n  chrome.runtime.sendMessage({ type: 'desk-act', id: it.id, action, minutes }).catch(() => {});\n}\n\nasync function knock() {\n  if (closing) return;\n  knocks++;\n  document.body.classList.remove('knock'); void document.body.offsetWidth; document.body.classList.add('knock');\n  playKnock();\n  try {\n    const w = await chrome.windows.getCurrent();\n    await chrome.windows.update(w.id, { focused: true, drawAttention: true });\n    const x = w.left;\n    if (typeof x === 'number') {\n      for (const dx of [16, -16, 12, -12, 8, -8, 4, 0]) { await chrome.windows.update(w.id, { left: x + dx }); await sleep(40); }\n    }\n  } catch {}\n}\n\nfunction unlockAudio() { try { ac = ac || new AudioContext(); if (ac.state === 'suspended') ac.resume(); } catch {} }\nfunction playKnock() {\n  if (!soundOn) return;\n  try {\n    unlockAudio();\n    const t = ac.currentTime + 0.05;\n    // hai tiếng gõ \"cốc cốc\"\n    [0, 0.24].forEach(d => {\n      const len = 0.14, buf = ac.createBuffer(1, Math.floor(ac.sampleRate * len), ac.sampleRate), data = buf.getChannelData(0);\n      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 5);\n      const src = ac.createBufferSource(); src.buffer = buf;\n      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = 1.2;\n      const g = ac.createGain(); g.gain.value = 2.2;\n      src.connect(f).connect(g).connect(ac.destination); src.start(t + d);\n      const o = ac.createOscillator(), og = ac.createGain(); o.frequency.setValueAtTime(190, t + d); o.frequency.exponentialRampToValueAtTime(90, t + d + .12);\n      og.gain.setValueAtTime(0.5, t + d); og.gain.exponentialRampToValueAtTime(0.001, t + d + .14);\n      o.connect(og).connect(ac.destination); o.start(t + d); o.stop(t + d + .15);\n    });\n    // chuông nhẹ sau khi gõ\n    [880, 1175, 1320].forEach((fq, i) => {\n      const s0 = t + 0.7 + i * 0.15, o = ac.createOscillator(), g = ac.createGain();\n      o.type = 'sine'; o.frequency.value = fq;\n      g.gain.setValueAtTime(0.0001, s0); g.gain.exponentialRampToValueAtTime(0.18, s0 + .02); g.gain.exponentialRampToValueAtTime(0.0001, s0 + .7);\n      o.connect(g).connect(ac.destination); o.start(s0); o.stop(s0 + .75);\n    });\n  } catch {}\n}\n\ndocument.addEventListener('pointerdown', unlockAudio, { once: true });\nchrome.storage.onChanged.addListener((ch, area) => { if (area === 'session' && ch.deskQueue) load(); });\nsetInterval(() => { if (items.length && knocks < MAX_KNOCKS) knock(); }, KNOCK_EVERY);\nload();\n", "voice.html": "<!doctype html>\n<html lang=\"vi\">\n<head>\n<meta charset=\"utf-8\">\n<title>HaoHao đang nghe…<\/title>\n<style>\n  :root { --ink: #23305E; --honey: #F2B544; --coral: #E85D5D; --mint: #2F9E7E; --cream: #FFFDF6; --soft: #6B7394; }\n  * { box-sizing: border-box; }\n  html, body { height: 100%; margin: 0; }\n  body { background: var(--cream); color: var(--ink); font: 14px/1.45 \"Segoe UI\", system-ui, sans-serif; display: flex; flex-direction: column; padding: 14px 16px; gap: 10px; }\n  .top { display: flex; align-items: center; gap: 14px; }\n  #mic { all: unset; cursor: pointer; width: 64px; height: 64px; border-radius: 50%; background: var(--coral); display: grid; place-items: center; flex: none; box-shadow: 0 4px 12px rgba(232,93,93,.35); }\n  #mic svg { width: 30px; height: 30px; }\n  #mic.on { animation: pulse 1.2s infinite; }\n  #mic.off { background: var(--ink); box-shadow: none; }\n  #mic:focus-visible { outline: 3px solid var(--honey); outline-offset: 3px; }\n  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(232,93,93,.5); } 70% { box-shadow: 0 0 0 16px rgba(232,93,93,0); } 100% { box-shadow: 0 0 0 0 rgba(232,93,93,0); } }\n  h1 { margin: 0; font-size: 17px; font-weight: 800; }\n  #status { font-size: 13px; color: var(--soft); }\n  textarea { flex: 1; width: 100%; resize: none; border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; font: 15px/1.5 \"Segoe UI\", system-ui, sans-serif; color: var(--ink); background: #fff; }\n  textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(242,181,68,.5); }\n  .acts { display: flex; gap: 8px; flex-wrap: wrap; }\n  button.b { all: unset; cursor: pointer; padding: 9px 14px; border-radius: 10px; font-weight: 700; font-size: 13.5px; border: 2px solid var(--ink); }\n  button.main { background: var(--ink); color: #fff; }\n  button.b:hover { background: #FFF0C7; } button.main:hover { background: #2f3f78; }\n  button.b:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }\n  button[disabled] { opacity: .45; pointer-events: none; }\n  .err { color: #9B2C2C; }\n  @media (prefers-reduced-motion: reduce) { #mic.on { animation: none; } }\n<\/style>\n<\/head>\n<body>\n  <div class=\"top\">\n    <button id=\"mic\" aria-label=\"Bắt đầu hoặc dừng nghe\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"/><path d=\"M5.5 11a6.5 6.5 0 0013 0M12 17.5V21\"/><\/svg>\n    <\/button>\n    <div>\n      <h1 id=\"head\">HaoHao đang nghe…<\/h1>\n      <div id=\"status\" role=\"status\">Cứ nói tự nhiên bằng tiếng Việt. Nói xong bấm Lưu.<\/div>\n    <\/div>\n  <\/div>\n  <textarea id=\"txt\" placeholder=\"Lời bạn nói sẽ hiện ở đây, sửa được trước khi lưu…\" aria-label=\"Nội dung ghi chú\"><\/textarea>\n  <div class=\"acts\">\n    <button class=\"b main\" id=\"saveIdea\">💡 Lưu vào kho ý tưởng<\/button>\n    <button class=\"b\" id=\"saveTodo\">✅ Thêm vào Todolist<\/button>\n    <button class=\"b\" id=\"again\">Nói lại<\/button>\n  <\/div>\n<script src=\"voice.js\"><\/script>\n<\/body>\n<\/html>\n", "options.html": "<!doctype html>\n<html lang=\"vi\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>HaoHao: cài đặt<\/title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap\">\n<link rel=\"stylesheet\" href=\"options.css\">\n<\/head>\n<body>\n<aside>\n  <img src=\"icons/icon128.png\" alt=\"\" class=\"pet\">\n  <h1>HaoHao<\/h1>\n  <p class=\"tag\">Chú hamster canh tin, canh giá và nhắc việc cho bạn trong Chrome.<\/p>\n  <nav>\n    <button data-tab=\"rules\" class=\"on\">Điều kiện<\/button>\n    <button data-tab=\"log\">Nhật ký<\/button>\n    <button data-tab=\"settings\">Cài đặt chung<\/button>\n  <\/nav>\n<\/aside>\n\n<main>\n  <section id=\"tab-rules\">\n    <header class=\"top\">\n      <div>\n        <h2>Điều kiện<\/h2>\n        <p class=\"sub\">Khi điều kiện đúng, HaoHao nhảy ra báo và gửi thông báo. Todolist, lịch nhắc và danh sách coin cũng chỉnh được ngay trong HaoHao trên trang web.<\/p>\n      <\/div>\n      <button id=\"add\" class=\"btn\">Thêm điều kiện<\/button>\n    <\/header>\n\n    <form id=\"editor\" hidden>\n      <div class=\"seg\" role=\"radiogroup\" aria-label=\"Loại điều kiện\">\n                <label><input type=\"radio\" name=\"type\" value=\"price\" checked><span>Crypto<\/span><\/label>\n        <label><input type=\"radio\" name=\"type\" value=\"reminder\"><span>Nhắc nhở 🔔<\/span><\/label>\n      <\/div>\n\n      <label class=\"f\">Tên gợi nhớ<input name=\"name\" required placeholder=\"Ví dụ: Kèo meme Solana\"><\/label>\n\n      <div class=\"grp\" data-for=\"price\">\n        <div class=\"row\">\n          <label class=\"f\">Nguồn giá\n            <select name=\"source\">\n              <option value=\"coingecko\">CoinGecko (coin lớn, nhập mã như bitcoin, solana)<\/option>\n              <option value=\"dexscreener\">DexScreener (meme coin, dán địa chỉ token)<\/option>\n            <\/select><\/label>\n          <label class=\"f\">Mã coin hoặc địa chỉ token<input name=\"coin\" placeholder=\"bitcoin\"><\/label>\n        <\/div>\n        <div class=\"row\">\n          <label class=\"f\">Báo khi\n            <select name=\"op\">\n              <option value=\"above\">Giá lớn hơn hoặc bằng ($)<\/option>\n              <option value=\"below\">Giá nhỏ hơn hoặc bằng ($)<\/option>\n              <option value=\"up\">Tăng ít nhất (% trong 24h)<\/option>\n              <option value=\"down\">Giảm ít nhất (% trong 24h)<\/option>\n            <\/select><\/label>\n          <label class=\"f\">Mốc<input name=\"value\" type=\"number\" step=\"any\" placeholder=\"120000\"><\/label>\n        <\/div>\n        <div class=\"test\"><button type=\"button\" id=\"test\" class=\"btn ghost\">Xem giá hiện tại<\/button><span id=\"testOut\"><\/span><\/div>\n        <p class=\"hint\">Giá được kiểm tra mỗi phút. Mỗi lần điều kiện chuyển từ sai sang đúng, bạn được báo một lần.<\/p>\n      <\/div>\n\n      <div class=\"grp\" data-for=\"reminder\" hidden>\n        <div class=\"row\">\n          <label class=\"f\">Biểu tượng\n            <select name=\"icon\"><option>🔔<\/option><option>💊<\/option><option>💧<\/option><option>🧒<\/option><option>🍚<\/option><option>🏃<\/option><option>📞<\/option><option>🛏️<\/option><option>🐶<\/option><option>🌱<\/option><\/select><\/label>\n          <label class=\"f\">Kiểu nhắc\n            <select name=\"kind\"><option value=\"daily\">Hằng ngày, vào các giờ cố định<\/option><option value=\"interval\">Lặp lại sau mỗi X phút<\/option><option value=\"once\">Một lần vào ngày giờ cụ thể<\/option><\/select><\/label>\n        <\/div>\n        <div class=\"row\">\n          <label class=\"f\" data-kind=\"daily\">Các giờ nhắc, cách nhau dấu phẩy<input name=\"times\" placeholder=\"08:00, 20:00\"><\/label>\n          <label class=\"f\" data-kind=\"interval\" hidden>Số phút<input name=\"minutes\" type=\"number\" min=\"5\" value=\"60\"><\/label>\n          <label class=\"f\" data-kind=\"interval\" hidden>Từ giờ<input name=\"from\" type=\"time\" value=\"08:00\"><\/label>\n          <label class=\"f\" data-kind=\"interval\" hidden>Đến giờ<input name=\"to\" type=\"time\" value=\"21:00\"><\/label>\n          <label class=\"f\" data-kind=\"once\" hidden>Ngày giờ<input name=\"datetime\" type=\"datetime-local\"><\/label>\n        <\/div>\n        <div class=\"days\" data-kind=\"daily\">\n          <span>Ngày trong tuần (không chọn là mọi ngày):<\/span>\n          <label><input type=\"checkbox\" name=\"day\" value=\"1\">T2<\/label><label><input type=\"checkbox\" name=\"day\" value=\"2\">T3<\/label>\n          <label><input type=\"checkbox\" name=\"day\" value=\"3\">T4<\/label><label><input type=\"checkbox\" name=\"day\" value=\"4\">T5<\/label>\n          <label><input type=\"checkbox\" name=\"day\" value=\"5\">T6<\/label><label><input type=\"checkbox\" name=\"day\" value=\"6\">T7<\/label>\n          <label><input type=\"checkbox\" name=\"day\" value=\"0\">CN<\/label>\n        <\/div>\n        <label class=\"f\">Lời nhắc<input name=\"message\" placeholder=\"Tới giờ đi đón con rồi!\"><\/label>\n      <\/div>\n\n      <div class=\"actions\">\n        <button type=\"submit\" class=\"btn\">Lưu điều kiện<\/button>\n        <button type=\"button\" id=\"cancel\" class=\"btn ghost\">Huỷ<\/button>\n      <\/div>\n    <\/form>\n\n    <div id=\"list\"><\/div>\n  <\/section>\n\n  <section id=\"tab-log\" hidden>\n    <header class=\"top\">\n      <div><h2>Nhật ký<\/h2><p class=\"sub\">Những lần HaoHao đã báo cho bạn.<\/p><\/div>\n      <button id=\"clearLog\" class=\"btn ghost\">Xoá nhật ký<\/button>\n    <\/header>\n    <ol id=\"log\"><\/ol>\n  <\/section>\n\n  <section id=\"tab-settings\" hidden>\n    <header class=\"top\"><div><h2>Cài đặt chung<\/h2><\/div><\/header>\n    <label class=\"chk big\"><input type=\"checkbox\" id=\"mascotEnabled\"> Hiện HaoHao trên các trang web<\/label>\n    <label class=\"chk big\"><input type=\"checkbox\" id=\"greet\"> HaoHao chào và báo việc đang chờ khi mở trang<\/label>\n    <label class=\"chk big\"><input type=\"checkbox\" id=\"desktop\"> Khi nhắc nhở, HaoHao ra hẳn màn hình và gõ cửa (đè lên cả ứng dụng khác)<\/label>\n    <label class=\"chk big\"><input type=\"checkbox\" id=\"sound\"> Có tiếng gõ và tiếng chuông<\/label>\n    <label class=\"chk big\"><input type=\"checkbox\" id=\"shopTrust\"> Trên Shopee, HaoHao chấm điểm tin cậy sản phẩm và shop<\/label>\n    <label class=\"chk big\"><input type=\"checkbox\" id=\"shopAuto\"> Mở sản phẩm Shopee là HaoHao tự so giá với shop khác (mở ngầm 1 tab vài giây)<\/label>\n    <label class=\"chk big\"><input type=\"checkbox\" id=\"shopAsk\"> Trên Shopee, luôn hiện bong bóng kết quả kiểm tra (tắt thì chỉ còn điểm nhỏ trên đầu HaoHao)<\/label>\n    <p class=\"sub\">🔗 Nút mua, lấy mã và tìm trên Shopee, TikTok Shop dùng link tiếp thị: HaoHao có thể nhận hoa hồng khi bạn mua, bạn không phải trả thêm.<\/p>\n    <div class=\"test\"><button id=\"deskTest\" class=\"btn ghost\">Thử HaoHao ra màn hình<\/button><span id=\"appStatus\"><\/span><\/div>\n    <div id=\"ai\" class=\"setup\">\n      <h3>📖 Đọc hộ (Gemini)<\/h3>\n      <p class=\"sub\">Lấy mã miễn phí tại <a href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noopener\">Google AI Studio<\/a> → <b>Create API key<\/b>. Mã chỉ lưu trong Chrome của bạn.<\/p>\n      <div class=\"test\">\n        <label class=\"f\" style=\"margin:0;max-width:360px\">Mã Gemini<input id=\"aiKey\" type=\"password\" placeholder=\"AIza…\" autocomplete=\"off\"><\/label>\n        <label class=\"f\" style=\"margin:0;max-width:220px\">Mô hình<input id=\"aiModel\" placeholder=\"gemini-2.5-flash\"><\/label>\n        <button type=\"button\" id=\"aiSave\" class=\"btn\">Lưu<\/button>\n        <button type=\"button\" id=\"aiTest\" class=\"btn ghost\">Thử kết nối<\/button>\n      <\/div>\n      <p id=\"aiState\" class=\"sub\"><\/p>\n    <\/div>\n\n    <div id=\"outlook\" class=\"setup\">\n      <h3>📧 Đăng nhập Outlook / Hotmail (thiết lập 1 lần)<\/h3>\n      <p class=\"sub\">Microsoft bắt mỗi phần mềm tự đăng ký một \"mã ứng dụng\" miễn phí. Làm 1 lần là xong, dùng được cho cả Outlook cá nhân (hotmail, outlook.com) và Outlook công ty.<\/p>\n      <ol>\n        <li>Mở <a href=\"https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade\" target=\"_blank\" rel=\"noopener\">trang App registrations của Microsoft<\/a>, đăng nhập bằng tài khoản Outlook, bấm <b>New registration<\/b>.<\/li>\n        <li>Name: <b>HaoHao<\/b>. Supported account types: chọn dòng <b>Accounts in any organizational directory … and personal Microsoft accounts<\/b>.<\/li>\n        <li>Redirect URI: chọn <b>Web<\/b>, dán địa chỉ này vào:\n          <div class=\"copy\"><code id=\"msRedirect\">…<\/code><button type=\"button\" id=\"copyRedirect\" class=\"btn ghost sm\">Sao chép<\/button><\/div>\n          rồi bấm <b>Register<\/b>.<\/li>\n        <li>Vào mục <b>Authentication<\/b>, tick ô <b>Access tokens (used for implicit flows)<\/b>, bấm <b>Save<\/b>.<\/li>\n        <li>Quay lại <b>Overview<\/b>, sao chép <b>Application (client) ID<\/b>, dán vào ô dưới rồi bấm Lưu.<\/li>\n      <\/ol>\n      <div class=\"test\">\n        <label class=\"f\" style=\"margin:0;max-width:420px\">Application (client) ID<input id=\"msClientId\" placeholder=\"xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\"><\/label>\n        <button type=\"button\" id=\"sav =\"6.5\" ry=\"4.2\" fill=\"#FF9F8E\"/><ellipse cx=\"72\" cy=\"62\" rx=\"6.5\" ry=\"4.2\" fill=\"#FF9F8E\"/>\n        <ellipse cx=\"50\" cy=\"61\" rx=\"6\" ry=\"5\" fill=\"#23305E\"/>\n        <ellipse cx=\"39\" cy=\"89\" rx=\"7\" ry=\"4\" fill=\"#D98E1F\"/><ellipse cx=\"61\" cy=\"89\" rx=\"7\" ry=\"4\" fill=\"#D98E1F\"/>\n      <\/svg>\n      <div class=\"paw\"><\/div><div class=\"ripple r1\"><\/div><div class=\"ripple r2\"><\/div>\n      <div class=\"say\">Cốc! Cốc!<\/div>\n    <\/div>\n    <div>\n      <h1 id=\"head\">Cốc cốc! Tới giờ rồi<\/h1>\n      <p id=\"sub\">HaoHao nhắc bạn nè<\/p>\n    <\/div>\n  <\/div>\n  <div id=\"list\" role=\"list\"><\/div>\n<script src=\"alert.js\"><\/script>\n<\/body>\n<\/html>\n", "options.js": "const $ = s => document.querySelector(s);\nconst form = $('#editor');\nlet rules = [], settings = {}, editing = null;\n\nconst TYPE_NAMES = { keyword: 'Lọc', price: 'Crypto', reminder: 'Nhắc nhở' };\n\nasync function load() {\n  const d = await chrome.storage.local.get(['rules', 'settings', 'log', 'lastQuotes']);\n  rules = (d.rules || []).filter(r => r.type !== 'keyword');\n  settings = { mascotEnabled: true, hiddenSites: [], ...(d.settings || {}) };\n  renderRules(d.lastQuotes || {});\n  renderLog(d.log || []);\n  renderSettings();\n}\nconst saveRules = () => chrome.storage.local.set({ rules });\nconst saveSettings = () => chrome.storage.local.set({ settings });\n\n// ---------- tabs ----------\ndocument.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {\n  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));\n  document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== 'tab-' + b.dataset.tab);\n}));\n\n// ---------- danh sách điều kiện ----------\nfunction renderRules(quotes) {\n  const L = $('#list'); L.innerHTML = '';\n  if (!rules.length) {\n    L.innerHTML = '<div class=\"empty\">Chưa có điều kiện nào. Bấm “Thêm điều kiện” để HaoHao bắt đầu làm việc.<\/div>';\n    return;\n  }\n  for (const type of ['price', 'reminder']) {\n    const list = rules.filter(r => r.type === type);\n    if (!list.length) continue;\n    const g = document.createElement('div'); g.className = 'group';\n    g.innerHTML = `<h3>${TYPE_NAMES[type]} <small>${list.length}<\/small><\/h3>`;\n    for (const r of list) {\n      const row = document.createElement('div'); row.className = 'rule' + (r.enabled ? '' : ' off');\n      const sw = document.createElement('label'); sw.className = 'sw';\n      sw.innerHTML = `<input type=\"checkbox\" aria-label=\"Bật hoặc tắt ${esc(r.name)}\" ${r.enabled ? 'checked' : ''}><span><\/span>`;\n      sw.querySelector('input').addEventListener('change', e => { r.enabled = e.target.checked; saveRules(); row.classList.toggle('off', !r.enabled); });\n      const info = document.createElement('div');\n      info.innerHTML = `<div class=\"n\">${type === 'reminder' ? esc(r.icon || '🔔') + ' ' : ''}${esc(r.name)}<\/div><div class=\"d\">${esc(HT.describe(r))}<\/div>`;\n      if (type === 'price') {\n        const k = r.source === 'dexscreener' ? 'dx:' + (r.coin || '').trim() : 'cg:' + (r.coin || '').trim().toLowerCase();\n        if (quotes[k]) info.insertAdjacentHTML('beforeend', `<div class=\"q\">Giá gần nhất: $${HT.fmt(quotes[k].price)} (24h ${quotes[k].change >= 0 ? '+' : ''}${quotes[k].change.toFixed(1)}%)<\/div>`);\n      }\n      if (type === 'reminder' && r.message) info.insertAdjacentHTML('beforeend', `<div class=\"d\">“${esc(r.message)}”<\/div>`);\n      const ops = document.createElement('div'); ops.className = 'ops';\n      const ed = btn('Sửa', 'btn ghost sm', () => r.kind === 'lunar' ? alert('Lịch nhắc âm lịch sửa trong HaoHao: bấm HaoHao trên trang web > nhánh Nhắc nhở > nút ✎.') : openEditor(r));\n      const del = btn('Xoá', 'btn ghost sm danger', () => {\n        if (!confirm(`Xoá điều kiện “${r.name}”?`)) return;\n        rules = rules.filter(x => x !== r); saveRules(); load();\n      });\n      ops.append(ed, del);\n      row.append(sw, info, ops); g.append(row);\n    }\n    L.append(g);\n  }\n}\nfunction btn(text, cls, fn) { const b = document.createElement('button'); b.className = cls; b.textContent = text; b.addEventListener('click', fn); return b; }\nfunction esc(s) { return String(s ?? '').replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c])); }\n\n// ---------- trình soạn điều kiện ----------\nfunction syncForm() {\n  const type = form.type.value;\n  form.querySelectorAll('.grp').forEach(g => g.hidden = g.dataset.for !== type);\n  const kind = form.kind.value;\n  form.querySelectorAll('[data-kind]').forEach(el => el.hidden = el.dataset.kind !== kind);\n  form.coin.placeholder = form.source.value === 'dexscreener' ? 'Dán địa chỉ token (contract)' : 'bitcoin';\n  form.value.placeholder = ['up', 'down'].includes(form.op.value) ? '20' : '120000';\n}\nform.addEventListener('change', syncForm);\n\nfunction openEditor(r) {\n  editing = r || null;\n  form.reset();\n  const v = r || { type: 'price', accentless: true, mode: 'any', source: 'coingecko', op: 'above', kind: 'daily', times: ['08:00'], minutes: 60, icon: '🔔' };\n  form.type.value = v.type;\n  form.name.value = v.name || '';\n  form.words.value = (v.words || []).join(', ');\n  form.sites.value = v.sites || '';\n  form.mode.value = v.mode || 'any';\n  form.accentless.checked = v.accentless !== false;\n  form.source.value = v.source || 'coingecko';\n  form.coin.value = v.coin || '';\n  form.op.value = v.op || 'above';\n  form.value.value = v.value ?? '';\n  form.kind.value = v.kind || 'daily';\n  form.times.value = HT.timesOf(v).join(', ') || '08:00';\n  form.icon.value = v.icon || '🔔';\n  form.from.value = v.from || '08:00'; form.to.value = v.to || '21:00';\n  form.querySelectorAll('[name=day]').forEach(c => c.checked = (v.days || []).includes(Number(c.value)));\n  form.minutes.value = v.minutes || 60;\n  form.datetime.value = v.datetime || '';\n  form.message.value = v.message || '';\n  $('#testOut').textContent = '';\n  form.hidden = false; syncForm(); form.name.focus();\n  form.scrollIntoView({ behavior: 'smooth', block: 'start' });\n}\n$('#add').addEventListener('click', () => openEditor(null));\n$('#cancel').addEventListener('click', () => { form.hidden = true; editing = null; });\n\nform.addEventListener('submit', e => {\n  e.preventDefault();\n  const type = form.type.value;\n  const r = { id: editing?.id || 'r' + Date.now().toString(36), type, name: form.name.value.trim(), enabled: editing ? editing.enabled : true };\n  if (type === 'keyword') {\n    r.words = form.words.value.split(/[,\\n]/).map(s => s.trim()).filter(Boolean);\n    if (!r.words.length) return alert('Nhập ít nhất một từ khoá.');\n    r.sites = form.sites.value.trim(); r.mode = form.mode.value; r.accentless = form.accentless.checked;\n  } else if (type === 'price') {\n    r.source = form.source.value; r.coin = form.coin.value.trim(); r.op = form.op.value; r.value = Number(form.value.value);\n    if (!r.coin || form.value.value === '') return alert('Nhập mã coin và mốc giá.');\n  } else {\n    r.kind = form.kind.value; r.icon = form.icon.value; r.minutes = Math.max(5, Number(form.minutes.value) || 60);\n    r.times = [...new Set((form.times.value.match(/\\d{1,2}:\\d{2}/g) || []).map(t => t.padStart(5, '0')))].sort();\n    r.days = [...form.querySelectorAll('[name=day]:checked')].map(c => Number(c.value));\n    r.from = form.from.value; r.to = form.to.value;\n    r.datetime = form.datetime.value; r.message = form.message.value.trim();\n    if (r.kind === 'daily' && !r.times.length) return alert('Nhập ít nhất một giờ, ví dụ 08:00.');\n    if (r.kind === 'once' && !r.datetime) return alert('Chọn ngày giờ nhắc.');\n    if (r.kind === 'once') r.enabled = true;\n  }\n  if (editing) rules[rules.indexOf(editing)] = r; else rules.push(r);\n  if (type === 'price') chrome.storage.local.get('priceState').then(({ priceState = {} }) => { delete priceState[r.id]; chrome.storage.local.set({ priceState }); });\n  saveRules().then(() => { form.hidden = true; editing = null; load(); });\n});\n\n$('#test').addEventListener('click', async () => {\n  const out = $('#testOut'); out.textContent = 'Đang lấy giá…'; out.style.color = '';\n  try {\n    const q = await HT.quote({ source: form.source.value, coin: form.coin.value });\n    out.textContent = `${String(q.label).toUpperCase()}: $${HT.fmt(q.price)} (24h ${q.change >= 0 ? '+' : ''}${q.change.toFixed(1)}%)`;\n  } catch (err) { out.textContent = err.message; out.style.color = 'var(--coral)'; }\n});\n\n// ---------- nhật ký ----------\nfunction renderLog(log) {\n  const L = $('#log'); L.innerHTML = '';\n  if (!log.length) { L.innerHTML = '<li>Chưa có lần báo nào.<\/li>'; return; }\n  for (const e of log) {\n    const li = document.createElement('li'); li.className = 'k-' + (e.kind || 'keyword');\n    li.innerHTML = `<time>${new Date(e.t).toLocaleString('vi-VN')}<\/time><strong>${esc(e.rule)}<\/strong>: ${esc(e.text)}` +\n      (e.url ? `<br><a href=\"${esc(e.url)}\" target=\"_blank\" rel=\"noopener\">${esc(e.url)}<\/a>` : '');\n    L.append(li);\n  }\n}\n$('#clearLog').addEventListener('click', () => chrome.storage.local.set({ log: [] }));\n\n// ---------- cài đặt chung ----------\nfunction renderSettings() {\n  $('#mascotEnabled').checked = settings.mascotEnabled !== false;\n  $('#greet').checked = settings.greet !== false;\n  $('#desktop').checked = settings.desktop !== false;\n  $('#sound').checked = settings.sound !== false;\n  $('#shopTrust').checked = settings.shopTrust !== false;\n  $('#shopAsk').checked = settings.shopAsk !== false;\n  $('#shopAuto').checked = settings.shopAuto !== false;\n  const L = $('#hidden'); L.innerHTML = '';\n  if (!settings.hiddenSites.length) L.innerHTML = '<li>Không có trang nào.<\/li>';\n  for (const h of settings.hiddenSites) {\n    const li = document.createElement('li'); li.textContent = h;\n    li.append(btn('Hiện lại', 'btn ghost sm', () => { settings.hiddenSites = settings.hiddenSites.filter(x => x !== h); saveSettings(); }));\n    L.append(li);\n  }\n}\n$('#mascotEnabled').addEventListener('change', e => { settings.mascotEnabled = e.target.checked; saveSettings(); });\n$('#desktop').addEventListener('change', e => { settings.desktop = e.target.checked; saveSettings(); });\n$('#sound').addEventListener('change', e => { settings.sound = e.target.checked; saveSettings(); });\n$('#shopTrust').addEventListener('change', e => { settings.shopTrust = e.target.checked; saveSettings(); });\n$('#shopAsk').addEventListener('change', e => { settings.shopAsk = e.target.checked; saveSettings(); });\n$('#shopAuto').addEventListener('change', e => { settings.shopAuto = e.target.checked; saveSettings(); });\n$('#deskTest').addEventListener('click', () => chrome.runtime.sendMessage({ type: 'desk-test' }));\nchrome.runtime.sendMessage({ type: 'app-status' }).then(r => {\n  $('#appStatus').textContent = r && r.running\n    ? '🐹 App HaoHao 3D đang chạy: nhắc nhở sẽ do con hamster 3D gõ cửa.'\n    : 'App HaoHao 3D chưa chạy: đang dùng cửa sổ nhắc nhỏ. Bấm đúp biểu tượng HaoHao trên Desktop để bật con hamster 3D.';\n}).catch(() => {});\n$('#greet').addEventListener('change', e => { settings.greet = e.target.checked; saveSettings(); });\n$('#resetPos').addEventListener('click', () => { delete settings.pos; saveSettings(); });\n\n$('#export').addEventListener('click', () => {\n  const blob = new Blob([JSON.stringify({ rules, settings }, null, 2)], { type: 'application/json' });\n  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'haohao-sao-luu.json'; a.click();\n});\n$('#import').addEventListener('change', async e => {\n  const f = e.target.files[0]; if (!f) return;\n  try {\n    const d = JSON.parse(await f.text());\n    if (!Array.isArray(d.rules)) throw new Error();\n    await chrome.storage.local.set({ rules: d.rules, settings: { ...settings, ...(d.settings || {}) } });\n    alert OUPON_FEED = 'https://raw.githubusercontent.com/nhatphan79/nhatphan79/main/haohao-extension/coupons.json';\n// Số tiền giảm của 1 mã cho đơn giá `price` (null = chưa đủ điều kiện đơn tối thiểu)\nHT.couponValue = (c, price) => {\n  if (!price) return null;\n  if (c.minOrder && price < c.minOrder) return null;\n  let v = c.discount ? +c.discount : c.percent ? price * c.percent / 100 : 0;\n  if (c.maxDiscount) v = Math.min(v, +c.maxDiscount);\n  return Math.min(Math.round(v), price);\n};\nHT.couponLive = (c, now = Date.now()) => !c.expires || new Date(c.expires).getTime() > now;\nHT.couponLabel = c => {\n  const k = n => n >= 1e6 ? (n / 1e6).toString().replace('.', ',') + 'tr' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);\n  const main = c.discount ? `Giảm ${k(c.discount)}` : c.percent ? `Giảm ${c.percent}%${c.maxDiscount ? ' tối đa ' + k(c.maxDiscount) : ''}` : (c.title || 'Ưu đãi');\n  return main + (c.minOrder ? ` · đơn từ ${k(c.minOrder)}` : '');\n};\n// Đọc chip mã trên trang Shopee: \"Giảm ₫5k\", \"Giảm 10%\", kèm \"Đơn Tối Thiểu ₫99k\", \"Giảm tối đa ₫20k\" nếu có\nHT.parseVouchers = text => {\n  const out = [], t = String(text || '').replace(/\\s+/g, ' ');\n  const re = /Giảm\\s*(?:giá\\s*)?(₫\\s*[\\d.,]+\\s*k?|[\\d.,]+\\s*k?\\s*₫|\\d{1,2}\\s*%)(?:\\s*(?:Giảm tối đa|Tối đa)\\s*(₫\\s*[\\d.,]+\\s*k?|[\\d.,]+\\s*k?\\s*₫))?(?:[^₫%]{0,20}Đơn (?:Tối Thiểu|tối thiểu|từ)\\s*(₫\\s*[\\d.,]+\\s*k?|[\\d.,]+\\s*k?\\s*₫))?/gi;\n  const money = s => HT.num(String(s).replace(/[₫\\s]/g, ''));\n  for (const m of t.matchAll(re)) {\n    const c = /%/.test(m[1]) ? { percent: parseInt(m[1]) } : { discount: money(m[1]) };\n    if (m[2]) c.maxDiscount = money(m[2]);\n    if (m[3]) c.minOrder = money(m[3]);\n    if ((c.discount && c.discount < 500) || (c.percent && c.percent > 90)) continue;\n    const key = JSON.stringify(c); if (!out.some(x => JSON.stringify(x) === key)) out.push(c);\n  }\n  return out.slice(0, 12);\n};\n\n\n// ---------- 🔍 Tìm cùng món ở shop khác trên Shopee ----------\n// Mã model (X20, WH-1000XM5, S24…): nếu tên gốc có thì món kia bắt buộc phải có\nconst UNIT = /^\\d+([.,]\\d+)?(gb|tb|mb|mah|w|kw|ml|l|g|kg|cm|mm|m|inch|in|hz|v|btu|lit|lít|k|tr|m2)$/i;\nHT.modelOf = title => String(title || '').split(/[\\s,()/[\\]|+]+/).map(t => t.replace(/^[-.]+|[-.]+$/g, ''))\n  .filter(t => t.length >= 3 && /^[A-Za-z0-9-]+$/.test(t) && /\\d/.test(t) && /[a-z]/i.test(t) && !UNIT.test(t) && !/^(spf|pa|ip|usb|hdmi|wifi|ddr|pd|gen|mk|v)\\d/i.test(t) && !/^\\d+(g|k|x)$/i.test(t))\n  .sort((a, b) => b.length - a.length)[0] || '';\nconst ACC = /\\b(op lung|bao da|cuong luc|mieng dan|dan man|cap sac|cu sac|day deo|tui dung|gia do|phu kien)\\b/;\n// 0..1: tên món kia giống tên gốc bao nhiêu (0 = khác món)\nHT.titleSim = (a, b) => {\n  const fa = HT.fold(a), fb = HT.fold(b);\n  if (ACC.test(fb) && !ACC.test(fa)) return 0;          // ốp lưng, cáp sạc… không phải cùng món\n  const m = HT.modelOf(a);\n  // có mã model mà món kia không có (hoặc là X200 thay vì X20) thì giảm mạnh độ giống\n  const miss = m && !new RegExp('(^|[^a-z0-9])' + HT.fold(m).replace(/-/g, '').replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&') + '(?![0-9])').test(fb.replace(/-/g, ''));\n  const wa = [...new Set(HT.fold(HT.cleanTitle(a)).split(/[^a-z0-9]+/).filter(w => w.length > 1))].slice(0, 10);\n  if (!wa.length) return 0;\n  const wb = new Set(HT.fold(b).split(/[^a-z0-9]+/));\n  return wa.filter(w => wb.has(w)).length / wa.length * (miss ? 0.5 : 1);\n};\n// ---------- ✅ Có đúng là CÙNG MỘT sản phẩm không? ----------\n// Chỉ khi qua hết các cửa dưới đây mới được coi là \"shop khác bán cùng món\":\n// cùng loại hàng, cùng thương hiệu, cùng mã model, cùng dung lượng/khối lượng, cùng số lượng trong gói,\n// không lệch thuộc tính chính (nam/nữ, dài/ngắn, jean/kaki…) và tên giống nhau đủ nhiều.\nconst SP_BRANDS = ['apple', 'iphone', 'ipad', 'macbook', 'airpods', 'samsung', 'galaxy', 'xiaomi', 'redmi', 'poco', 'oppo', 'vivo', 'realme', 'huawei', 'honor', 'nokia', 'sony', 'jbl', 'mar ;\n// thông số có đơn vị: 128gb, 500ml, 1.5l, 20000mah, 65w… → { gb:['128'], ml:['500'] }\nconst SP_UNITS = { gb: 'gb', g: 'g', tb: 'tb', mah: 'mah', w: 'w', ml: 'ml', l: 'l', lit: 'l', kg: 'kg', gr: 'g', gram: 'g', inch: 'inch', hz: 'hz', btu: 'btu', vien: 'vien', goi: 'goi', mieng: 'mieng' };\nconst spSpecs = f => { const o = {}; for (const m of f.matchAll(/(?:^| )(\\d+(?:[.,]\\d+)?) ?(gb|tb|mah|ml|lit|l|kg|gr|gram|g|w|inch|hz|btu|vien|goi|mieng)(?= |$)/g)) { const u = SP_UNITS[m[2]], v = String(parseFloat(m[1].replace(',', '.'))); (o[u] = o[u] || new Set()).add(v); } return o; };\n// số lượng trong gói: combo 2, set 3, bộ 5, x2, 2 đôi, hộp 10 cái… (không ghi = 1)\nconst spQty = f => { const m = f.match(/(?:^| )(?:combo|set|bo|loc|pack|hop|tui) ?(\\d{1,3})(?= |$)|(?:^| )x ?(\\d{1,2})(?= |$)|(?:^| )(\\d{1,3}) ?(?:cai|chiec|doi|cuon|chai|lon|hop|tuyp)(?= |$)/); const n = m ? +(m[1] || m[2] || m[3]) : 1; return n > 0 && n < 500 ? n : 1; };\nHT.sameProduct = (a, b) => {\n  const no = why => ({ same: false, sim: 0, why });\n  const fa = spNorm(a), fb = spNorm(b), ra = HT.fold(a), rb = HT.fold(b);\n  if (ACC.test(rb) !== ACC.test(ra)) return no('phụ kiện khác món');\n  // thương hiệu: tên gốc có thì món kia phải có, và không được là hãng khác\n  const ba = SP_BRANDS.filter(x => spHas(fa, x)), bb = SP_BRANDS.filter(x => spHas(fb, x));\n  if (ba.length && !ba.some(x => bb.includes(x))) return no('khác thương hiệu');\n  if (bb.some(x => !ba.includes(x)) && ba.length) { if (!bb.every(x => ba.includes(x) || ['iphone', 'galaxy', 'redmi', 'poco', 'ipad', 'airpods', 'macbook'].includes(x))) return no('khác thương hiệu'); }\n  // mã model phải khớp đúng (X20 ≠ X200)\n  // (món kia không ghi mã nào thì có thể chỉ là mã riêng của shop → vẫn xét, nhưng đòi tên giống hơn)\n  const hasCode = (code, raw) => new RegExp('(^|[^a-z0-9])' + HT.fold(code).replace(/-/g, '').replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&') + '(?![0-9a-z])').test(raw.replace(/-/g, ''));\n  const m = HT.modelOf(a), mb = HT.modelOf(b);\n  const noCode = m && !hasCode(m, rb);\n  if (noCode && mb && !hasCode(mb, ra)) return no('khác mã model');\n  // dung lượng, khối lượng, công suất… cùng đơn vị thì phải trùng\n  const sa = spSpecs(fa), sb = spSpecs(fb);\n  for (const u in sa) if (sb[u] && ![...sa[u]].some(v => sb[u].has(v))) return no('khác dung lượng/khối lượng');\n  for (const u of ['gb', 'tb', 'ml', 'l', 'kg', 'mah']) if (sa[u] && !sb[u] && !(u === 'l' && sb.ml) && !(u === 'ml' && sb.l)) return no('không ghi rõ dung lượng');\n  if (spQty(fa) !== spQty(fb)) return no('khác số lượng trong gói');\n  // số trần trong tên (Buds 4, Series 9, 2 lớp…) phải có đủ ở món kia\n  const nums = f => new Set([...f.matchAll(/(?:^| )(\\d{1,4})(?= |$)(?! (?:mau|size|kieu|kich|sao))/g)].map(x => String(+x[1])));\n  const na = nums(fa), nb = nums(fb);\n  if ([...na].some(n => !nb.has(n))) return no('khác số hiệu');\n  // phiên bản: Pro / Lite / Max / Plus / Mini / Ultra / SE phải y hệt nhau\n  const ver = f => ['pro', 'lite', 'max', 'plus', 'mini', 'ultra', 'se', 'fe', 'neo'].filter(w => spHas(f, w)).join();\n  if (ver(fa) !== ver(fb)) return no('khác phiên bản');\n  // thuộc tính chính không được lệch nhau\n  for (const g of SP_GROUPS) {\n    const ga = g.filter(w => spHas(fa, w)), gb = g.filter(w => spHas(fb, w));\n    if (ga.length && gb.length && !ga.some(w => gb.includes(w))) return no('khác loại (' + ga[0] + ' / ' + gb[0] + ')');\n  }\n  // loại hàng: 2 chữ đầu của tên (quần jean, áo thun, tai nghe…) phải có trong món kia\n  const wa = fa.trim().split(' ').filter(w => w.length > 1 && !ba.includes(w)), wb = new Set(fb.trim().split(' '));\n  if (!wa.length) return no('không đọc được tên');\n  if (!wa.slice(0, 2).every(w => wb.has(w))) return no('khác loại hàng');\n  // độ giống: phần lớn chữ chính của tên gốc có trong món kia, và ngược lại\n  // bỏ chữ quảng cáo (đẹp, chuẩn, cao cấp, Hàn Quốc…) khi so, chỉ so chữ nói lên món hàng\n  const key = w => w.length > 1 && !SP_STOP.has(w);\n  const ka = [...new Set(wa.filter(key))].slice(0, 12), kb = [...new Set(fb.trim().split(' ').filter(key))].slice(0, 12), sa2 = new Set(fa.trim().split(' '));\n  if (!ka.length) return no('không đọc được tên');\n  const fwd = ka.filter(w => wb.has(w)).length / ka.length, back = kb.length ? kb.filter(w => sa2.has(w)).length / kb.length : 0;\n  const sim = Math.round((fwd * 0.65 + back * 0.35) * 100) / 100;\n  if (fwd < (noCode ? 0.8 : 0.7) || back < 0.45) return { same: false, sim, why: noCode ? 'khác mã model' : 'tên khác nhiều' };\n  return { same: true, sim, why: '' };\n};\n// ---------- 🔎 Tìm sản phẩm ----------\nHT.PRICE_RANGES = { lt100: [0, 100000], '100-300': [100000, 300000], gt300: [300000, Infinity] };\n// trang tìm kiếm Shopee theo độ liên quan, kèm khoảng giá nếu có\nHT.shopeeFindUrl = (q, range) => {\n  const r = HT.PRICE_RANGES[range];\n  return 'https://shopee.vn/search?keyword=' + encodeURIComponent(q) + (r ? (r[0] ? '&minPrice=' + r[0] : '') + (r[1] < Infinity ? '&maxPrice=' + r[1] : '') : '');\n};\n// tên món có đúng thứ người dùng tìm không (đủ ~70% chữ của từ khoá, không lạc sang phụ kiện)\nHT.matchQuery = (q, title) => {\n  const wq = [...new Set(HT.fold(q).split(/[^a-z0-9]+/).filter(w => w.length > 1))];\n  if (!wq.length) return true;\n  const ft = HT.fold(title);\n  if (ACC.test(ft) && !ACC.test(HT.fold(q))) return false;\n  const wt = new Set(ft.split(/[^a-z0-9]+/));\n  return wq.filter(w => wt.has(w)).length >= Math.ceil(wq.length * 0.7);\n};\n// từ khoá hay được tìm, để gợi ý khi đang gõ\nHT.HOT_KEYWORDS = ('tai nghe bluetooth|tai nghe có dây|tai nghe chụp tai|tai nghe gaming|loa bluetooth|sạc dự phòng|củ sạc nhanh|cáp sạc type c|cáp sạc iphone|ốp lưng iphone|kính cường lực|chuột không dây|bàn phím cơ|bàn phím không dây|lót chuột|giá đỡ điện thoại|đồng hồ thông minh|camera wifi|ổ cắm điện|đèn ngủ|đèn học|quạt mini|quạt tích điện|' +\n  'quần jean nam|quần jean nữ|quần short nam|quần tây nam|quần ống rộng nữ|áo thun nam|áo thun nữ|áo polo nam|áo sơ t.push(it.sold < 10 ? { s: 'warn', t: `⚠ Mới bán ${it.sold}` } : { s: it.sold >= 1000 ? 'ok' : '', t: `Đã bán ${it.sold >= 1000 ? (it.sold / 1000).toFixed(it.sold >= 10000 ? 0 : 1).replace('.', ',') + 'k' : it.sold}` });\n  else t.push({ s: 'warn', t: '⚠ Chưa rõ số bán' });\n  if (it.overseas) t.push({ s: 'warn', t: '✈ Hàng nước ngoài' });\n  return t;\n};\nHT.shopeeSearchUrl = q => 'https://shopee.vn/search?keyword=' + encodeURIComponent(q) + '&order=asc&page=0&sortBy=price';\n// Tên sản phẩm gọn để tìm ở sàn khác\nHT.cleanTitle = title => String(title || '').replace(/\\[[^\\]]*\\]|\\([^)]*\\)|【[^】]*】/g, ' ')\n  .replace(/\\b(chính hãng|hàng chính hãng|freeship|miễn phí vận chuyển|bảo hành \\d+ tháng|mới 100%|giá rẻ|sale|hot|new)\\b/gi, ' ')\n  .replace(/[|•\\-–]+/g, ' ').replace(/\\s+/g, ' ').trim();\n\n// ---------- 🎟️ Lịch sale ----------\n// Ngày đôi (1.1 … 12.12), sale giữa tháng (15), sale lương về (25), Black Friday. big = ngày sale lớn.\nHT.saleDays = (from = new Date(), n = 4) => {\n  const out = [], d0 = new Date(from); d0.setHours(0, 0, 0, 0);\n  for (let i = 0; i < 400 && out.length < n; i++) {\n    const d = new Date(d0); d.setDate(d0.getDate() + i);\n    const day = d.getDate(), mon = d.getMonth() + 1;\n    const lastFri = mon === 11 && d.getDay() === 5 && day + 7 > 30;\n    let name = '', big = false;\n    if (day === mon) { name = `${day}.${mon}`; big = mon >= 9 || mon === 6 || mon === 3; }\n    else if (lastFri) { name = 'Black Friday'; big = true; }\n    else if (day === 15) name = `Sale giữa tháng 15.${mon}`;\n    else if (day === 25) name = `Sale lương về 25.${mon}`;\n    if (name) out.push({ name, date: d, big, days: i });\n  }\n  return out;\n};\n\n// ---------- 📉 Nhận xét giá từ lịch sử 30 ngày ----------\nHT.priceVerdict = (history, now = Date.now()) => {\n  const pts = (history || []).filter(x => x.p && now - x.t <= 30 * 86400e3);\n  if (pts.length < 3) return { cls: 'na', text: 'Chưa đủ dữ liệu, HaoHao đang theo dõi thêm' };\n  const cur = pts[pts.length - 1].p;\n  // so với giá TRƯỚC lần đổi giá gần nhất (bỏ các lần ghi lặp lại giá hiện tại)\n  let k = pts.length - 1; while (k > 0 && pts[k - 1].p === cur) k--;\n  const prev = pts.slice(0, k).map(x => x.p);\n  if (!prev.length) return { cls: 'ok', text: 'Giá không đổi trong 30 ngày' };\n  const low = Math.min(...prev), avg = prev.reduce((a, b) => a + b, 0) / prev.length;\n  const sale = HT.saleDays(new Date(now), 6).find(x => x.big && x.days <= 10);\n  const rose = pts.some((x, i) => i && now - x.t <= 10 * 86400e3 && x.p > pts[i - 1].p * 1.03);\n  if (cur <= low) return { cls: 'good', text: 'Giá thấp nhất 30 ngày 👍' };\n  if (cur <= avg * 0.97) return { cls: 'good', text: 'Giá tốt, thấp hơn bình thường' };\n  if (sale && rose && cur >= avg * 1.05) return { cls: 'bad', text: `Đang bị đẩy giá trước ${sale.name} ⚠` };\n  if (cur >= avg * 1.05) return { cls: 'warn', text: 'Cao hơn bình thường, nên chờ thêm' };\n  return { cls: 'ok', text: 'Giá bình thường' };\n};\n\n// ---------- 🛡️ Kiểm tra sản phẩm & shop (Shopee) ----------\n// Số kiểu Shopee: \"2,3k\" = 2300, \"1,2tr\" = 1.200.000, \"10k+\" = 10000, \"1.234\" = 1234\nHT.num = s => {\n  const m = String(s || '').toLowerCase().replace(/\\s/g, '').match(/^([\\d.,]+)(k|tr|triệu|m)?\\+?$/);\n  if (!m) return NaN;\n  let x = m[1];\n  if (m[2]) x = x.replace(',', '.'); else x = x.replace(/[.,](?=\\d{3}(\\D|$))/g, '').replace(',', '.');\n  return Math.round(parseFloat(x) * (m[2] === 'k' ? 1e3 : m[2] ? 1e6 : 1));\n};\n// \"5 năm trước\" → 60, \"3 tháng trước\" → 3, \"20 ngày trước\" → 0.7\nHT.monthsAgo = s => {\n  const m = String(s || '').toLowerCase().match(/(\\d+)\\s*(năm|tháng|tuần|ngày|giờ|phút)/);\n  if (!m) return NaN;\n  return +m[1] * { 'năm': 12, 'tháng': 1, 'tuần': 0.25, 'ngày': 1 / 30, 'giờ': 0, 'phút': 0 }[m[2]];\n};\nconst fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + 'tr' : n >= 1e3 ? (n / 1e3).toFixed(1).replace('.0', '') + 'k' : String(n);\n// info: { rating, ratingCount, dist: {5,4,3,2,1}, sold, photos, dupReviews, mall, preferred, responseRate, responseTime, joinedMonths, shopRatings, shopStar, followers, shipFrom }\nHT.trustScore = info => {\n  let sc = info.shopOnly ? 72 : 60; const product = [], shop = [];\n  const add = (list, pts, s, t) => { sc += pts; list.push({ s, t }); };\n  const n = info.ratingCount, r = info.rating;\n  // --- sản phẩm --- (trang shop thì chỉ chấm shop)\n  if (info.shopOnly) {} else if (!n) add(product, -15, 'bad', 'Chưa có đánh giá nào, chưa ai kiểm chứng');\n  else {\n    if (r >= 4.95 && n < 50) add(product, -5, 'warn', `${r}★ nhưng chỉ ${n} đánh giá, điểm cao bất thường`);\n    else if (r >= 4.8) add(product, n >= 50 ? 10 : 4, 'ok', `${r}★ từ ${fmtN(n)} đánh giá`);\n    else if (r >= 4.5) add(product, 5, 'ok', `${r}★ từ ${fmtN(n)} đánh giá`);\n    else if (r >= 4) add(product, -3, 'warn', `Chỉ ${r}★ (${fmtN(n)} đánh giá), thấp hơn mặt bằng Shopee`);\n    else add(product, r < 3.5 ? -25 : -15, 'bad', `Điểm thấp: ${r}★ (${fmtN(n)} đánh giá)`);\n    if (n < 20) add(product, -10, 'warn', 'Ít đánh giá, chưa đủ để tin');\n    else if (n >= 1000) add(product, 8, 'ok', 'Rất nhiều người đã mua và đánh giá');\n    else if (n >= 100) add(product, 4, 'ok', 'Đủ nhiều đánh giá để tham khảo');\n  }\n  const d = info.shopOnly ? null : info.dist, tot = d ? [1, 2, 3, 4, 5].reduce((a, k) => a + (d[k] || 0), 0) : 0;\n  if (tot >= 20) {\n    const low = ((d[1] || 0) + (d[2] || 0)) / tot;\n    if (low >= 0.1) add(product, -12, 'bad', `${Math.round(low * 100)}% đánh giá 1–2★, nhiều người không hài lòng`);\n    else if (low >= 0.05) add(product, -5, 'warn', `${Math.round(low * 100)}% đánh giá 1–2★`);\n    else add(product, 3, 'ok', `Chỉ ${Math.round(low * 100)}% đánh giá 1–2★`);\n  }\n  if (info.photos && n) {\n    if (info.photos / n >= 0.1) add(product, 5, 'ok', `${fmtN(info.photos)} đánh giá có ảnh/video thật`);\n    else if (n >= 100 && info.photos / n < 0.03) add(product, -4, 'warn', 'Rất ít đánh giá có ảnh thật');\n  }\  'filter') return true;\n  const senders = (m.senders || []).map(normTxt).filter(Boolean), words = (m.words || []).map(normTxt).filter(Boolean);\n  if (!senders.length && !words.length) return true;\n  const who = normTxt(e.name + ' ' + e.email), body = normTxt(e.title + ' ' + e.summary);\n  return senders.some(x => who.includes(x)) || words.some(x => body.includes(x));\n}\nasync function fetchGmail(m) {\n  const url = `https://mail.google.com/mail/u/${Number(m.account) || 0}/feed/atom${m.primary !== false ? '/%5Esmartlabel_personal' : ''}`;\n  const r = await fetch(url, { credentials: 'include', cache: 'no-store' });\n  const txt = await r.text();\n  if (!r.ok || !txt.includes('<feed')) throw new Error(r.status === 401 || r.status === 403 || /accounts\\.google\\.com/.test(r.url) ? 'login' : 'bad');\n  return parseFeed(txt);\n}\n\n// ---------- Outlook / Hotmail / Office 365 (đăng nhập Microsoft, đọc qua Microsoft Graph) ----------\nconst MS_SCOPE = 'openid profile https://graph.microsoft.com/Mail.Read https://graph.microsoft.com/User.Read';\nconst msRedirect = () => chrome.identity.getRedirectURL('ms');\nasync function msAuth(interactive) {\n  const { settings = {} } = await chrome.storage.local.get('settings');\n  const cid = ((settings.mail || {}).msClientId || '').trim();\n  if (!cid) throw new Error('noclient');\n  const state = Math.random().toString(36).slice(2);\n  const url = 'https://login.microsoftonline.com/common/oauth2/v2.0/authorize?' + new URLSearchParams({\n    client_id: cid, response_type: 'token', redirect_uri: msRedirect(), scope: MS_SCOPE,\n    response_mode: 'fragment', state, prompt: interactive ? 'select_account' : 'none'\n  });\n  const back = await chrome.identity.launchWebAuthFlow({ url, interactive });\n  const p = new URLSearchParams((new URL(back).hash || '').slice(1));\n  if (p.get('error') || !p.get('access_token')) throw new Error(interactive ? (p.get('error_description') || p.get('error') || 'login') : 'login');\n  if (p.get('state .session.get('shopNotif'); if (shopNotif[nid]) openDeal(shopNotif[nid]); chrome.notifications.clear(nid); }\n});\n\n// ---------- Đọc hộ: tóm tắt bằng Gemini ----------\nconst AI_SYS = 'Bạn là HaoHao, trợ lý \"đọc hộ\": nói rõ ràng, đi thẳng vào ý, dễ hiểu. Luôn trả lời bằng tiếng Việt. Chỉ dựa vào nội dung được cung cấp, không bịa thêm.';\nasync function gemini(contents, system, opts = {}) {\n  const { settings = {} } = await chrome.storage.local.get('settings');\n  const ai = settings.ai || {};\n  const key = (ai.key || '').trim();\n  if (!key) throw new Error('nokey');\n  const model = (ai.model || 'gemini-2.5-flash').trim();\n  const gen = { temperature: opts.temperature ?? 0.4, maxOutputTokens: opts.maxTokens || 4096 };\n  if (/flash/i.test(model) && /2\\.5/.test(model)) gen.thinkingConfig = { thinkingBudget: 0 };   // nhanh hơn, đỡ tốn lượt\n  if (opts.video) gen.mediaResolution = 'MEDIA_RESOLUTION_LOW';                                  // video đỡ tốn lượt\n  if (opts.json) gen.responseMimeType = 'application/json';\n  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {\n    method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },\n    body: JSON.stringify({ contents, systemInstruction: { parts: [{ text: system }] }, generationConfig: gen })\n  });\n  const j = await r.json().catch(() => ({}));\n  if (!r.ok) {\n    const msg = (j.error && j.error.message) || ('HTTP ' + r.status);\n    if (r.status === 429) throw new Error('quota');\n    if (/API key/i.test(msg)) throw new Error('badkey');\n    throw new Error(msg);\n  }\n  const text = ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || []).map(p => p.text || '').join('').trim();\n  if (opts.meta) opts.meta.finish = j.candidates && j.candidates[0] && j.candidates[0].finishReason;\n  if (!text) throw new Error(j.promptFeedback && j.promptFeedback.blockReason ? 'blocked' : 'empty');\n  return text;\n}\nasync function aiRead({ mode, src, length, summary, qa = [], question }) {\n  const LEN = { ngan: 'rất ngắn (khoảng 80 chữ)', vua: 'vừa phải (khoảng 150 đến 250 chữ)', chitiet: 'chi tiết (khoảng 400 đến 600 chữ)' }[length] || 'vừa phải (khoảng 150 đến 250 chữ)';\n  const what = src.kind === 'youtube' ? 'video YouTube này' : src.kind === 'pdf' ? 'tài liệu PDF này' : src.sub === 'sel' ? 'đoạn văn bản này' : 'nội dung trang web này';\n  const prompt = `Tóm tắt ${what}, độ dài ${LEN}. Trình bày đúng mẫu sau:\n**Tóm lại:** 1 đến 2 câu nêu điều quan trọng nhất.\n**Ý chính:**\n- ý thứ nhất\n- ý thứ hai\n(3 đến 7 ý, mỗi ý một dòng bắt đầu bằng \"- \")\n` + (src.kind === 'youtube' ? `**Mốc thời gian:**\n- [mm:ss] nội dung đoạn đó\n(4 đến 8 mốc quan trọng nhất, dùng đúng thời gian trong video)\n` : '') + `Giữ nguyên số liệu, giá, ngày tháng quan trọng. Không chào hỏi, không nhận xét ngoài lề.`;\n  const first = { role: 'user', parts: [] };\n  if (src.kind === 'youtube') first.parts.push({ fileData: { fileUri: src.url } });\n  else if (src.kind === 'pdf') first.parts.push({ inlineData: { mimeType: 'application/pdf', data: src.pdf } });\n  else first.parts.push({ text: `Tiêu đề: ${src.title}\\nĐịa chỉ: ${src.url}\\n\\n--- NỘI DUNG ---\\n${src.text}` });\n  first.parts.push({ text: prompt });\n  const contents = [first];\n  if (mode === 'ask') {\n    contents.push({ role: 'model', parts: [{ text: summary || '' }] });\n    for (const x of qa) if (x.a) contents.push({ role: 'user', parts: [{ text: x.q }] }, { role: 'model', parts: [{ text: x.a }] });\n    contents.push({ role: 'user', parts: [{ text: question + '\\n(Trả lời ngắn gọn, chỉ dựa trên nội dung ở trên. Nếu nội dung không nhắc tới thì nói rõ là không có.)' }] });\n  }\n  return gemini(contents, AI_SYS, { video: src.kind === 'youtube' });\n}\n\n// ---------- Kho ý tưởng ----------\nasync function ideaAdd(item) {\n  const { ideas = [], settings = {} } = await chrome.storage.local.
