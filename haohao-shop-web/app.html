<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HaoHao Store – Mua sắm không mua hớ</title>
<meta name="description" content="HaoHao Store: sản phẩm tuyển chọn trên Shopee & TikTok Shop, giá thật, có lịch sử giá. Cài như app trên điện thoại.">
<meta name="theme-color" content="#FFEBDA">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/shop/logo.webp">
<link rel="apple-touch-icon" href="/shop/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HaoHao">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7F0;--card:#FFFFFF;--ink:#2A1E17;--soft:#5C4A3E;--mute:#6E5C50;--line:#F1E2D4;--acc:#D9480F;--acc2:#B23A0B;--peach:#FFEBDA;--ok:#2E8A5B;--okbg:#E4F4EC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#EFE6DE}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-size:14px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.pad{padding:0 16px}
.sk{background:linear-gradient(90deg,#F6EDE5,#FBF5F0,#F6EDE5);background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
/* thanh trên */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:rgba(255,247,240,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar h1{flex:1;margin:0;font-size:18px;font-weight:800}
.ib{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 2px 8px rgba(120,60,20,.08);flex:none}
/* trang chủ */
.hero{position:relative;padding:calc(30px + env(safe-area-inset-top,0px)) 20px 44px;background:var(--peach);border-radius:0 0 28px 28px;overflow:hidden}
.hero h1{margin:0;font-size:36px;font-weight:800;letter-spacing:-.5px;line-height:1}.hero h1 b{color:var(--acc)}
.hero p{margin:10px 0 0;font-size:14px;line-height:1.45;color:var(--soft);max-width:58%}
.hero img{position:absolute;right:10px;top:calc(8px + env(safe-area-inset-top,0px));width:132px;height:auto;filter:drop-shadow(0 10px 14px rgba(150,70,10,.18))}
.sbox{margin:-26px 16px 0;position:relative;z-index:2;display:flex;align-items:center;gap:8px;background:#fff;border-radius:28px;padding:6px 6px 6px 18px;box-shadow:0 6px 18px rgba(120,60,20,.10)}
.sbox input{flex:1;min-width:0;border:0;outline:none;font:inherit;font-size:15px;color:var(--ink);background:transparent}
.sbtn{width:44px;height:44px;border-radius:22px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 6px;padding:20px 12px 0}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;text-align:center;line-height:1.25}
.cat span{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cat span img{width:46px;height:46px;object-fit:contain}
.sec{padding:22px 16px 0}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}.sh h2{margin:0;font-size:18px;font-weight:700}.sh a{font-size:13px;font-weight:600;color:var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 16px 4px;margin:0 -16px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:18px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--soft);white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
/* lưới sản phẩm */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pc{display:flex;flex-direction:column;background:#fff;border-radius:16px;overflow:hidden;position:relative}
.pc .im{position:relative;aspect-ratio:1/1;background:#F6EDE5}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .off{position:absolute;left:8px;top:8px;padding:3px 7px;border-radius:8px;background:var(--acc);color:#fff;font-size:11px;font-weight:800}
.hrt{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--acc);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.hrt[aria-pressed="true"] svg{fill:currentColor}
.pc .bd{padding:9px 10px 11px;display:flex;flex-direction:column;gap:4px;flex:1}
.pc .nm{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.pr b{color:var(--acc);font-size:15px;font-weight:800}.pr s{color:#A8998D;font-size:12px}
.meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);margin-top:auto}
.plat{display:inline-flex;align-items:center;gap:4px;font-weight:600}.plat i{width:15px;height:15px;border-radius:4px;background:#EE4D2D;color:#fff;font-style:normal;font-size:9px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.empty{padding:40px 20px;text-align:center;color:var(--mute);line-height:1.6}
/* chi tiết */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:#F6EDE5}.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:100%;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:start}
.gwrap{position:relative}.gcnt{position:absolute;right:12px;bottom:12px;padding:3px 9px;border-radius:10px;background:rgba(42,30,23,.6);color:#fff;font-size:12px;font-weight:600}
.gtop{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between}
.dt{padding:16px}
.dt h1{margin:0;font-size:18px;line-height:1.35;font-weight:700}
.dt .pr b{font-size:24px}.dt .pr .pct{padding:2px 7px;border-radius:8px;background:#FDE3D6;color:var(--acc2);font-size:12px;font-weight:800}
.row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.box{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--okbg);color:#1E3A28;font-size:13px;line-height:1.5}.box b{color:var(--ok)}
.box.warn{background:#FFF1CF;color:#5A4300}.box.warn b{color:#A66A00}
.card{margin-top:14px;padding:14px;border-radius:14px;background:#fff;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;flex-wrap:wrap;gap:8px}.opt span{padding:6px 10px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;display:inline-flex;align-items:center;gap:6px;background:#fff}.opt img{width:26px;height:26px;border-radius:6px;object-fit:cover}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:520px;margin:0 auto;display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line)}
.btn{min-height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;padding:0 16px}
.btn.o{border:1.5px solid var(--line);background:#fff}.btn.p{flex:1;background:var(--acc);color:#fff;font-weight:800;font-size:15px}
/* danh mục */
.nc{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px}
.nc .hd{display:flex;align-items:center;gap:12px}.nc .hd span{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}.nc .hd span img{width:42px;height:42px;object-fit:contain}
.nc .hd b{flex:1;font-size:16px}.nc .hd em{font-style:normal;font-size:12px;color:var(--mute)}
.subs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.subs a{padding:7px 12px;border-radius:14px;background:var(--bg);font-size:12.5px;font-weight:600;color:var(--soft)}
/* ưu đãi */
.flash{margin:14px 16px 0;padding:14px;border-radius:18px;background:linear-gradient(120deg,#D9480F,#F08A3C);color:#fff;display:flex;align-items:center;gap:12px}
.flash p{margin:0;font-size:13px;flex:1;line-height:1.4}.flash p b{display:block;font-size:16px}
.clock{display:flex;gap:4px}.clock span{min-width:34px;padding:6px 0;border-radius:8px;background:#2A1E17;text-align:center;font-weight:800;font-size:15px}
/* so sánh */
.cmp{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#fff;border:1.5px solid var(--line)}.cmp.best{border-color:var(--acc)}
.cmp .lg{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:none}
.cmp .tx{flex:1;min-width:0}.cmp .tx b{display:block;font-size:14px}.cmp .tx small{color:var(--mute)}
.tag{padding:2px 8px;border-radius:8px;background:var(--okbg);color:var(--ok);font-size:11px;font-weight:800;margin-left:6px}
.chart{background:#fff;border-radius:14px;padding:14px}
.chart svg{width:100%;height:150px;display:block}
.lgnd{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:6px}
/* cá nhân */
.me{margin:14px 16px 0;padding:18px;border-radius:20px;background:var(--peach);display:flex;align-items:center;gap:14px}.me img{width:64px;height:auto}.me b{font-size:20px}.me p{margin:4px 0 0;color:var(--soft);font-size:13px}
.menu{margin:14px 16px 0;background:#fff;border-radius:18px;overflow:hidden}
.menu a,.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;font-weight:500}
.menu>:last-child{border-bottom:0}.menu .ic{width:32px;height:32px;border-radius:10px;background:#FFF1E6;display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}
.menu .lb{flex:1}.menu .mt{font-size:12px;color:var(--mute)}
.note{margin:16px;font-size:12px;line-height:1.6;color:var(--mute);text-align:center}
.dm{display:flex;min-height:calc(100vh - 160px);border-top:1px solid var(--line)}
.dm-l{width:92px;flex:none;background:#F6EDE5;display:flex;flex-direction:column}
.dm-l a{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;text-align:center;font-size:11.5px;line-height:1.25;font-weight:600;color:var(--soft)}
.dm-l a.on{background:var(--bg);color:var(--acc);font-weight:800}.dm-l a.on::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--acc)}
.dm-l span{width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center}.dm-l img{width:40px;height:40px;object-fit:contain}
.dm-r{flex:1;min-width:0;padding:12px 12px 16px;display:flex;flex-direction:column;gap:14px}
.dm-bn{position:relative;height:104px;border-radius:16px;overflow:hidden;padding:14px;display:flex;flex-direction:column;justify-content:center}.dm-bn b{font-size:17px}.dm-bn span{font-size:12px;margin-top:2px}
.dm-bn em{margin-top:8px;align-self:flex-start;padding:5px 10px;border-radius:12px;background:#fff;color:var(--acc);font-size:11.5px;font-weight:800;font-style:normal}
.dm-bn img{position:absolute;right:-6px;bottom:-10px;width:112px;height:112px;object-fit:contain}
.dm-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}
.dm-g a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;text-align:center;line-height:1.25}
.dm-g img,.dm-g i{width:76px;height:76px;border-radius:38px;object-fit:cover;background:#F6EDE5;border:2px solid #fff;box-shadow:0 4px 10px rgba(120,60,20,.10)}
.dm-hot{padding:12px;border-radius:14px;background:#fff;display:flex;align-items:center;gap:10px;font-size:12.5px}.dm-hot span span{color:var(--mute)}
/* thanh dưới */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;max-width:520px;margin:0 auto;height:calc(66px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mute);font-size:11px;font-weight:500}
.tabs a.on{color:var(--acc);font-weight:700}.tabs a.on svg{fill:currentColor}
.tabs a .bd2{position:relative}.tabs a .cnt{position:absolute;right:-9px;top:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--acc);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;padding:10px 16px;border-radius:20px;background:#2A1E17;color:#fff;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="app" id="app"><div class="hero sk" style="height:180px"></div></div>
<nav class="tabs" id="tabs" aria-label="Điều hướng chính"></nav>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
var API=(/workers\.dev$|(^|\.)haohaostore\.com$/.test(location.hostname)?'':'https://haohaostore.com');
var LOGO=API+'/shop/logo.webp';
var NICHES=[
 {id:'thoi-trang',label:'Thời trang',sub:'Nam · Nữ · Công sở · Thể thao',bg:'#FDE4EA'},
 {id:'me-be',label:'Mẹ & Bé',sub:'Đồ bé · Bỉm sữa · Đồ chơi',bg:'#E4F4EC'},
 {id:'gia-dung',label:'Gia dụng',full:'Nhà cửa & Gia dụng',sub:'Nhà bếp · Đồ điện · Dọn dẹp',bg:'#FFF1CF'},
 {id:'xay-dung',label:'Xây dựng',sub:'Đồ nghề · Bảo hộ · Sửa nhà',bg:'#E2EDFB'},
 {id:'qua-tang',label:'Quà tặng',sub:'Sinh nhật · Bố mẹ · Lễ Tết',bg:'#FDE3D6'}
];
var NI={}; NICHES.forEach(function(n){NI[n.id]=n;});
var IC={
 home:'<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
 grid:'<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
 tag:'<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/></svg>',
 heart:'<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-9-9a4.8 4.8 0 0 1 9-3 4.8 4.8 0 0 1 9 3c-2 4.6-9 9-9 9z"/></svg>',
 heartS:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 20s-7-4.4-9-9a4.8 4.8 0 0 1 9-3 4.8 4.8 0 0 1 9 3c-2 4.6-9 9-9 9z"/></svg>',
 user:'<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
 search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
 back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
 share:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>',
 ext:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>'
};
var app=document.getElementById('app'), tabs=document.getElementById('tabs');
var NEWS=null, D={items:[],groups:[]}, BY={}, READY=false, HH={}, HDAY=0;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function V(n){return Math.round(n).toLocaleString('vi-VN')+'đ';}
function fold(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');}
function pct(x){return x.old>x.price?Math.round((1-x.price/x.old)*100):0;}
function ls(k,v){try{ if(v===undefined){ return JSON.parse(localStorage.getItem('hh_'+k)||'null'); } localStorage.setItem('hh_'+k,JSON.stringify(v)); }catch(e){ return null; }}
var FAV=ls('fav')||{}, SEEN=ls('seen')||[];
function toast(t){var e=document.getElementById('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(function(){e.classList.remove('on');},1800);}
function isFav(id){return !!FAV[id];}
function togFav(id){ var x=BY[id]; if(FAV[id]){ delete FAV[id]; toast('Đã bỏ khỏi Yêu thích'); } else { FAV[id]={p:x?x.price:0,t:Date.now()}; toast('Đã lưu vào Yêu thích ♥'); } ls('fav',FAV); drawTabs(); }
function img(x){return x.img||(x.imgs&&x.imgs[0])||'';}

function card(x){
  var o=pct(x);
  return '<a class="pc" href="#/sp/'+x.id+'"><span class="im"><img src="'+esc(img(x))+'" alt="" loading="lazy">'+(o>=5?'<span class="off">−'+o+'%</span>':'')+
   '<button class="hrt" type="button" data-fav="'+x.id+'" aria-label="Lưu yêu thích" aria-pressed="'+isFav(x.id)+'">'+IC.heartS+'</button></span>'+
   '<span class="bd"><span class="nm">'+esc(x.n)+'</span><span class="pr"><b>'+V(x.price)+'</b>'+(x.old>x.price?'<s>'+V(x.old)+'</s>':'')+'</span>'+
   '<span class="meta"><span class="plat"><i>S</i>Shopee</span>'+(x.rating?'· ★ '+x.rating:'')+(x.soldTxt?' · '+esc(x.soldTxt.replace(' đã bán','')):'')+'</span></span></a>';
}
function grid(list,emptyMsg){ return list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<div class="empty">'+(emptyMsg||'Chưa có sản phẩm.')+'</div>'; }
function skel(){ var s=''; for(var i=0;i<4;i++) s+='<div class="pc"><span class="im sk"></span><span class="bd"><span class="nm sk" style="border-radius:6px"></span></span></div>'; return '<div class="grid">'+s+'</div>'; }
function bar(title,back,right){ return '<div class="bar">'+(back?'<button class="ib" type="button" data-back aria-label="Quay lại">'+IC.back+'</button>':'')+'<h1>'+title+'</h1>'+(right||'')+'</div>'; }

function drawTabs(){

  else if(seg[0]==='danh-muc') html=seg[1]?vNiche(seg[1],seg[2]||'',qs.s||'lq'):vCatList(qs.n||ls('dmn'));

function loadHist(list){
  var ks=[]; list.forEach(function(x){ if(x.shop&&!('sp:'+x.shop+'.'+x.id in HH)) ks.push('sp:'+x.shop+'.'+x.id,'ap:sp:'+x.shop+'.'+x.id); });
  if(!ks.length) return Promise.resolve();
  var parts=[]; for(var i=0;i<ks.length;i+=20) parts.push(ks.slice(i,i+20));
  return Promise.all(parts.map(function(p){ return fetch(API+'/h?k='+encodeURIComponent(p.join(','))).then(function(r){return r.json();}).catch(function(){return null;}); })).then(function(rs){
    var got=false; ks.forEach(function(k){ if(!(k in HH)) HH[k]=null; });
    (rs||[]).forEach(function(r){ if(r&&r.items){ HDAY=r.day||HDAY; for(var k in r.items){ HH[k]=r.items[k]; got=true; } } });
    list.forEach(function(x){ var k='sp:'+x.shop+'.'+x.id, a=HH[k], b=HH['ap:'+k], lw=a&&a.length&&HDAY-a[a.length-1][0]<=2?a[a.length-1]:null, la=b&&b.length&&HDAY-b[b.length-1][0]<=2?b[b.length-1]:null;
      if(lw&&lw[1]>0&&lw[1]<=x.old0){ x.price=lw[1]; if(lw[2]>x.old) x.old=lw[2]; } if(la&&la[1]>0&&la[1]<=x.price) x.app=la[1]; });
    if(got&&list.length===1) route();
  });
}
