<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#23305E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="/ct/icon48.png">
<title>HaoHao – Việc cần làm, Dự án & Công trình</title>
<!-- 🏗️ HaoHao SITE BRAIN trên web / điện thoại.
     V1.3.0 (01/11): đăng nhập Google → sửa được, đồng bộ với HaoHao trên máy tính (sbsync.js, máy chủ /sb).
     Link chia sẻ cũ #<mã> (không đăng nhập) → chỉ xem (/ct).  ?ext=<id tiện ích> → sau khi đăng nhập gửi phiên về HaoHao.
     Dùng chung site.js / site.css / sbsync.js với tiện ích (bản chép ở ct/ – sửa tiện ích thì chép lại). -->
<link rel="stylesheet" href="/ct/site.css">
<style>
  html, body { margin: 0; background: #fff; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: #23305E; }
  .msg { max-width: 440px; margin: 14vh auto 0; padding: 0 22px; text-align: center; }
  .msg .ic { font-size: 60px; line-height: 1; }
  .msg h1 { font-size: 22px; margin: 14px 0 8px; font-weight: 850; }
  .msg p { color: #6B7280; line-height: 1.55; margin: 0 0 18px; font-size: 15px; }
  .msg .gbtn { display: flex; justify-content: center; min-height: 44px; }
  .msg .ok { background: #E6F4EC; color: #2E8B57; border-radius: 12px; padding: 12px 14px; font-weight: 700; margin-top: 8px; }
  .msg .err { background: #FDECE7; color: #C4401F; border-radius: 12px; padding: 10px 14px; margin-top: 12px; font-size: 14px; }
  .msg small { display: block; color: #9AA1B5; margin-top: 18px; font-size: 12.5px; line-height: 1.5; }
  .sbx { padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: max(40px, env(safe-area-inset-bottom)); }
  @media (max-width: 700px) {
    .sbx { padding-left: 12px; padding-right: 12px; }
    .sb-head { gap: 8px; } .sb-brand small { display: none; }
    .sb-sitesel { order: 5; flex: 1 1 100%; max-width: none; }
    .sb-tabs { margin-left: -12px; margin-right: -12px; border-radius: 0; padding: 4px 8px; }
    .sb-tab { padding: 8px 11px; font-size: 13px; }
    .sb-ring { width: 96px; height: 96px; } .sb-ring b { font-size: 22px; }
    .sb-hero { flex-direction: row; align-items: center; gap: 12px; } .sb-hero h1 { font-size: 19px; }
    .sb-card { padding: 14px; border-radius: 14px; }
    .sb-sech h2 { font-size: 18px; } .sb-sech span { min-width: 0; }
    .sb-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .sb-t { min-width: 640px; font-size: 13px; }
    .sb-head .sb-btn.sm { padding: 7px 10px; }
    .sb-in { font-size: 16px; }   /* iPhone không tự phóng to khi gõ */
  }
  /* ☑️ V1.4.0: thanh chuyển trang + Việc cần làm */
  body.has-nav { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
  .hh-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: grid; grid-template-columns: 1fr 1fr 1fr; background: #fff; border-top: 1px solid #E5E7EB; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 16px rgba(35,48,94,.08); }
  .hh-nav[hidden] { display: none; }
  .hh-nav button { all: unset; cursor: pointer; text-align: center; padding: 10px 6px; border-radius: 12px; font-weight: 800; font-size: 14px; color: #6B7280; }
  .hh-nav button.on { background: #23305E; color: #fff; }
  #proj[hidden], #todo[hidden], #shared[hidden] { display: none; }
  #todo, #proj, #shared { max-width: 720px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 14px 24px; color: #23305E; }
  .td-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 4px 0 12px; }
  .td-head h1 { font-size: 22px; margin: 0; font-weight: 850; }
  .td-status { font-size: 12px; color: #6B7280; } .td-status.bad { color: #C4401F; }
  .td-add { background: #F6F7F9; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .td-row { display: flex; gap: 8px; align-items: center; }
  .td-in { font: inherit; font-size: 16px; color: #23305E; border: 1.5px solid #E5E7EB; border-radius: 12px; padding: 10px 12px; background: #fff; min-width: 0; flex: 1; box-sizing: border-box; }
  .td-in:focus { outline: 0; border-color: #E08A00; }
  .td-dt { flex: none; width: 100%; }
  .td-btn { all: unset; cursor: pointer; background: #23305E; color: #fff; font-weight: 800; padding: 10px 16px; border-radius: 12px; font-size: 15px; text-align: center; }
  .td-btn.sm { padding: 7px 12px; font-size: 13px; } .td-btn.ghost { background: #fff; color: #23305E; box-shadow: inset 0 0 0 1.5px #E5E7EB; } .td-btn.danger { background: #fff; color: #C4401F; box-shadow: inset 0 0 0 1.5px #F2B8A6; } .td-btn.arm { background: #C4401F; color: #fff; }
  .td-star { all: unset; cursor: pointer; font-size: 22px; padding: 4px 6px; }
  .td-quick { display: flex; gap: 6px; flex-wrap: wrap; }
  .td-chip { all: unset; cursor: pointer; font-size: 13px; font-weight: 700; padding: 6px 11px; border-radius: 99px; background: #fff; color: #23305E; box-shadow: inset 0 0 0 1px #E5E7EB; }
  .td-grp { margin-bottom: 14px; } .td-grp h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #6B7280; margin: 0 0 6px 4px; }
  .td-grp.late h3 { color: #C4401F; }
  .td-list { list-style: none; margin: 0; padding: 0; background: #fff; border: 1px solid #E5E7EB; border-radius: 14px; overflow: hidden; }
  .td-it { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-top: 1px solid #F0F1F4; }
  .td-it:first-child { border-top: 0; }
  .td-ck { width: 22px; height: 22px; accent-color: #2E8B57; margin-top: 1px; flex: none; }
  .td-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
  .td-tx { font-size: 15.5px; line-height: 1.4; word-break: break-word; }
  .td-due { font-size: 12.5px; color: #6B7280; font-weight: 600; }
  .td-it.late .td-due { color: #C4401F; } .td-it.star .td-tx { font-weight: 700; }
  .td-it.done .td-tx { text-decoration: line-through; color: #9AA1B5; }
  .td-it.off .td-tx { color: #9AA1B5; }
  .td-sw { width: 40px; height: 22px; accent-color: #2E8B57; flex: none; }
  .td-x { all: unset; cursor: pointer; color: #9AA1B5; padding: 2px 6px; border-radius: 6px; font-size: 13px; } .td-x.arm { background: #C4401F; color: #fff; }
  .td-none, .td-empty { color: #9AA1B5; text-align: center; padding: 18px; font-size: 14px; }
  .td-more { all: unset; cursor: pointer; color: #6B7280; font-weight: 700; font-size: 13px; padding: 4px 6px; margin-bottom: 12px; display: inline-block; }
  .td-radd { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; background: #F6F7F9; border-radius: 14px; padding: 10px; }
  .td-radd .td-row .td-in { flex: 1; }
  .td-foot { color: #9AA1B5; font-size: 12.5px; text-align: center; line-height: 1.5; margin-top: 18px; }
  .td-toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px); background: #23305E; color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; opacity: 0; transition: .2s; z-index: 60; pointer-events: none; max-width: calc(100vw - 32px); }
  .td-toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<section class="sbx" id="site"></section>
<section id="todo" hidden></section>
<section id="proj" hidden></section>
<section id="shared" hidden></section>
<nav class="hh-nav" id="hhnav" hidden aria-label="Chọn trang"><button type="button" data-v="todo">☑️ Việc cần làm</button><button type="button" data-v="pj">📋 Dự án</button><button type="button" data-v="ct">🏗️ Công trình</button></nav>
<script src="/ct/sbsync.js"></script>
<script>
(async () => {
  const GID = '887723128133-u9anir3ppp3l41ciganrasr7bf43v265.apps.googleusercontent.com';
  const root = document.getElementById('site'), Q = new URLSearchParams(location.search), EXT = (Q.get('ext') || '').replace(/[^a-p]/g, '');
  const ls = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } } };
  const el = (h) => { const d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild; };
  const screen = (ic, title, text) => { root.className = ''; root.innerHTML = ''; const d = el('<div class="msg"><div class="ic"></div><h1></h1><p></p></div>'); d.querySelector('.ic').textContent = ic; d.querySelector('h1').textContent = title; d.querySelector('p').textContent = text; root.append(d); return d; };
  const loadScript = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = ok; s.onerror = no; document.head.append(s); });

  // ---------- đăng nhập Google ----------
  async function signIn(note) {
    const d = screen('🏗️', 'Công trình – HaoHao', EXT ? 'Đăng nhập Google để HaoHao trên máy tính lưu dữ liệu Công trình theo tài khoản của anh.' : (GO ? 'Đăng nhập bằng Gmail đã được chia sẻ để xem và nhập Kế hoạch, Báo cáo công trình.' : 'Đăng nhập bằng tài khoản Google đã dùng trên HaoHao máy tính để xem và sửa công trình ở đây. Được người khác chia sẻ công trình thì đăng nhập Gmail đã được chia sẻ.'));
    const box = el('<div class="gbtn"></div>'); d.append(box);
    if (note) d.append(Object.assign(el('<div class="err"></div>'), { textContent: note }));
    d.append(Object.assign(el('<small></small>'), { textContent: 'Dữ liệu lưu trên máy chủ HaoHao theo tài khoản Google của anh. HaoHao chỉ đọc địa chỉ email để nhận ra anh.' }));
    try { await loadScript('https://accounts.google.com/gsi/client'); } catch { box.textContent = '⚠ Không tải được nút Google – kiểm tra mạng rồi tải lại trang.'; return; }
    google.accounts.id.initialize({ client_id: GID, ux_mode: 'popup', auto_select: false, callback: async res => {
      box.innerHTML = '⏳ Đang đăng nhập…';
      const r = await fetch('/sb/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id_token: res.credential }) }).then(x => x.json()).catch(() => ({ ok: false, error: 'mất mạng' }));
      if (!r.ok) return signIn('Đăng nhập lỗi: ' + (r.error || 'không rõ'));
      ls.set('sbAuth', { token: r.token, email: r.email, name: r.name || '' });
      if (EXT) return linkExt(r);
      start();
    } });
    google.accounts.id.renderButton(box, { theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', locale: 'vi', width: 280 });
  }
  async function linkExt(r) {
    const d = screen('🔗', 'Đang kết nối HaoHao…', r.email);
    let ok = false;
    try { ok = await new Promise(res => { chrome.runtime.sendMessage(EXT, { type: 'sb-login', token: r.token, email: r.email, name: r.name || '' }, x => res(!chrome.runtime.lastError && x && x.ok)); setTimeout(() => res(false), 20000); }); } catch {}
    const m = el('<div></div>'); m.className = ok ? 'ok' : 'err';
    m.textContent = ok ? '✅ HaoHao đã đăng nhập ' + r.email + ' và đồng bộ xong. Đóng tab này, quay lại trang Công trình.' : '⚠ Không gửi được phiên về HaoHao. Bấm F5 ở chrome://extensions → ↻ HaoHao rồi đăng nhập lại.';
    d.append(m);
    if (ok) setTimeout(() => { try { window.close(); } catch {} }, 2500);
  }

  // ---------- chế độ chỉ xem (link chia sẻ cũ #mã) ----------
  async function share(id) {
    let r; try { r = await fetch('/ct?id=' + id, { cache: 'no-store' }).then(x => x.json()); } catch { r = { ok: false, error: 'Không có mạng' }; }
    if (!r || !r.ok || !r.v) return signIn('Link xem này không còn dữ liệu – đăng nhập Google để xem bản đầy đủ.');
    boot(r.v, { ro: { at: r.at } });
  }

  // ---------- chế độ đăng nhập: sửa được + đồng bộ ----------
  let doc = null, listeners = [], eng = null, docKey = '';
  const keyOf = a => 'sbDoc:' + a.email, baseOf = a => 'sbBase:' + a.email;
  const GO = Q.get('g') ? String(Q.get('g')).toLowerCase() : '', GS = Q.get('s') || '';   // 👥 V1.6.0: ?g=<gmail chủ>&s=<mã công trình> = trang người được chia sẻ
  async function start() {
    const a = ls.get('sbAuth'); if (!a || !a.token) return signIn();
    if (GO && GS) return startGuest(a);
    docKey = keyOf(a); doc = ls.get(docKey) || null;
    const st = { email: a.email, token: a.token, at: 0, err: '' };
    window.SB_AUTH = st;
    eng = SBSync({ api: location.origin, token: async () => st.token,
      getLocal: async () => doc, setLocal: async v => { doc = v; ls.set(keyOf(a), v); listeners.forEach(f => f({ siteBrain: { newValue: v } }, 'local')); },
      getBase: async () => ls.get(baseOf(a)), setBase: async v => { if (!ls.set(baseOf(a), v)) ls.set(baseOf(a), null); } });
    const sync = async () => { const r = await eng.sync(); if (r.ok) { st.at = Date.now(); st.err = ''; } else { st.err = r.err; if (r.auth === false) { ls.set('sbAuth', null); return signIn('Phiên đăng nhập hết hạn – đăng nhập lại.'); } } return r; };
    window.SB_SYNC_NOW = sync;
    let t = 0; window.SB_SYNC_SOON = () => { clearTimeout(t); t = setTimeout(sync, 1200); };
    window.SB_LOGOUT = () => { fetch('/sb/logout', { method: 'POST', headers: { authorization: 'Bearer ' + st.token } }).catch(() => {}); ls.set('sbAuth', null); location.hash = ''; location.reload(); };
    if (!doc) { screen('☁️', 'Đang tải dữ liệu…', a.email); const r = await sync(); if (!r || !r.ok) { if (!ls.get('sbAuth')) return; return screen('⚠️', 'Chưa tải được dữ liệu', (r && r.err) || 'Lỗi mạng – kéo xuống để tải lại.'); } if (!doc) doc = { sites: [], cur: null }; }
    else sync();
    // ☑️ V1.4.0: 2 trang – Việc cần làm · Công trình
    const nav = document.getElementById('hhnav'), tdEl = document.getElementById('todo'), pjEl = document.getElementById('proj'), shEl = document.getElementById('shared'); let booted = false, tdOn = false, pjOn = false;
    const show = v => { try { localStorage.setItem('hhView', v); } catch {} nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); root.hidden = v !== 'ct'; tdEl.hidden = v !== 'todo'; pjEl.hidden = v !== 'pj'; shEl.hidden = v !== 'sh';
      if (v === 'pj' && !pjOn) { pjOn = true; loadScript('/ct/proj.js').then(() => HHProj.mount(pjEl, { email: st.email, token: st.token })).catch(() => { pjEl.textContent = '⚠ Không tải được trang Dự án – kiểm tra mạng.'; }); } window.scrollTo(0, 0);
      if (v === 'ct' && !booted) { booted = true; boot(doc, { web: true }); }
      if (v === 'todo' && !tdOn) { tdOn = true; loadScript('/ct/todo.js').then(() => HHTodo.mount(tdEl, { email: st.email, token: st.token })).catch(() => { tdEl.textContent = '⚠ Không tải được trang Việc cần làm – kiểm tra mạng.'; }); } };
    nav.hidden = false; document.body.classList.add('has-nav'); nav.addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(b.dataset.v); });
    let v0 = 'todo'; try { v0 = localStorage.getItem('hhView') || 'todo'; } catch {} show(['ct', 'pj'].includes(v0) ? v0 : 'todo');
    // 👥 V1.6.0: công trình người khác chia sẻ cho mình → thêm nút "👥 Được chia sẻ"
    fetch('/sb/shared', { headers: { authorization: 'Bearer ' + st.token }, cache: 'no-store' }).then(r => r.json()).then(r => {
      if (!r || !r.ok || !r.list || !r.list.length) return;
      const b = document.createElement('button'); b.type = 'button'; b.dataset.v = 'sh'; b.textContent = '👥 Được chia sẻ'; nav.append(b); nav.style.gridTemplateColumns = 'repeat(4, 1fr)';
      shEl.innerHTML = '<div class="td-head"><h1>👥 Được chia sẻ</h1></div><p class="td-foot" style="text-align:left;margin:0 0 12px">Công trình người khác chia sẻ cho ' + st.email.replace(/[<>&"]/g, '') + ' – xem và nhập Kế hoạch, Báo cáo.</p>';
      const ul = document.createElement('ul'); ul.className = 'td-list';
      r.list.forEach(x => { const li = document.createElement('li'); li.className = 'td-it'; const a2 = document.createElement('a'); a2.className = 'td-body'; a2.style.textDecoration = 'none'; a2.style.color = 'inherit';
        a2.href = '/cong-trinh?g=' + encodeURIComponent(x.o) + '&s=' + encodeURIComponent(x.s);
        const t = document.createElement('div'); t.className = 'td-tx'; t.textContent = '🏗️ ' + (x.code ? x.code + ' · ' : '') + x.name; const d = document.createElement('div'); d.className = 'td-due'; d.textContent = 'Chia sẻ bởi ' + x.o; a2.append(t, d); li.append(a2); ul.append(li); });
      shEl.append(ul);
      if (!(doc && doc.sites && doc.sites.length) && v0 !== 'pj') show('sh');
    }).catch(() => {});
    setInterval(() => { if (!document.hidden) sync(); }, 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
  }

  // ---------- 👥 V1.6.0: trang người được chia sẻ (Gmail khác) – 1 công trình, Kế hoạch + Báo cáo ----------
  async function startGuest(a) {
    docKey = 'sbG:' + a.email + ':' + GO + ':' + GS; const bk = 'sbGB:' + a.email + ':' + GO + ':' + GS;
    doc = ls.get(docKey) || null;
    const st = { email: a.email, token: a.token, at: 0, err: '' };
    window.SB_AUTH = st; window.SB_GUEST = { o: GO, s: GS, email: a.email };
    eng = SBSync({ api: location.origin, path: '/sb?ns=g&o=' + encodeURIComponent(GO) + '&s=' + encodeURIComponent(GS), token: async () => st.token,
      getLocal: async () => doc, setLocal: async v => { doc = v; ls.set(docKey, v); listeners.forEach(f => f({ siteBrain: { newValue: v } }, 'local')); },
      getBase: async () => ls.get(bk), setBase: async v => { if (!ls.set(bk, v)) ls.set(bk, null); } });
    let gone = false, booted = false;
    const sync = async () => { if (gone) return { ok: false, err: 'hết quyền' }; let r = await eng.sync();
      if (!r.ok && /chưa chia sẻ|cắt quyền|không còn/.test(r.err || '')) { gone = true; ls.set(docKey, null); ls.set(bk, null); if (booted) { location.reload(); return r; } screen('🔒', 'Không còn quyền xem công trình này', (r.err || '') + ' – nhắn người chia sẻ để được mở lại.'); return r; }
      if (r.ok) { st.at = Date.now(); st.err = ''; } else { st.err = r.err; if (r.auth === false) { ls.set('sbAuth', null); return signIn('Phiên đăng nhập hết hạn – đăng nhập lại.'); } } return r; };
    window.SB_SYNC_NOW = sync;
    let t = 0; window.SB_SYNC_SOON = () => { clearTimeout(t); t = setTimeout(sync, 1200); };
    window.SB_LOGOUT = () => { fetch('/sb/logout', { method: 'POST', headers: { authorization: 'Bearer ' + st.token } }).catch(() => {}); ls.set('sbAuth', null); location.href = '/cong-trinh'; };
    if (!doc) { screen('☁️', 'Đang tải công trình được chia sẻ…', a.email); const r = await sync(); if (gone) return; if (!r || !r.ok || !doc) return screen('⚠️', 'Chưa tải được công trình', (r && r.err) || 'Lỗi mạng – tải lại trang.'); }
    else sync();
    document.title = 'Công trình được chia sẻ – HaoHao';
    booted = true; boot(doc, { web: true });
    setInterval(() => { if (!document.hidden) sync(); }, 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
  }

  // ---------- nạp site.js (bản tiện ích) với chrome.* giả lập ----------
  function boot(snap, o) {
    if (o.ro) window.SB_RO = o.ro; if (o.web) window.SB_WEB = true;
    window.SB_ICON = '/ct/icon48.png'; window.SB_API = location.origin; window.HT = {};
    const mem = { todos: [], siteBot: {}, siteMobile: {} };
    window.chrome = {
      storage: { local: {
        get: async k => { const all = { ...mem, siteBrain: o.web ? doc : snap }; if (typeof k === 'string') return { [k]: all[k] }; if (Array.isArray(k)) return Object.fromEntries(k.map(x => [x, all[x]])); return all; },
        set: async v => { for (const k in v) { if (k === 'siteBrain' && o.web) { doc = v[k]; if (docKey) ls.set(docKey, doc); } else mem[k] = v[k]; } } },
        onChanged: { addListener: f => listeners.push(f) } },
      runtime: { id: '', sendMessage: async () => ({ ok: false }) },
      tabs: { create: async x => { window.open(x.url, '_blank', 'noopener'); } },
      extension: { isAllowedFileSchemeAccess: cb => cb(false) }
    };
    root.className = 'sbx'; root.innerHTML = '';
    const s = document.createElement('script'); s.src = '/ct/site.js'; document.body.append(s);
  }

  const shareId = (location.hash.match(/^#([a-z0-9]{20,40})$/) || [])[1];
  if (EXT) return signIn();   // đăng nhập cho HaoHao máy tính: luôn hỏi tài khoản
  if (ls.get('sbAuth')) return start();
  if (shareId) return share(shareId);
  signIn();
})();
</script>
</body>
