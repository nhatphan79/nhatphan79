</style></head><body>
<title>HaoHao Store</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,600&display=swap">
<style>
/* Layout: one header, then either the 3D showroom (home) or a niche landing page, switched by #hash */
:root{
  --cream:#FFF8EF; --cream-2:#FFF3E4; --glow:#FFE3C4; --ink:#3A2414; --ink-soft:#7A5A44;
  --orange:#E8760C; --orange-deep:#C25E0A; --white:#FFFFFF; --dark:#1E1A17; --good:#1F7A4A; --good-bg:#E7F5EC;
  --sale:#D9480F;
  --f-display:'Playfair Display', Georgia, 'Times New Roman', serif;
  --f-body:'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
a{color:var(--orange-deep)}
a:focus-visible,button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--cream)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,248,239,.92);backdrop-filter:blur(8px)}
.top .wrap{display:flex;align-items:center;justify-content:flex-start;gap:12px 24px;flex-wrap:wrap;padding-block:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px;letter-spacing:-.5px;text-decoration:none;color:var(--ink)}
.logo img{width:40px;height:auto;display:block}
.logo b{color:var(--orange)}
/* 20/10: kiểu cũ (khung bo tròn) nhưng 1 hàng cạnh logo */
.nav{display:flex;flex-wrap:nowrap;gap:2px;padding:6px;border-radius:30px;background:rgba(255,255,255,.85);box-shadow:0 8px 24px rgba(194,94,10,.08);max-width:100%;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:22px;font-size:13px;font-weight:800;letter-spacing:.5px;text-decoration:none;color:var(--ink);white-space:nowrap;flex:0 0 auto}
.nav a:hover{background:#FFEBD6}
.nav a.on{background:#FFEBD6;box-shadow:inset 0 0 0 2px var(--orange)}
.nav a.sale{background:var(--orange);color:var(--white)}
.nav a.hh{color:#E8760C;font-weight:800}.nav a.hh img{display:block}
.search{position:relative;display:flex;align-items:center;gap:8px;width:230px;height:42px;padding:0 14px;border:1px solid #D9CBBE;border-radius:8px;background:var(--white);color:#6B5D53}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-size:14px;color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.top-r{display:flex;align-items:center;gap:8px}
.arr{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:6px;border:0;background:#C8102E;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.2);z-index:2}
.arr.l{left:max(12px, env(safe-area-inset-left, 0px))}
.arr.r{right:max(12px, env(safe-area-inset-right, 0px))}
.modes{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}
.mode{border:0;background:transparent;padding:6px 0;font-family:var(--f-display);font-size:clamp(24px,3vw,34px);font-weight:400;color:var(--dark);cursor:pointer}
.mode.on{font-weight:700}
.modes i{width:2px;height:30px;background:var(--dark)}
.subtabs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.float-hh{position:fixed;right:calc(20px + env(safe-area-inset-right, 0px));bottom:calc(20px + env(safe-area-inset-bottom, 0px));z-index:25;width:72px;height:72px;border-radius:36px;background:var(--cream-2);box-shadow:0 10px 26px rgba(160,80,20,.3);display:flex;align-items:center;justify-content:center}
.float-hh img{width:56px;height:auto;animation:bob 3.4s ease-in-out infinite}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{height:44px;padding:0 18px;border-radius:22px;border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.chip.on{background:#F59A5C;border-color:#F59A5C;color:var(--dark)}
.icon-btn{width:46px;height:46px;border-radius:23px;border:0;background:var(--ink);color:var(--cream-2);display:flex;align-items:center;justify-content:center;text-decoration:none}

/* home showroom */
.show{position:relative;overflow:hidden;min-height:calc(100vh - 80px);min-height:calc(100dvh - 80px);background:radial-gradient(ellipse 65% 60% at 55% 72%, var(--glow) 0%, var(--cream-2) 55%, var(--cream) 100%)}
.show-in{position:relative;max-width:1440px;margin:0 auto;min-height:inherit;display:flex;flex-direction:column}

.show-head h1{margin:10px 0 0;font-family:'Montserrat',Arial,sans-serif;font-size:clamp(30px,4.4vw,52px);line-height:1.1;font-weight:800;letter-spacing:-.5px;text-wrap:balance}

.dot-f{position:absolute;border-radius:50%;animation:float 6s ease-in-out infinite}
.stage{position:relative;flex:1;min-height:500px}
.mascot{position:absolute;left:4%;bottom:70px;width:280px;z-index:6}
.mascot img{width:260px;height:auto;display:block;margin-left:10px;filter:drop-shadow(0 18px 24px rgba(160,80,20,.25));animation:bob 3.4s ease-in-out infinite;position:relative}

.bubble{position:absolute;left:150px;top:-36px;padding:12px 18px;border-radius:20px 20px 20px 4px;background:var(--white);box-shadow:0 12px 30px rgba(194,94,10,.18);font-weight:700;white-space:nowrap}

.cw{position:absolute;left:-165px;top:10px;width:330px;height:430px;transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .7s;will-change:transform}
.card{position:relative;width:100%;height:100%;box-sizing:border-box;border:0;border-radius:30px;font:inherit;color:var(--ink);text-decoration:none;cursor:pointer;display:flex;flex-direction:column;padding:26px}

.card .tag{padding:5px 10px;border-radius:12px;background:var(--white);font-size:12px;font-weight:700;color:var(--good)}
.card .name{font-family:'Montserrat',Arial,sans-serif;font-size:30px;font-weight:800;line-height:1.1;display:block}
.card .sub{font-size:13px;color:#6B4E38}
.card .go{width:54px;height:54px;border-radius:27px;background:var(--orange);color:var(--white);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 10px 20px rgba(232,118,12,.35)}
.ctrl{position:absolute;left:12%;right:0;bottom:20px;display:flex;justify-content:center;align-items:center;gap:14px;z-index:4}
.round{width:48px;height:48px;border-radius:24px;border:0;background:var(--white);box-shadow:0 8px 20px rgba(160,80,20,.15);color:var(--orange-deep);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pip{width:12px;height:12px;border-radius:6px;border:0;padding:0;cursor:pointer;background:#F3D3B0;transition:width .3s}

.note{max-width:820px;margin:0 auto;line-height:1.6;padding:10px 16px 16px;text-align:center;font-size:12px;color:#8A6A52;position:relative;z-index:3}

/* niche page */

.n-hero{transition:background-color .8s ease,color .8s ease}.hcont{position:static}.hcont .n-text{animation:hfade .7s ease both}@keyframes hfade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hcont .arr,.hcont .n-dots{z-index:3}

@media (max-width:760px){.hv-shade{background:rgba(24,14,8,.55)}}
.n-hero .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:40px;padding-block:48px 84px}
.n-text{flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:16px}

.btn{height:54px;padding:0 28px;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;text-decoration:none;display:flex;align-items:center;border:2px solid transparent}

.n-art{flex:1 1 320px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:500px}

.trust{border-bottom:1px solid #EEE6DF;background:var(--white)}

.sl-h{margin:0 0 14px;font-family:'Playfair Display',Georgia,serif;font-size:34px;font-weight:700}.sl-h i{font-weight:600;color:var(--sale)}.sl-kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.sl-k{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 8px 14px;border-radius:16px;border:2px solid transparent;font:inherit;font-size:14px;font-weight:700;color:var(--dark);cursor:pointer}.sl-k.on{border-color:var(--dark)}.sl-wrap{margin-top:40px;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}.sl-f{flex:1 1 240px;max-width:100%;display:flex;flex-direction:column;gap:22px;padding:20px;border:1px solid #EEE6DF;border-radius:18px}.sl-fh{display:flex;align-items:center;justify-content:space-between}.sl-fh h2{margin:0;font-size:16px;font-weight:800;text-transform:uppercase}.sl-fh button{height:36px;padding:0 8px;border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:#B23A0B;cursor:pointer}.sl-f fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}.sl-f legend{font-size:14px;font-weight:700;margin-bottom:8px}.sl-f label{display:flex;align-items:center;gap:10px;min-height:32px;font-size:14px;cursor:pointer}.sl-f input{width:18px;height:18px;accent-color:var(--sale)}.sl-good{align-items:flex-start!important;padding:12px;border-radius:12px;background:var(--good-bg);color:#1D4D33}.sl-good input{accent-color:var(--good)!important;margin-top:2px}.sl-good small{font-size:13px}.sl-r{flex:999 1 560px;min-width:0}.sl-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.sl-top p{margin:0;font-size:14px;color:#6B5D53}.sl-top b{color:var(--dark)}.sl-sort{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}.sl-sort select{height:44px;padding:0 12px;border:1.5px solid var(--dark);background:#fff;font:inherit;font-size:14px}.sl-grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))!important}
.sec{margin-top:52px}
.sec-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.sec h2{margin:0;font-family:var(--f-display);font-size:clamp(26px,3.4vw,36px);font-weight:700}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.cat{position:relative;height:220px;border-radius:16px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--dark)}

.tab.on{background:var(--dark);color:var(--white)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 16px}

.catbar .cl{font-size:14px;font-weight:600;white-space:nowrap}.catbar a:hover .ci{transform:translateY(-3px);box-shadow:inset 0 0 0 2px #1E1A17}.catbar a:hover .cl{color:#C8102E}

.promo{position:relative;display:block;color:inherit;aspect-ratio:1005/318;border-radius:4px;overflow:hidden;text-decoration:none}.promo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pr-art{position:absolute;top:9%;bottom:9%;right:5%;width:50%;display:flex;gap:3%}.pr-it{flex:1 1 0;min-width:0;border-radius:8px;overflow:hidden;background:#fff;display:flex;flex-direction:column;text-decoration:none;color:#1E1A17;box-shadow:0 10px 24px rgba(0,0,0,.10);transition:transform .2s}.pr-it:hover{transform:translateY(-3px)}.pr-it .im{flex:1 1 auto;min-height:0;display:grid;place-items:center;overflow:hidden}.pr-it .im img{position:static;width:100%;height:100%;object-fit:cover}.pr-it .im svg{width:60%;height:auto}.pr-it .tx{padding:8px 10px;display:flex;flex-direction:column;gap:2px}.pr-it .tx span{font-size:12px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pr-it .tx b{font-size:15px;line-height:20px;color:#D9480F}
.bst-h{display:grid!important;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.bst-h>a{justify-self:end}.theme a{text-decoration:none}.bst-g{display:flex;align-items:center;gap:18px}.bst-g button{border:0;background:none;padding:0;font:inherit;font-size:18px;color:#8A7B70;cursor:pointer}.bst-g button.on{font-weight:700;color:#1E1A17}.bst-g i{width:1.5px;height:22px;background:#1E1A17}

.pr-tk{position:relative;margin-top:clamp(8px,1.4vw,18px);width:clamp(130px,21vw,268px);padding:clamp(6px,1.2vw,16px) 0 clamp(4px,1vw,12px);border-radius:10px;background:linear-gradient(180deg,#DE1A12,#B30C0A);color:#FFF4DC;text-align:center;box-shadow:0 12px 26px rgba(150,10,8,.35)}
.pr-tk em{position:absolute;top:50%;margin-top:-12px;width:24px;height:24px;border-radius:50%}.pr-tk small{display:block;font-size:clamp(11px,1.6vw,21px);font-weight:500;letter-spacing:1px}.pr-tk strong{display:block;font-size:clamp(42px,7vw,88px);font-weight:900;line-height:.95;letter-spacing:-.04em}.pr-tk sup{font-size:.66em;vertical-align:baseline;letter-spacing:0}
.pr-go{margin-top:clamp(12px,3vw,40px);padding:7px 18px;border-radius:12px;background:#FFF4DC;color:#B30C0A;font-size:clamp(12px,1.5vw,19px);font-weight:900;box-shadow:0 3px 0 rgba(120,10,8,.25)}
.bst{position:relative;margin-top:32px}.bst-h{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.bst-h h2{margin:0;font-family:inherit;font-size:22px;font-weight:700;color:#1E1A17}.bst-h a{height:28px;padding:0 14px;border-radius:6px;background:#B30C0A;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;text-decoration:none;white-space:nowrap}

.th-add{margin-top:40px;display:flex;align-items:center;gap:14px;padding:22px;border:2px dashed #D9CFC6;border-radius:14px;justify-content:center}.th-add button{background:#B30C0A;border-color:#B30C0A;color:#fff;height:44px;padding:0 22px;font-size:15px}.th-add span{font-size:13px;color:#8A7B70}
.thf-wrap{position:fixed;inset:0;z-index:100;background:rgba(20,14,10,.5);display:grid;place-items:center;padding:16px}

.pd5-bar .c{padding:8px 18px;border-right:1px solid #E5E5E5;align-self:stretch;display:flex;flex-direction:column;justify-content:center}.pd5-bar .c:last-child{border:0;margin-left:auto}
.pd5-bar .pi{flex-direction:row!important;justify-content:flex-start!important;gap:12px;align-items:center;padding-left:0;max-width:320px}.pd5-bar .pi img{width:56px;height:56px;flex:none;object-fit:cover;background:#F5F5F5;border-radius:4px}.pd5-bar .pi div{font-size:12px;line-height:16px;min-width:0}.pd5-bar .pi .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pd5-bar .pi s{font-size:11px;color:#909195;margin-right:4px}.pd5-bar .pi b{font-size:16px;color:#AD0000}
.pd5-bar .t{font-size:13px;margin-bottom:8px}.pd5-bar .t b{font-weight:700}
.pd5-bar .pd5-cl,.pd5-bar .pd5-sz{margin-top:0;gap:8px;flex-wrap:nowrap}.pd5-bar .t{margin-bottom:6px}.pd5-bar .pd5-sz button{min-width:44px}
.pd5-bar .bar-app{flex:none;min-width:max-content;box-sizing:border-box;height:48px;padding:0 14px 0 6px;border:1px solid #F1C9CB;border-radius:8px;background:#FFF5F5;display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;font:inherit;text-align:left}.pd5-bar .bar-app img{width:36px;height:36px;object-fit:contain}.pd5-bar .bar-app>span{display:flex;flex-direction:column;line-height:18px}.pd5-bar .bar-app>span>span{font-size:12px;color:#4A4A4A}.pd5-bar .bar-app>span>span b{font-size:14px;color:#AD0000}.pd5-bar .bar-app .r{font-size:13px;color:#BF272D}

.pd5-bar .pd5-buy{margin-top:0}.pd5-bar .pd5-buy a{flex:none;padding:0 22px}

var PRDB=null, prodHook=null;
function catIndexOf(n,p){ for(var i=0;i<n.cats.length;i++){ if(n.cats[i][1]===p.shape) return i; } return -1; }
function productsOf(n,ci){
  var seen={}, out=[], lab=n.cats[ci][0];
  (PRDB||[]).filter(function(d){return d.niche===n.id&&d.cat===lab;}).sort(function(a,b){return (b.order||0)-(a.order||0);}).forEach(function(d){
    var c=n.cats[ci]; out.push({id:d.id,n:String(d.n||''),price:+d.price||0,old:+d.old||+d.price||0,plat:d.plat===TT?TT:SP,link:d.link||'',img:d.img||'',good:!!d.good,shape:c[1],tint:c[2],ink:c[3],sw:[],sold:+d.sold||0,cat:lab,order:d.order||0,mine:true}); seen[String(d.n)]=1; });
  var pool=[]; n.tabs.forEach(function(t){pool=pool.concat(t[1]);}); pool=pool.concat(n.deals||[]);
  pool.forEach(function(p){ if(!seen[p.n]&&(p.kc!=null?p.kc===lab:p.cat!=null?p.cat===lab:catIndexOf(n,p)===ci)){ seen[p.n]=1; out.push(Object.assign({sold:1200,rating:'4.8'},p)); } });
  return out;
}
function mineAll(n){ var o=[]; n.cats.forEach(function(c,ci){ o=o.concat(productsOf(n,ci).filter(function(p){return p.mine;})); }); return o; }
function parseVnd(v){ v=String(v||'').toLowerCase().replace(/\s/g,''); var kk=/k$/.test(v); var x=parseFloat(v.replace(/[^0-9.,]/g,'').replace(/[.,](?=\d{3}\b)/g,'').replace(',','.'))||0; if(kk||x<10000) x=x*1000; return Math.round(x); }

function findProd(id){ return (PRDB||[]).filter(function(d){return d.id===id;})[0]; }
