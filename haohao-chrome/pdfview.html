<!doctype html>

<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📄 HaoHao PDF</title>
<style>
  :root { --bg: #3C3F43; --bar: #24262A; --tx: #F1F3F4; --mu: #B8BCC2; --ac: #2F9E7E; --ai: #D98E1F; --line: #44484D; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--tx); font: 14px/1.4 "Segoe UI", Roboto, Arial, sans-serif; }
  #bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--bar); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #bar .nm { font-weight: 700; max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bar .st { color: var(--mu); flex: 1 1 220px; min-width: 0; }
  #bar .eng { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--ac); color: #fff; }
  #bar .eng.ai { background: var(--ai); }
  #bar button { font: inherit; font-size: 13px; color: var(--tx); background: #3A3D42; border: 1px solid #55595F; border-radius: 8px; padding: 5px 11px; cursor: pointer; }
  #bar button:hover { background: #474B51; }
  #bar button:focus-visible { outline: 2px solid #8AB4F8; outline-offset: 1px; }
  #bar .zm { display: flex; align-items: center; gap: 4px; }
  #bar .zm span { min-width: 46px; text-align: center; color: var(--mu); }
  #pages { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 12px 60px; }
  .pg { position: relative; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.45); flex: none; }
  .pg canvas { position: absolute; inset: 0; display: block; }
  .pg .no { position: absolute; right: 8px; bottom: -20px; font-size: 11px; color: var(--mu); }
  .ov { position: absolute; inset: 0; z-index: 2; }
  .ov .p { position: absolute; overflow: hidden; background: #fff; color: #1A1A1A; font-family: Arial, Helvetica, sans-serif; line-height: 1.22; overflow-wrap: anywhere; user-select: text; }
  body.orig .ov { display: none; }
  #msg { max-width: 560px; margin: 60px auto; padding: 22px 24px; background: #fff; color: #222; border-radius: 14px; line-height: 1.6; display: none; }
  #msg h2 { margin: 0 0 8px; font-size: 18px; }
  #msg ol { padding-left: 20px; }
  #msg button { font: inherit; font-weight: 700; color: #fff; background: var(--ac); border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer; }
  #load { text-align: center; color: var(--mu); padding: 60px 0; }
  @media (max-width: 640px) { #bar .nm { max-width: 60vw; } }
</style>
</head>
<body>
  <div id="bar" role="toolbar" aria-label="Thanh dịch PDF">
    <span aria-hidden="true">📄</span><span class="nm" id="nm">HaoHao PDF</span>
    <span class="st" id="st" role="status">Đang mở file…</span>
    <span class="eng" id="eng" hidden></span>
    <button id="tg" hidden>Xem bản gốc</button>
    <button id="ai" hidden title="Gemini dịch lại cả file: chậm hơn nhưng mượt, đúng ngữ cảnh hơn">✨ Dịch lại bằng AI Gemini</button>
    <span class="zm"><button id="zo" aria-label="Thu nhỏ">−</button><span id="zv">100%</span><button id="zi" aria-label="Phóng to">+</button></span>
  </div>
  <div id="load">Đang mở file PDF…</div>
  <div id="msg" role="alert"></div>
  <main id="pages"></main>
  <script type="module" src="pdfview.js"></script>
</body>
</html>
