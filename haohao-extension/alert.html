<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>HaoHao nhắc bạn</title>
<style>
  :root { --ink: #23305E; --honey: #F2B544; --honey-deep: #D98E1F; --cream: #FFFDF6; --coral: #E85D5D; --soft: #6B7394; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--cream); color: var(--ink); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  .top { display: flex; align-items: center; gap: 12px; padding: 12px 16px 10px; background: var(--honey); position: relative; }
  .stage { position: relative; width: 92px; height: 88px; flex: none; }
  .stage svg { width: 88px; height: 88px; overflow: visible; transform-origin: 50% 90%; }
  .paw { position: absolute; right: -4px; top: 34px; width: 20px; height: 20px; border-radius: 50%; background: #D98E1F; border: 2px solid #B8741A; opacity: 0; }
  .ripple { position: absolute; right: -14px; top: 24px; width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--ink); opacity: 0; }
  .say { position: absolute; right: -30px; top: -6px; background: #fff; color: var(--coral); border: 2px solid var(--ink); border-radius: 10px; padding: 1px 7px; font-weight: 800; font-size: 13px; white-space: nowrap; opacity: 0; transform: scale(.6) rotate(8deg); }
  h1 { margin: 0; font-size: 19px; font-weight: 800; line-height: 1.2; }
  .top p { margin: 3px 0 0; font-size: 13px; }

  body.knock .stage svg { animation: lean 1.1s ease-in-out; }
  body.knock .paw { animation: tap 1.1s ease-in-out; }
  body.knock .r1 { animation: ring 1.1s ease-out; }
  body.knock .r2 { animation: ring 1.1s ease-out .28s; }
  body.knock .say { animation: pop 1.6s ease-out forwards; }
  body.knock #list { animation: jolt 1.1s ease-in-out; }
  @keyframes lean { 0%,100% { transform: none; } 15%,45% { transform: rotate(8deg) translateX(4px); } 30%,60% { transform: rotate(3deg); } }
  @keyframes tap { 0%,100% { opacity: 0; transform: scale(.6); } 12%,42% { opacity: 1; transform: scale(1.35); } 25%,55% { opacity: 1; transform: scale(.9); } 70% { opacity: 0; } }
  @keyframes ring { 0% { opacity: 0; transform: scale(.3); } 15% { opacity: .9; } 100% { opacity: 0; transform: scale(2.2); } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.6) rotate(8deg); } 15% { opacity: 1; transform: scale(1.1) rotate(-4deg); } 30%,80% { opacity: 1; transform: scale(1) rotate(-4deg); } 100% { opacity: 0; } }
  @keyframes jolt { 15%,45% { transform: translateY(2px); } 30%,60% { transform: translateY(-1px); } }

  #list { flex: 1; overflow-y: auto; padding: 10px 14px 14px; }
  .card { background: #fff; border: 2px solid var(--ink); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 4px 4px 0 var(--coral); }
  .card .t { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--soft); font-weight: 600; }
  .card .x { font-size: 17px; font-weight: 700; margin: 3px 0 10px; word-break: break-word; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  button { all: unset; cursor: pointer; padding: 7px 10px; border-radius: 10px; font-weight: 700; font-size: 13px; border: 2px solid var(--ink); }
  button.main { background: var(--ink); color: #fff; }
  button:hover { filter: brightness(1.08); } button:not(.main):hover { background: #FFF0C7; }
  button:focus-visible { outline: 3px solid var(--honey-deep); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { body.knock * { animation: none !important; } }
</style>
</head>
<body>
  <div class="top">
    <div class="stage" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <circle cx="28" cy="24" r="11" fill="#D98E1F"/><circle cx="72" cy="24" r="11" fill="#D98E1F"/>
        <circle cx="28" cy="24" r="5.5" fill="#FFC2AE"/><circle cx="72" cy="24" r="5.5" fill="#FFC2AE"/>
        <ellipse cx="50" cy="56" rx="42" ry="38" fill="#FFD27A" stroke="#D98E1F" stroke-width="2"/>
        <ellipse cx="50" cy="66" rx="26" ry="22" fill="#FFF3DC"/>
        <circle cx="37" cy="49" r="6.5" fill="#23305E"/><circle cx="63" cy="49" r="6.5" fill="#23305E"/>
        <circle cx="39" cy="47" r="2.2" fill="#fff"/><circle cx="65" cy="47" r="2.2" fill="#fff"/>
        <ellipse cx="28" cy="62" rx="6.5" ry="4.2" fill="#FF9F8E"/><ellipse cx="72" cy="62" rx="6.5" ry="4.2" fill="#FF9F8E"/>
        <ellipse cx="50" cy="61" rx="6" ry="5" fill="#23305E"/>
        <ellipse cx="39" cy="89" rx="7" ry="4" fill="#D98E1F"/><ellipse cx="61" cy="89" rx="7" ry="4" fill="#D98E1F"/>
      </svg>
      <div class="paw"></div><div class="ripple r1"></div><div class="ripple r2"></div>
      <div class="say">Cốc! Cốc!</div>
    </div>
    <div>
      <h1 id="head">Cốc cốc! Tới giờ rồi</h1>
      <p id="sub">HaoHao nhắc bạn nè</p>
    </div>
  </div>
  <div id="list" role="list"></div>
<script src="common.js"></script>
<script src="i18n.js"></script>
<script src="i18n-page.js"></script>
<script src="alert.js"></script>
</body>
</html>
