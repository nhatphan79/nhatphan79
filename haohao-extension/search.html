<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HaoHao: tìm kiếm</title>
<style>
  :root { --ink: #23305E; --soft: #6B7394; --honey: #F2B544; --blue: #2E7DD7; --line: #E3E6F0; --paper: #FFFDF6; --sky: #EAF1FF; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--sky); color: var(--ink); font: 14px/1.5 "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 60px; }
  .hd { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .hd img { width: 52px; height: 52px; transform: rotate(-6deg); }
  .hd h1 { margin: 0; font-size: 22px; font-weight: 800; }
  .hd p { margin: 0; color: var(--soft); font-size: 13px; }
  form { display: flex; gap: 8px; background: var(--paper); border: 2.5px solid var(--blue); border-radius: 999px; padding: 6px 6px 6px 18px; box-shadow: 0 6px 18px rgba(35,48,94,.12); }
  form input { all: unset; flex: 1; min-width: 0; font-size: 17px; }
  form button { all: unset; cursor: pointer; background: var(--blue); color: #fff; font-weight: 700; padding: 9px 18px; border-radius: 999px; }
  form button:focus-visible, .chip:focus-visible, .r button:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }
  .web { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 20px; }
  .chip { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 999px; background: var(--paper); border: 1.5px solid var(--line); font-weight: 600; font-size: 13px; }
  .chip:hover { border-color: var(--ink); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--soft); margin: 18px 0 6px; }
  .r { background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start; }
  .r.hit { border-color: var(--honey); box-shadow: 0 0 0 4px rgba(242,181,68,.3); }
  .r .ic { font-size: 20px; line-height: 1.3; }
  .r .bd { flex: 1; min-width: 0; }
  .r .tt { font-weight: 700; word-break: break-word; }
  .r .tt a { color: inherit; }
  .r .sb { font-size: 12px; color: var(--soft); }
  .r .more { white-space: pre-wrap; font-size: 13px; margin-top: 6px; color: #3A4470; max-height: 240px; overflow: auto; }
  .r.dn .tt { text-decoration: line-through; color: #9AA1BE; }
  .r button { all: unset; cursor: pointer; font-size: 12.5px; font-weight: 700; padding: 5px 10px; border-radius: 8px; border: 1.5px solid var(--ink); white-space: nowrap; }
  .r button:hover { background: #FFF0C7; }
  mark { background: #FFE08A; color: inherit; border-radius: 3px; padding: 0 1px; }
  .empty { color: var(--soft); padding: 12px 2px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .acts button { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--ink); font-weight: 700; font-size: 13px; background: var(--paper); }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #E6EAF8; --soft: #A3ABCB; --line: #34406B; --paper: #172042; --sky: #10172F; }
    .r .more { color: #C9CEDF; } .r button:hover, .acts button:hover { background: #2A3663; } mark { color: #23305E; }
  }
</style>
</head>
<body>
<main>
  <div class="hd"><img src="icons/icon128.png" alt=""><div><h1>Tìm kiếm chung</h1><p>Tìm trong Todo, Note, Nhắc nhở, cảnh báo giá, đồ đã lưu, coin, và trên web.</p></div></div>
  <form id="f" role="search"><input id="q" type="search" placeholder="Gõ để tìm, có dấu hay không đều được…" aria-label="Tìm kiếm" autofocus><button>Google</button></form>
  <div class="web" id="web"></div>
  <div id="out" aria-live="polite"></div>
</main>
<script src="common.js"></script>
<script src="search.js"></script>
</body>
</html>
